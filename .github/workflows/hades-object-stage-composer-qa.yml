name: HADES Object Stage Composer — REAL REVIEW browser and hosted QA
on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/hades-object-stage-composer-qa.yml"
      - "hades/library/object-stages/composer/**"
      - "hades/fa/library/object-stages/composer/**"
      - "site/public/hades/library/object-stages/composer/**"
      - "site/public/hades/fa/library/object-stages/composer/**"
      - "hades/index.html"
      - "hades/fa/index.html"
      - "hades/library/index.html"
      - "hades/fa/library/index.html"
      - "hades/brand-kit/logo-usage/index.html"
      - "hades/fa/brand-kit/logo-usage/index.html"
      - "hades/downloads/HADES_Public_Overview_*.md"
jobs:
  qa:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          python -m pip install --disable-pip-version-check playwright pillow
          python -m playwright install --with-deps chromium
      - name: Mirror and protected original asset checks
        run: |
          python - <<'PY'
          import hashlib
          from pathlib import Path
          files=['library/object-stages/composer/index.html','fa/library/object-stages/composer/index.html','library/object-stages/composer/stage-composer.js','library/object-stages/composer/README_REVIEW.md','library/object-stages/composer/HADES_Platform_Geometry_A4_FA_EN_REVIEW.svg','library/object-stages/composer/HADES_Alpha_Bounds_A4_FA_EN_REVIEW.svg']
          for f in files:
              assert (Path('site/public/hades')/f).read_bytes()==(Path('hades')/f).read_bytes(),f
          assert (Path('hades/library/object-stages/HADES_Object_Stage_16x9_REVIEW.svg')).exists()
          assert 'PUBLIC REVIEW' in (Path('hades/library/object-stages/composer/stage-composer.js')).read_text()
          link='/hades/library/object-stages/composer/HADES_Platform_Geometry_A4_FA_EN_REVIEW.svg'
          navs=['index.html','fa/index.html','library/index.html','fa/library/index.html','brand-kit/logo-usage/index.html','fa/brand-kit/logo-usage/index.html']
          for nav in navs:
              source=(Path('site/public/hades')/nav).read_bytes()
              assert source==(Path('hades')/nav).read_bytes(),nav
              assert link.encode() in source,nav
          for lang in ['EN','FA']:
              f='downloads/HADES_Public_Overview_'+lang+'.md'
              assert (Path('site/public/hades')/f).read_bytes()==(Path('hades')/f).read_bytes()
              assert link.encode() in (Path('hades')/f).read_bytes()
          print('PASS: 5/5 mirrored composer files; existing SVG sources referenced, not modified')
          PY
      - name: Real Chromium 320, 390, 430 EN + FA with exports
        run: |
          python -m http.server 8765 >/tmp/hades-composer-server.log 2>&1 &
          mkdir -p /tmp/hades-composer-proof
          python - <<'PY'
          import asyncio,io,xml.etree.ElementTree as ET
          from PIL import Image
          from playwright.async_api import async_playwright
          async def check():
            im=Image.new('RGBA',(60,90),(235,75,50,220)); b=io.BytesIO(); im.save(b,format='PNG'); raw=b.getvalue()
            async with async_playwright() as p:
              browser=await p.chromium.launch(headless=True,args=['--no-sandbox'])
              for lang in ['en','fa']:
                path='library/object-stages/composer/' if lang=='en' else 'fa/library/object-stages/composer/'
                for width in [320,390,430]:
                  page=await browser.new_page(viewport={'width':width,'height':820},accept_downloads=True)
                  response=await page.goto('http://127.0.0.1:8765/hades/'+path,wait_until='networkidle')
                  assert response.status==200
                  await page.wait_for_function('!document.getElementById("savePNG").disabled')
                  assert not await page.evaluate('document.documentElement.scrollWidth>innerWidth+1'),(lang,width,'overflow')
                  await page.locator('#subjectFile').set_input_files({'name':'local-object.png','mimeType':'image/png','buffer':raw})
                  await page.locator('#positionX').evaluate('(e)=>{e.value="65";e.dispatchEvent(new Event("input",{bubbles:true}))}')
                  await page.locator('#subjectScale').evaluate('(e)=>{e.value="28";e.dispatchEvent(new Event("input",{bubbles:true}))}')
                  async with page.expect_download() as ev:
                    await page.locator('#saveSVG').click()
                  svg=await (await ev.value).path()
                  root=ET.parse(svg).getroot()
                  elems=list(root.iter('{http://www.w3.org/2000/svg}image'))
                  assert len(elems)==2,(lang,width,len(elems))
                  assert 'data:image/svg+xml;base64,' in elems[0].get('href')
                  assert 'data:image/png;base64,' in elems[1].get('href')
                  async with page.expect_download() as ev2:
                    await page.locator('#savePNG').click()
                  png=Image.open(await (await ev2.value).path())
                  assert png.size==(1920,1080),png.size
                  assert png.convert('RGB').getpixel((192,108)) != (239,75,50), 'Preview guide leaked into exported PNG'
                  await page.screenshot(path=f'/tmp/hades-composer-proof/{lang}_{width}.png',full_page=True)
                  print('PASS',lang,width,'real local input, SVG 2 layers, native PNG 1920x1080, responsive')
                  await page.close()
              await browser.close()
          asyncio.run(check())
          PY
      - name: New plinth controls, all three ratios, unchanged source and JSON roundtrip
        run: |
          python - <<'PY'
          import asyncio,base64,hashlib,io,json,xml.etree.ElementTree as ET
          from pathlib import Path
          from PIL import Image
          from playwright.async_api import async_playwright
          async def test():
            f=io.BytesIO();Image.new('RGBA',(60,90),(239,75,50,220)).save(f,'PNG')
            async with async_playwright() as p:
              browser=await p.chromium.launch(headless=True,args=['--no-sandbox'])
              for lang in ['en','fa']:
                path='library/object-stages/composer/' if lang=='en' else 'fa/library/object-stages/composer/'
                page=await browser.new_page(viewport={'width':430,'height':850},accept_downloads=True)
                await page.goto('http://127.0.0.1:8765/hades/'+path,wait_until='networkidle')
                await page.locator('#subjectFile').set_input_files({'name':'fixture.png','mimeType':'image/png','buffer':f.getvalue()})
                for ratio,size in {'16x9':(1920,1080),'9x16':(1080,1920),'1x1':(1080,1080)}.items():
                  await page.locator('#ratio').select_option(ratio)
                  await page.wait_for_function('(r)=>document.querySelector("#ratio").value===r && !document.querySelector("#savePNG").disabled',arg=ratio)
                  await page.locator('#plinthGuides').check()
                  await page.locator('#alignBase').click()
                  assert not await page.evaluate('document.documentElement.scrollWidth>innerWidth+1')
                  async with page.expect_download() as dl:await page.locator('#saveSVG').click()
                  root=ET.parse(await (await dl.value).path()).getroot()
                  images=list(root.iter('{http://www.w3.org/2000/svg}image'))
                  assert len(images)==2
                  original=base64.b64decode(images[0].get('href').split(',',1)[1])
                  assert hashlib.sha256(original).digest()==hashlib.sha256(Path('hades/library/object-stages/HADES_Object_Stage_'+ratio+'_REVIEW.svg').read_bytes()).digest()
                  async with page.expect_download() as dl:await page.locator('#savePNG').click()
                  png=Image.open(await (await dl.value).path());assert png.size==size,(ratio,png.size)
                  async with page.expect_download() as dl:await page.locator('#saveJSON').click()
                  saved=json.loads(Path(await (await dl.value).path()).read_text())
                  assert saved['ratio']==ratio and saved['view']['plinthGuides'] is True
                  await page.locator('#remove').click()
                  await page.locator('#plinthGuides').uncheck()
                  await page.locator('#loadJSON').set_input_files({'name':'settings.json','mimeType':'application/json','buffer':json.dumps(saved).encode()})
                  await page.wait_for_function('(r)=>document.querySelector("#ratio").value===r && document.querySelector("#plinthGuides").checked && !document.querySelector("#savePNG").disabled',arg=ratio)
                  assert int(await page.locator('#positionY').input_value())==saved['position']['y']
                  print('PASS',lang,ratio,'native PNG, exact stage SHA, 2 image layers, JSON restore')
                  await page.screenshot(path='/tmp/hades-composer-proof/'+lang+'_'+ratio+'_plinth.png',full_page=True)
                await page.close()
              ref=await browser.new_page()
              r=await ref.goto('http://127.0.0.1:8765/hades/library/object-stages/composer/HADES_Platform_Geometry_A4_FA_EN_REVIEW.svg')
              assert r.status==200 and await ref.locator('polygon').count()==3
              await browser.close()
          asyncio.run(test())
          PY
      - name: Real browser transparent-padding optical placement, EN FA, all ratios
        run: |
          python - <<'PY'
          import asyncio,io,json
          from pathlib import Path
          from PIL import Image,ImageDraw
          from playwright.async_api import async_playwright
          async def main():
            fixture=Image.new('RGBA',(96,128),(0,0,0,0))
            ImageDraw.Draw(fixture).rectangle((35,10,64,58),fill=(32,39,35,255))
            buf=io.BytesIO();fixture.save(buf,'PNG')
            async with async_playwright() as p:
              browser=await p.chromium.launch(headless=True,args=['--no-sandbox'])
              for lang in ['en','fa']:
                page=await browser.new_page(viewport={'width':390,'height':850},accept_downloads=True)
                path='library/object-stages/composer/' if lang=='en' else 'fa/library/object-stages/composer/'
                await page.goto('http://127.0.0.1:8765/hades/'+path,wait_until='networkidle')
                await page.locator('#subjectFile').set_input_files({'name':'fixture.png','mimeType':'image/png','buffer':buf.getvalue()})
                assert any(n in await page.locator('#alphaInfo').inner_text() for n in ['32','۳۲'])
                for ratio,size in {'16x9':(1920,1080),'9x16':(1080,1920),'1x1':(1080,1080)}.items():
                  await page.locator('#ratio').select_option(ratio)
                  await page.wait_for_function('!document.querySelector("#savePNG").disabled')
                  await page.locator('#alignBase').click()
                  old=int(await page.locator('#positionY').input_value())
                  await page.locator('#alignVisible').click()
                  new=int(await page.locator('#positionY').input_value())
                  assert abs(new-old)>5,(lang,ratio,old,new)
                  assert await page.locator('#alphaGuides').is_checked()
                  assert not await page.evaluate('document.documentElement.scrollWidth>innerWidth+1')
                  async with page.expect_download() as event:await page.locator('#savePNG').click()
                  assert Image.open(await (await event.value).path()).size==size
                  async with page.expect_download() as event:await page.locator('#saveJSON').click()
                  state=json.loads(Path(await (await event.value).path()).read_text())
                  assert state['view']['alphaGuides']
                  await page.locator('#remove').click()
                  await page.locator('#loadJSON').set_input_files({'name':'settings.json','mimeType':'application/json','buffer':json.dumps(state).encode()})
                  await page.wait_for_function('document.querySelector("#alphaInfo").textContent.includes("32") || document.querySelector("#alphaInfo").textContent.includes("۳۲")')
                  assert await page.locator('#alphaGuides').is_checked()
                  print('PASS alpha',lang,ratio,old,new,'PNG, JSON, optical bounds')
                await page.screenshot(path='/tmp/hades-composer-proof/'+lang+'_alpha_bounds.png',full_page=True)
                await page.close()
              ref=await browser.new_page()
              r=await ref.goto('http://127.0.0.1:8765/hades/library/object-stages/composer/HADES_Alpha_Bounds_A4_FA_EN_REVIEW.svg')
              assert r.status==200 and await ref.locator('svg').count()==1
              await browser.close()
          asyncio.run(main())
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hades-object-composer-six-chromium-review
          path: /tmp/hades-composer-proof/
          if-no-files-found: ignore
      - name: Independent hosted HTTP 200 MIME SHA-256 — not build status
        run: |
          python - <<'PY'
          import hashlib,time,urllib.request
          from pathlib import Path
          files=['library/object-stages/composer/index.html','fa/library/object-stages/composer/index.html','library/object-stages/composer/stage-composer.js','library/object-stages/composer/HADES_Platform_Geometry_A4_FA_EN_REVIEW.svg','library/object-stages/composer/HADES_Alpha_Bounds_A4_FA_EN_REVIEW.svg','index.html','fa/index.html','library/index.html','fa/library/index.html','brand-kit/logo-usage/index.html','fa/brand-kit/logo-usage/index.html','downloads/HADES_Public_Overview_EN.md','downloads/HADES_Public_Overview_FA.md']
          errors=[]
          for attempt in range(10):
            errors=[]
            for f in files:
              try:
                req=urllib.request.Request('https://ialirezaaa.github.io/hades/'+f,headers={'User-Agent':'HADES-Composer-Review/1.0','Cache-Control':'no-cache'})
                with urllib.request.urlopen(req,timeout=22) as resp:
                  actual=resp.read()
                  typ=resp.headers.get('Content-Type','')
                  assert resp.status==200,(f,resp.status)
                  assert (('javascript' in typ or 'text/plain' in typ) if f.endswith('.js') else ('svg+xml' in typ or 'text/plain' in typ) if f.endswith('.svg') else ('text/plain' in typ or 'text/markdown' in typ or 'text/html' in typ) if f.endswith('.md') else 'text/html' in typ),(f,typ)
                  assert hashlib.sha256(actual).digest()==hashlib.sha256((Path('hades')/f).read_bytes()).digest(),f
              except Exception as ex:errors.append((f,str(ex)))
            if not errors:
              print('PASS',len(files),'/',len(files),'HTTP 200 + MIME + SHA-256 independent live checks')
              break
            print('Attempt',attempt+1,'OPEN',errors,flush=True)
            if attempt<9:time.sleep(15)
          assert not errors,errors
          PY
