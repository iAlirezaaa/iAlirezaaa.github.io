name: HADES backgrounds hosted source-parity QA

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/hades-background-hosted-qa.yml"
      - "hades/library/backgrounds/**"
      - "site/public/hades/library/backgrounds/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hosted-parity:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Verify source mirror and external GitHub Pages downloads
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib, pathlib, time, urllib.request, xml.etree.ElementTree as ET
          root=pathlib.Path('.')
          base="https://ialirezaaa.github.io/hades/library/backgrounds/"
          names=[
            "HADES_Obsidian_Vault_16x9_REVIEW",
            "HADES_Mammoth_Plaster_16x9_REVIEW",
            "HADES_Basalt_Axis_9x16_REVIEW",
            "HADES_Skeletal_Slab_1x1_REVIEW",
          ]
          relative=["index.html","fa/library/backgrounds/index.html"]
          def fetch(url, expected_sha):
            last=None
            for attempt in range(16):
              try:
                nonce=f"?source_sha={expected_sha.hex()[:12]}&attempt={attempt}"
                req=urllib.request.Request(url+nonce,headers={"User-Agent":"HADES-backgrounds-release-check/1.0","Cache-Control":"no-cache, no-store"})
                with urllib.request.urlopen(req,timeout=16) as response:
                  assert response.status==200,(response.status,url)
                  data=response.read()
                  digest=hashlib.sha256(data).digest()
                  if digest==expected_sha:
                    return data,response.headers.get("Content-Type","")
                  last=f"hosted hash {digest.hex()[:16]} vs local {expected_sha.hex()[:16]}, first bytes {data[:80]!r}"
                  print("RETRY stale/mismatched",url,last,flush=True)
              except Exception as exc:
                last=exc
              time.sleep(8)
            raise RuntimeError(f"Hosted fetch FAILED: {url}: {last}")
          for name in names:
            for ext in (".svg",".png"):
              relative.append(f"library/backgrounds/assets/{name}{ext}")
          for item in relative:
            site_rel="fa/library/backgrounds/index.html" if item.startswith("fa/") else item
            local=root/"hades"/item
            source=root/"site/public/hades"/item
            assert local.is_file() and source.is_file(),item
            data=local.read_bytes()
            assert data==source.read_bytes(),"Mirror mismatch "+item
            public_url="https://ialirezaaa.github.io/hades/fa/library/backgrounds/" if item.startswith("fa/") else base if item=="index.html" else "https://ialirezaaa.github.io/hades/"+item
            remote,mime=fetch(public_url, hashlib.sha256(data).digest())
            assert hashlib.sha256(remote).digest()==hashlib.sha256(data).digest(),"Hosted hash mismatch "+item
            if item.endswith(".svg"):
              ET.fromstring(remote)
              assert b"#EF4B32" in remote
            if item.endswith(".png"):
              assert remote.startswith(b"\x89PNG\r\n\x1a\n") and mime.startswith("image/"),(item,mime)
            if item.endswith(".html"):
              assert b"REVIEW" in remote and ("text/html" in mime),(item,mime)
            print("HOSTED PASS",item,len(remote),mime,flush=True)
          print("HADES Backgrounds hosted source-byte parity PASS 10/10; site render on device, print and owner FINAL remain open.")
          PY
