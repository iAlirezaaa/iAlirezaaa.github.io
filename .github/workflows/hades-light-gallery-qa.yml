name: HADES Light Gallery / source, browser, live Pages
on:
  push:
    paths:
      - 'hades/library/light-gallery/**'
      - 'site/public/hades/**/light-gallery/**'
      - '.github/workflows/hades-light-gallery-qa.yml'
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Local source, original-logo checksum, XML and mirror validation
        run: |
          python - <<'PY'
          import pathlib,base64,hashlib,xml.etree.ElementTree as ET
          root=pathlib.Path('hades/library/light-gallery')
          for loc in ('', 'fa/'):
              html=pathlib.Path('hades')/loc/'library/light-gallery/index.html'
              raw=html.read_bytes()
              assert b'PUBLIC REVIEW' in raw and b'@media(max-width:430px)' in raw
              assert raw==(pathlib.Path('site/public')/html).read_bytes()
          for ratio,dim in [('16x9',(1920,1080)),('9x16',(1080,1920)),('1x1',(1080,1080))]:
              for lang in ('EN','FA'):
                  p=root/f'HADES_Light_Gallery_{ratio}_{lang}_REVIEW.svg'
                  raw=p.read_bytes()
                  assert raw==(pathlib.Path('site/public')/p).read_bytes()
                  node=ET.fromstring(raw)
                  assert tuple(int(node.attrib[a]) for a in ('width','height'))==dim
                  imgs=[n for n in node.iter() if n.tag.endswith('image')]
                  assert len(imgs)==1
                  href=imgs[0].attrib['href']
                  assert href.startswith('data:image/png;base64,')
                  img=base64.b64decode(href.split(',',1)[1],validate=True)
                  assert hashlib.sha256(img).hexdigest()=='79867ef2cea0777a277df45a2754ea012ff552d466963f8cb831e5940a5cafb7'
          print('PASS: 8 source/deploy pairs, 6 valid XML, same owner-original PNG SHA256')
          PY
      - name: Install Chromium for real mobile browser checks
        run: |
          python -m pip install playwright==1.56.0
          python -m playwright install --with-deps chromium
      - name: Six real browser tests, image decode, no overflow, screenshots
        run: |
          python -m http.server 8765 >/tmp/hades-light-gallery-http.log 2>&1 &
          python - <<'PY'
          import pathlib
          from playwright.sync_api import sync_playwright
          out=pathlib.Path('light-gallery-browser-proof')
          out.mkdir(exist_ok=True)
          with sync_playwright() as p:
              browser=p.chromium.launch(headless=True)
              for lang in ('en','fa'):
                  for width in (320,390,430):
                      page=browser.new_page(viewport={'width':width,'height':960},device_scale_factor=1)
                      loc='/hades/fa/library/light-gallery/' if lang=='fa' else '/hades/library/light-gallery/'
                      response=page.goto('http://127.0.0.1:8765'+loc,wait_until='networkidle')
                      assert response and response.status==200
                      assert page.locator('article.card img').count()==3
                      page.wait_for_function("Array.from(document.querySelectorAll('article.card img')).every(i=>i.complete&&i.naturalWidth>0)")
                      assert page.locator('html').get_attribute('dir')==('rtl' if lang=='fa' else 'ltr')
                      scroll=page.evaluate('document.documentElement.scrollWidth')
                      assert scroll<=width+1,(lang,width,scroll)
                      page.screenshot(path=str(out/f'HADES_Light_Gallery_{lang}_{width}_REVIEW.png'),full_page=True)
                      print('PASS real Chromium',lang,width,'decoded images 3/3, no overflow')
                      page.close()
              browser.close()
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: HADES-Light-Gallery-Chromium-PUBLIC-REVIEW
          path: light-gallery-browser-proof/
          if-no-files-found: ignore
      - name: Independently verify LIVE Pages HTTP 200 MIME and exact bytes
        run: |
          python - <<'PY'
          import pathlib,urllib.request,urllib.parse,time,hashlib
          base='https://ialirezaaa.github.io/'
          files=[pathlib.Path('hades')/loc/'library/light-gallery/index.html' for loc in ('','fa/')]
          files += [pathlib.Path('hades/library/light-gallery')/f'HADES_Light_Gallery_{ratio}_{lang}_REVIEW.svg' for ratio in ('16x9','9x16','1x1') for lang in ('EN','FA')]
          pending={}
          for attempt in range(24):
              pending={}
              for f in files:
                  try:
                      url=base+str(f).replace('index.html','')+'?review_audit='+str(attempt)
                      req=urllib.request.Request(url,headers={'User-Agent':'HADES-live-asset-preflight/1.0'})
                      with urllib.request.urlopen(req,timeout=18) as response:
                          body=response.read()
                          mime=response.headers.get('Content-Type','').split(';',1)[0].lower()
                          expect='image/svg+xml' if f.suffix=='.svg' else 'text/html'
                          assert response.status==200 and mime==expect,(response.status,mime,expect)
                          assert hashlib.sha256(body).digest()==hashlib.sha256(f.read_bytes()).digest()
                  except Exception as e:
                      pending[str(f)]=str(e)
              if not pending:
                  print('PASS independent live Pages HTTP200 MIME exact SHA256',len(files),'/',len(files))
                  break
              print('OPEN live Pages attempt',attempt+1,'remaining',len(pending))
              if attempt<23:time.sleep(12)
          assert not pending,('Unverified live files',pending)
          PY
