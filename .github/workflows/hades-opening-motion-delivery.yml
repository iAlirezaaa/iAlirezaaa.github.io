name: HADES opening motion delivery and QA
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/hades-opening-motion-delivery.yml'
permissions:
  contents: write
concurrency:
  group: hades-opening-motion-delivery
  cancel-in-progress: false
jobs:
  delivery:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pillow playwright && python -m playwright install --with-deps chromium
      - run: python site/scripts/hades-opening-motion-qa.py local
      - run: python site/scripts/hades-opening-motion-qa.py binary
      - run: python site/scripts/hades-opening-motion-qa.py local
      - name: Publish actual binary files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add hades/library/backgrounds/quiet-courts/opening-titles/motion-presets hades/fa/library/backgrounds/quiet-courts/opening-titles/motion-presets site/public/hades/library/backgrounds/quiet-courts/opening-titles/motion-presets site/public/hades/fa/library/backgrounds/quiet-courts/opening-titles/motion-presets
          if ! git diff --cached --quiet; then git commit -m 'Publish opening motion transparent PNG sample and SVG pack (REVIEW)'; fi
          for n in 1 2 3 4 5; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then break; fi
            if [ "$n" = 5 ]; then exit 1; fi
          done
          git ls-tree -r HEAD -- hades/library/backgrounds/quiet-courts/opening-titles/motion-presets
          git fetch origin main
          git merge-base --is-ancestor HEAD origin/main
      - name: Independent public access
        run: python site/scripts/hades-opening-motion-qa.py hosted
