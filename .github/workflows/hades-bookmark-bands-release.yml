name: HADES bookmark bands / publish A4 PDF PNG WebP ZIP PUBLIC REVIEW
on:
  push:
    branches: [main]
    paths:
      - "site/scripts/render-hades-bookmark-bands-review.py"
      - "site/scripts/qa-hades-bookmark-bands.py"
      - ".github/workflows/hades-bookmark-bands-release.yml"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: hades-band-release
  cancel-in-progress: false
jobs:
  render-commit-and-verify-host:
    runs-on: ubuntu-latest
    timeout-minutes: 24
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install real raster/PDF renderers
        run: |
          python -m pip install pillow PyMuPDF playwright
          python -m playwright install --with-deps chromium
      - name: Generate and validate source-locked PDFs, PNG, WebP, ZIP
        run: python site/scripts/render-hades-bookmark-bands-review.py
      - name: QA real Chromium EN/FA at 320, 390 and 430 pixels
        run: HADES_QA_LOCAL_ONLY=1 python site/scripts/qa-hades-bookmark-bands.py
      - name: Upload six actual bilingual mobile screenshots
        uses: actions/upload-artifact@v4
        with:
          name: HADES-Bookmark-Bands-6-Real-Chromium-Mobile-REVIEW
          path: hades-band-review-screenshots/
          if-no-files-found: error
          retention-days: 21
      - name: Save actual rendered proofs
        uses: actions/upload-artifact@v4
        with:
          name: HADES-Bookmark-Bands-PDF-PNG-WEBP-PUBLIC-REVIEW
          path: site/public/hades/library/bookmark-bands/raster/
          if-no-files-found: error
          retention-days: 21
      - name: Commit actual binary files into both Pages trees
        id: publish
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/public/hades/library/bookmark-bands/raster/ hades/library/bookmark-bands/raster/
          if git diff --cached --quiet; then
            echo "Already identical, no new commit needed."
            echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "Publish HADES bookmark A4 PDF PNG WebP and SHA ZIP (REVIEW)"
          for attempt in 1 2 3 4 5; do
            if git push origin HEAD:main; then
              echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            git fetch origin main
            git rebase origin/main || { git rebase --abort || :; exit 1; }
            sleep 4
          done
          exit 1
      - name: Independently verify every published download over GitHub Pages HTTP
        env:
          RELEASE_SHA: ${{ steps.publish.outputs.sha }}
        run: |
          python - <<'PY'
          import hashlib, os, time, urllib.request, json, datetime
          from pathlib import Path
          local = Path('hades/library/bookmark-bands/raster')
          files = sorted(p for p in local.iterdir() if p.is_file() and p.name != 'HADES_Bands_Hosted_HTTP_QA_REVIEW.json')
          verified=[]
          assert len(files) == 9, len(files)
          root='https://ialirezaaa.github.io/hades/library/bookmark-bands/raster/'
          for p in files:
              expect=hashlib.sha256(p.read_bytes()).hexdigest()
              url=root+p.name+'?release='+os.environ['RELEASE_SHA'][:12]
              errors=[]
              for attempt in range(18):
                  try:
                      req=urllib.request.Request(url,headers={'Cache-Control':'no-cache','User-Agent':'Hades-Public-Release-QA'})
                      with urllib.request.urlopen(req,timeout=20) as response:
                          data=response.read()
                          code=response.status
                          mime=response.headers.get('Content-Type','').split(';')[0].lower()
                      if code != 200 or hashlib.sha256(data).hexdigest()!=expect:
                          raise ValueError(f'HTTP {code} or SHA mismatch')
                      allowed={'.png':['image/png'],'.webp':['image/webp'],'.pdf':['application/pdf'],
                               '.json':['application/json','text/plain'],
                               '.txt':['text/plain','application/octet-stream'],
                               '.zip':['application/zip','application/x-zip-compressed','application/octet-stream']}
                      if mime not in allowed.get(p.suffix,[]):
                          raise ValueError(f'Unexpected MIME {mime}')
                      verified.append({'file': p.name, 'http': code, 'mime': mime, 'bytes':len(data), 'sha256':expect})
                      print('PASS',p.name,'HTTP',code,'MIME',mime,'bytes',len(data),'SHA',expect[:12],flush=True)
                      break
                  except Exception as e:
                      errors.append(str(e))
                      if attempt==17: raise RuntimeError(f'PUBLIC OPEN: {p.name}: {errors[-1]}')
                      time.sleep(12)
          print('PASS',len(files),'independent live GitHub Pages HTTP/MIME/SHA checks')
          proof = {'status':'PASS — PUBLIC REVIEW, NOT FINAL',
                   'verified_at_utc':datetime.datetime.now(datetime.timezone.utc).isoformat(),
                   'release_commit':os.environ['RELEASE_SHA'],
                   'test':'Independent GitHub Pages HTTP 200, exact MIME, SHA-256 byte verification',
                   'checked_count':len(verified), 'checks':verified,
                   'physical_print':'OPEN', 'real_phone_48_96px':'OPEN','mikhak_file':'OPEN'}
          for path in (Path('site/public/hades/library/bookmark-bands/raster'),
                       Path('hades/library/bookmark-bands/raster')):
              (path/'HADES_Bands_Hosted_HTTP_QA_REVIEW.json').write_text(
                  json.dumps(proof,indent=2,ensure_ascii=False)+'\n',encoding='utf-8')
          PY
      - name: Commit hosted HTTP proof only after all remote checks succeed
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/public/hades/library/bookmark-bands/raster/HADES_Bands_Hosted_HTTP_QA_REVIEW.json hades/library/bookmark-bands/raster/HADES_Bands_Hosted_HTTP_QA_REVIEW.json
          git commit -m "Verify HADES bookmark hosted PDF PNG WebP ZIP HTTP SHA (REVIEW)"
          for attempt in 1 2 3 4 5; do
            if git push origin HEAD:main; then exit 0; fi
            git fetch origin main
            git rebase origin/main || { git rebase --abort || :; exit 1; }
            sleep 4
          done
          exit 1
