name: HADES email signature LIVE Pages HTTPS verify (REVIEW)
on:
  push:
    branches: [main]
    paths:
      - "site/scripts/verify-hades-email-signature-live.mjs"
      - ".github/workflows/hades-signature-live-qa.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  live:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Verify actual public HTTPS and content parity (OPEN allowed)
        run: node site/scripts/verify-hades-email-signature-live.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hades-email-signature-LIVE-HTTPS-REVIEW
          path: artifacts/hades-signature-live/
          if-no-files-found: warn
