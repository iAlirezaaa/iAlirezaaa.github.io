name: Audit public animation source (one-time review)
on:
  push:
    branches: [review/animation-library-20261126]
    paths: ['.github/workflows/animation-source-review.yml']
permissions: {}
jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Inventory explicitly published animation pages
        shell: bash
        run: |
          python - <<'PY'
          import json, re, urllib.parse, urllib.request, time, sys
          BASE='https://publish-01.obsidian.md'
          UID='ac91145294ec684ce004ccf30ee3e5ab'
          def fetch(url, limit=8_000_000):
              req=urllib.request.Request(url,headers={'User-Agent':'Hades educational source review/1.0','Accept':'*/*'})
              with urllib.request.urlopen(req,timeout=15) as r:
                  if urllib.parse.urlparse(r.url).hostname not in {'mister-chad.com','publish-01.obsidian.md'}: raise ValueError('unexpected redirect host')
                  data=r.read(limit+1)
                  if len(data)>limit: raise ValueError('size limit')
                  return data
          cache=json.loads(fetch(BASE+'/cache/'+UID))
          def walk(v):
              if isinstance(v,dict):
                  for k,x in v.items():
                      if isinstance(k,str) and (k.lower().endswith('.md') or k.lower().endswith(('.png','.jpg','.jpeg','.gif','.webp','.svg'))): yield k
                      yield from walk(x)
              elif isinstance(v,list):
                  for x in v: yield from walk(x)
              elif isinstance(v,str) and v.lower().endswith(('.md','.png','.jpg','.jpeg','.gif','.webp','.svg')): yield v
          paths=sorted(set(walk(cache)))
          notes=[p for p in paths if p.lower().startswith('animation/') and p.lower().endswith('.md')]
          licenses=[p for p in paths if re.search(r'(?:^|/)(?:!?\s*uncopyright|license|licence)\.md$',p,re.I)]
          print('SOURCE_INVENTORY '+json.dumps({'cache_type':type(cache).__name__,'animation':notes,'license':licenses},ensure_ascii=False),flush=True)
          if not notes: sys.exit('No published animation paths recovered')
          for p in licenses[:2]:
              data=fetch(BASE+'/access/'+UID+'/'+urllib.parse.quote(p,safe='/'),80000).decode('utf-8')
              # only metadata about permission; do not echo the note
              print('SOURCE_LICENSE '+json.dumps({'path':p,'cc0':bool(re.search(r'CC0|public domain',data,re.I)),'commercial':bool(re.search(r'commercial',data,re.I)),'exceptions':bool(re.search(r'other people|third.party|unless|except|not mine|copyrighted',data,re.I)),'url':'https://mister-chad.com/'+urllib.parse.quote(p[:-3],safe='/')},ensure_ascii=False),flush=True)
          for p in notes[:100]:
              data=fetch(BASE+'/access/'+UID+'/'+urllib.parse.quote(p,safe='/'),300000).decode('utf-8')
              refs=re.findall(r'!\[\[([^\]]+)\]\]|!\[[^\]]*\]\(([^)]+)\)|<img\b[^>]*\bsrc=["\x27]([^"\x27]+)',data,re.I)
              names=[next(x for x in r if x) for r in refs]
              images=[]
              for name in names:
                  n=name.split('|')[0].split('#')[0].strip()
                  matches=[q for q in paths if q==n or q.endswith('/'+n)]
                  images.append({'reference':name,'paths':matches[:8]})
              print('SOURCE_PAGE '+json.dumps({'path':p,'headings':re.findall(r'^#{1,6}\s+(.+)$',data,re.M)[:20],'linked_notes':list(dict.fromkeys(re.findall(r'(?<!!)\[\[([^\]]+)\]\]',data)))[:35],'images':images,'rights_markers':bool(re.search(r'copyright|\u00a9|credit|courtesy',data,re.I)),'characters':len(data)},ensure_ascii=False),flush=True)
              time.sleep(.35)
          PY
