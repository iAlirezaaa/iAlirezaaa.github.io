name: Audit public animation image provenance (one-time review)
on:
  push:
    branches: [review/animation-library-20261126]
    paths: ['.github/workflows/animation-source-review.yml']
permissions: {}
jobs:
  provenance:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Read license and identify image authors
        shell: bash
        run: |
          python - <<'PY'
          import json, re, urllib.parse, urllib.request, time
          BASE='https://publish-01.obsidian.md'; UID='ac91145294ec684ce004ccf30ee3e5ab'
          def get(path,limit=300000):
              url=BASE+'/access/'+UID+'/'+urllib.parse.quote(path,safe='/')
              with urllib.request.urlopen(urllib.request.Request(url,headers={'User-Agent':'Hades educational source review/1.0'}),timeout=15) as r:
                  if urllib.parse.urlparse(r.url).hostname != 'publish-01.obsidian.md': raise ValueError('redirect')
                  data=r.read(limit+1)
                  if len(data)>limit: raise ValueError('size limit')
                  return data.decode('utf-8')
          license=get('random stuff/uncopyright.md')
          # Record terms and exceptions, not a mirror of the entire text.
          for line in license.splitlines():
              if re.search(r'public domain|CC0|copyright|commercial|attribut|permission|rights|mine|created|others',line,re.I):
                  print('LICENSE_CONTEXT '+json.dumps(line[:420],ensure_ascii=False),flush=True)
          pages=['5 types of animation','adobe animate basics','animating on the ones, two, and threes','aspect ratios','bouncing ball - part one','bouncing ball - part two','camera shots','environment design','five types of motion & easing','keyframes and breakdowns','lower thirds','photoshop timeline animation','sequential art','storyboards','walk cycle']
          for name in pages:
              data=get('animation/'+name+'.md')
              lines=data.splitlines()
              for i,line in enumerate(lines):
                  if not re.search(r'!\[\[|!\[[^\]]*\]\(|<img\b',line): continue
                  # Retain nearby attribution captions/links, never the article prose.
                  adjacent=[x.strip()[:300] for x in lines[max(0,i-2):i+4] if x.strip() and re.search(r'copyright|credit|source|courtesy|from\s+\[|by\s+\[|my\s+|I\s+(made|created|drew)|\u00a9|^[_*].+[_*]$',x,re.I) and not re.search(r'!\[\[|<img\b',x)]
                  print('IMAGE_CONTEXT '+json.dumps({'page':name,'refs':re.findall(r'!\[\[([^\]]+)\]\]|!\[[^\]]*\]\(([^)]+)\)|<img\b[^>]*\bsrc=["\x27]([^"\x27]+)',line,re.I),'credits':adjacent},ensure_ascii=False),flush=True)
              time.sleep(.25)
          PY
