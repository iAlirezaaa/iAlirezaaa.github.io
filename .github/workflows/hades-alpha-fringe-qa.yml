name: HADES alpha fringe diagnostic / PUBLIC REVIEW browser and hosted QA
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/hades-alpha-fringe-qa.yml'
      - 'hades/library/object-stages/composer/**'
      - 'site/public/hades/library/object-stages/composer/**'
      - 'hades/fa/library/object-stages/composer/**'
      - 'site/public/hades/fa/library/object-stages/composer/**'
permissions:
  contents: read
jobs:
  qa:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install browser and image fixture libraries
        run: |
          python -m pip install playwright==1.56.0 pillow==11.3.0
          python -m playwright install --with-deps chromium
      - name: Verify source and deployed mirror, guide A4, no source mutation
        run: |
          python - <<'PY'
          from pathlib import Path
          from xml.etree import ElementTree as ET
          files=['library/object-stages/composer/index.html','fa/library/object-stages/composer/index.html','library/object-stages/composer/stage-composer.js','library/object-stages/composer/README_REVIEW.md','library/index.html','fa/library/index.html','downloads/HADES_Public_Overview_EN.md','downloads/HADES_Public_Overview_FA.md','library/object-stages/composer/HADES_Alpha_Fringe_Diagnostic_A4_FA_EN_REVIEW.svg']
          for f in files:
            assert (Path('hades')/f).read_bytes()==(Path('site/public/hades')/f).read_bytes(),f
          r=ET.parse('hades/library/object-stages/composer/HADES_Alpha_Fringe_Diagnostic_A4_FA_EN_REVIEW.svg').getroot()
          assert (r.attrib['width'],r.attrib['height'],r.attrib['viewBox'])==('210mm','297mm','0 0 210 297')
          assert 'PUBLIC REVIEW' in (Path('hades')/'library/object-stages/composer/HADES_Alpha_Fringe_Diagnostic_A4_FA_EN_REVIEW.svg').read_text()
          script=(Path('hades')/files[2]).read_text()
          for token in ['makeFringeMask','fringePreview','describeFringe']:
            assert token in script
          print('PASS',len(files),'exact mirrored public files and valid editable A4.')
          PY
      - name: Real Chromium bilingual 320 390 430px / native export exclusion tests
        run: |
          python -m http.server 8765 >/tmp/hades-fringe-server.log 2>&1 &
          mkdir -p /tmp/hades-fringe-proofs
          python - <<'PY'
          import asyncio, hashlib, json
          from pathlib import Path
          from PIL import Image
          from playwright.async_api import async_playwright
          fixture=Path('/tmp/hades-fringe-proofs/synthetic-fixture.png')
          img=Image.new('RGBA',(80,80),(0,0,0,0))
          for y in range(80):
            for x in range(80):
              if x<20:a=0
              elif x<40:a=15
              elif x<60:a=90
              else:a=220
              img.putpixel((x,y),(225,220,206,a))
          img.save(fixture)
          async def main():
            async with async_playwright() as p:
              b=await p.chromium.launch(headless=True,args=['--no-sandbox'])
              for lang in ('en','fa'):
                for width in (320,390,430):
                  page=await b.new_page(viewport={'width':width,'height':850},accept_downloads=True)
                  route='fa/' if lang=='fa' else ''
                  resp=await page.goto('http://127.0.0.1:8765/hades/'+route+'library/object-stages/composer/',wait_until='networkidle')
                  assert resp.status==200
                  assert not await page.evaluate('document.documentElement.scrollWidth>window.innerWidth+1'),(lang,width)
                  assert await page.locator('#fringePreview').count()==1
                  await page.locator('#subjectFile').set_input_files(str(fixture))
                  await page.locator('#fringePreview').check()
                  await page.locator('#alphaThreshold').evaluate("el=>{el.value='32';el.dispatchEvent(new Event('input',{bubbles:true}));}")
                  stats=await page.locator('#fringeInfo').inner_text()
                  assert '1600' in stats,(lang,width,stats) # one alpha=15 stripe: 20*80 samples
                  for ratio in ('16x9','9x16','1x1'):
                    await page.locator('#ratio').select_option(ratio)
                    await page.wait_for_function("document.getElementById('savePNG').disabled===false")
                    before=await page.locator('#stageCanvas').evaluate('(c)=>c.toDataURL()')
                    await page.locator('#fringePreview').uncheck()
                    after=await page.locator('#stageCanvas').evaluate('(c)=>c.toDataURL()')
                    assert before!=after,(lang,width,ratio,'overlay not visible')
                    async with page.expect_download() as d1: await page.locator('#savePNG').click()
                    p1=await d1.value;file1=Path('/tmp/hades-fringe-proofs/a.png');await p1.save_as(str(file1))
                    await page.locator('#fringePreview').check()
                    async with page.expect_download() as d2: await page.locator('#savePNG').click()
                    p2=await d2.value;file2=Path('/tmp/hades-fringe-proofs/b.png');await p2.save_as(str(file2))
                    assert hashlib.sha256(file1.read_bytes()).digest()==hashlib.sha256(file2.read_bytes()).digest(),(lang,width,ratio,'PNG export altered by visual overlay')
                    with Image.open(file2) as out: assert out.size==({'16x9':(1920,1080),'9x16':(1080,1920),'1x1':(1080,1080)}[ratio])
                    async with page.expect_download() as sd: await page.locator('#saveSVG').click()
                    svg=await sd.value;sf=Path('/tmp/hades-fringe-proofs/export.svg');await svg.save_as(str(sf))
                    source=sf.read_text()
                    assert 'id="editable-subject"' in source and 'id="unchanged-stage"' in source
                    assert 'fringe' not in source.lower() and 'guide' not in source.lower()
                  async with page.expect_download() as jd: await page.locator('#saveJSON').click()
                  dl=await jd.value;jf=Path('/tmp/hades-fringe-proofs/settings.json');await dl.save_as(str(jf))
                  state=json.loads(jf.read_text())
                  assert state['view']['fringePreview'] is True and state['view']['alphaThreshold']==32
                  await page.locator('#fringePreview').uncheck()
                  await page.locator('#loadJSON').set_input_files(str(jf))
                  await page.wait_for_function('document.getElementById("fringePreview").checked')
                  await page.screenshot(path=f'/tmp/hades-fringe-proofs/{lang}_{width}.png',full_page=True)
                  print('PASS',lang,width,'3 native exports and JSON roundtrip')
                  await page.close()
              await b.close()
          asyncio.run(main())
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hades-alpha-fringe-six-responsive-review
          path: /tmp/hades-fringe-proofs/
          if-no-files-found: ignore
      - name: Independent GitHub Pages HTTPS 200 MIME SHA (not CI build proof)
        run: |
          python - <<'PY'
          import time, hashlib, urllib.request
          from pathlib import Path
          files=['library/object-stages/composer/index.html','fa/library/object-stages/composer/index.html','library/object-stages/composer/stage-composer.js','library/object-stages/composer/HADES_Alpha_Fringe_Diagnostic_A4_FA_EN_REVIEW.svg','library/object-stages/composer/README_REVIEW.md','library/index.html','fa/library/index.html','downloads/HADES_Public_Overview_EN.md','downloads/HADES_Public_Overview_FA.md']
          errors=[]
          for attempt in range(12):
            errors=[]
            for f in files:
              try:
                req=urllib.request.Request('https://ialirezaaa.github.io/hades/'+f,headers={'User-Agent':'HADES-Fringe-QA/1.0','Cache-Control':'no-cache'})
                with urllib.request.urlopen(req,timeout=20) as r:
                  assert r.status==200
                  mime=r.headers.get('Content-Type','')
                  assert (('text/html' in mime) if f.endswith('.html') else ('javascript' in mime if f.endswith('.js') else ('image/svg+xml' in mime if f.endswith('.svg') else 'text/' in mime))),(f,mime)
                  assert hashlib.sha256(r.read()).digest()==hashlib.sha256((Path('hades')/f).read_bytes()).digest(),f
              except Exception as e:errors.append((f,str(e)))
            if not errors:break
            if attempt<11:time.sleep(15)
          assert not errors,errors
          print('PASS',len(files),'independent live HTTPS 200, MIME and SHA256')
          PY
