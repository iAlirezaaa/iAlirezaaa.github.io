name: HADES original logo A4 optical proof Chromium REVIEW QA
on:
  push:
    branches: [main]
    paths:
      - 'hades/brand-kit/logo-usage/preflight/**'
      - 'site/public/hades/brand-kit/logo-usage/preflight/**'
      - 'tests/hades-logo-optical-proof.cjs'
      - '.github/workflows/hades-logo-optical-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - id: chrome
        uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: stable
      - run: npm install --prefix /tmp/hades-logo-proof --no-save --no-package-lock playwright-core
      - name: Print exact original marks to real A4 PDF; test EN/FA 320/390/430
        env:
          NODE_PATH: /tmp/hades-logo-proof/node_modules
          CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}
        run: node tests/hades-logo-optical-proof.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: HADES-Original-Logo-A4-Optical-REVIEW
          path: hades-logo-optical-proof/
          if-no-files-found: warn
