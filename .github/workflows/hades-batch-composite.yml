name: HADES batch composite sample delivery and HTTP proof
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/hades-batch-composite.yml'
      - 'scripts/hades-batch-composite.py'
permissions:
  contents: write
concurrency:
  group: hades-batch-composite
  cancel-in-progress: false
jobs:
  delivery:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pillow playwright
      - run: python -m playwright install --with-deps chromium
      - run: python scripts/hades-batch-composite.py
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add hades/library/backgrounds/quiet-courts/transitions/composite-desk hades/fa/library/backgrounds/quiet-courts/transitions/composite-desk site/public/hades/library/backgrounds/quiet-courts/transitions/composite-desk site/public/hades/fa/library/backgrounds/quiet-courts/transitions/composite-desk
          if ! git diff --cached --quiet; then git commit -m 'Publish three tested HADES composite proof ZIPs (PUBLIC REVIEW)'; fi
          for i in 1 2 3 4 5; do git pull --rebase origin main && git push origin HEAD:main && break; test "$i" != 5 || exit 1; sleep 5; done
      - name: Independent Pages byte verification
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib, urllib.request, time
          b=Path('hades/library/backgrounds/quiet-courts/transitions/composite-desk')
          files=list(b.glob('HADES_*_composite_30frames_REVIEW.zip'))+[b/'index.html',Path('hades/fa/library/backgrounds/quiet-courts/transitions/composite-desk/index.html')]
          assert len(files)==5
          for attempt in range(25):
              errors=[]
              for p in files:
                  try:
                      assert p.read_bytes()==(Path('site/public')/p).read_bytes()
                      u='https://ialirezaaa.github.io/'+str(p).removesuffix('index.html')
                      with urllib.request.urlopen(urllib.request.Request(u,headers={'Cache-Control':'no-cache','User-Agent':'HADES QA'}),timeout=15) as res:
                          allowed=['text/html'] if p.suffix=='.html' else ['application/zip','application/x-zip-compressed','application/octet-stream']
                          assert res.status==200 and res.headers.get_content_type() in allowed
                          assert hashlib.sha256(res.read()).digest()==hashlib.sha256(p.read_bytes()).digest()
                  except Exception as e: errors.append((str(p),str(e)))
              if not errors:
                  for p in files: print('HTTP 200 MIME SHA256 PASS',p)
                  break
              print('OPEN',errors,flush=True);time.sleep(15)
          else: raise SystemExit('Hosted proof OPEN')
          PY
