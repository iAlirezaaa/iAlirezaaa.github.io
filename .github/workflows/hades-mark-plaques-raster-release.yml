name: HADES mark plaques raster review release and hosted proof
on:
  push:
    branches: [main]
    paths:
      - 'site/scripts/render-hades-original-mark-plaques-review.py'
      - '.github/workflows/hades-mark-plaques-raster-release.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: hades-original-mark-raster-3-ratios
  cancel-in-progress: true
jobs:
  render-publish-proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 42
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install stable renderer and image decoder
        run: python -m pip install 'cairosvg==2.8.2' 'pillow==11.3.0'
      - name: Produce native ratio binaries in both directories
        run: python site/scripts/render-hades-original-mark-plaques-review.py
      - name: Commit actual binaries, ZIP, hash manifest to GitHub
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3 4; do
            git add hades/library/backgrounds/quiet-courts/mark-plate/ratios/raster/ site/public/hades/library/backgrounds/quiet-courts/mark-plate/ratios/raster/
            if git diff --cached --quiet; then echo "PASS binaries already present"; break; fi
            git commit -m "assets(hades): publish original-mark plaque raster pack 3 ratios [REVIEW]"
            if git push origin HEAD:main; then echo "PASS actual binary commit pushed"; break; fi
            if [ "$attempt" -eq 4 ]; then exit 1; fi
            git fetch origin main
            git rebase origin/main
            sleep 4
          done
      - name: Verify real browser layout in EN FA at 320 390 430
        run: |
          python -m pip install 'playwright==1.56.0'
          python -m playwright install --with-deps chromium
          python -m http.server 8776 >/tmp/hades-mark-raster-server.log 2>&1 &
          mkdir -p /tmp/hades-mark-raster-proof
          python - <<'PY'
          import asyncio
          from playwright.async_api import async_playwright
          async def main():
            async with async_playwright() as p:
              b=await p.chromium.launch(headless=True,args=['--no-sandbox'])
              for lang in ('en','fa'):
                for width in (320,390,430):
                  page=await b.new_page(viewport={'width':width,'height':920},device_scale_factor=1)
                  route=('fa/' if lang=='fa' else '')+'library/backgrounds/quiet-courts/mark-plate/ratios/'
                  response=await page.goto('http://localhost:8776/hades/'+route,wait_until='networkidle')
                  assert response.status==200
                  assert await page.locator('html').get_attribute('lang')==lang
                  assert await page.evaluate('document.documentElement.scrollWidth<=innerWidth+1'),(lang,width,'overflow')
                  cards=page.locator('[data-mark-raster]')
                  assert await cards.count()==3,(lang,width)
                  for i in range(3):
                    img=cards.nth(i).locator('img')
                    assert await img.evaluate('(el)=>el.complete && el.naturalWidth>=1080')
                    assert await cards.nth(i).locator('a[download]').count()==3
                  assert await page.locator('a[download][href$=".zip"]').count()==1
                  await page.screenshot(path=f'/tmp/hades-mark-raster-proof/{lang}-{width}.png',full_page=True)
                  print('PASS browser',lang,width,flush=True)
                  await page.close()
              await b.close()
          asyncio.run(main())
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: HADES-original-mark-raster-3-ratios-actual-Chromium-REVIEW
          path: /tmp/hades-mark-raster-proof
          if-no-files-found: ignore
      - name: Independently fetch live Pages with HTTP 200 MIME SHA-256
        run: |
          python - <<'PY'
          import urllib.request,hashlib,time
          from pathlib import Path
          root=Path('hades/library/backgrounds/quiet-courts/mark-plate/ratios/raster')
          files=[p for p in root.iterdir() if p.is_file()]
          files+= [Path('hades/library/backgrounds/quiet-courts/mark-plate/ratios/index.html'),Path('hades/fa/library/backgrounds/quiet-courts/mark-plate/ratios/index.html')]
          assert len(files)==17,(len(files),files)
          allowed={'.png':['image/png'],'.jpg':['image/jpeg'],'.webp':['image/webp'],'.svg':['image/svg+xml'],
                   '.html':['text/html'],'.zip':['application/zip','application/octet-stream','application/x-zip-compressed'],
                   '.json':['application/json'],'.md':['text/plain','text/markdown']}
          errors=[]
          for attempt in range(20):
            errors=[]
            for path in files:
              url='https://ialirezaaa.github.io/'+path.as_posix()+'?raster-check='+str(attempt)
              try:
                req=urllib.request.Request(url,headers={'User-Agent':'HADES-Mark-Plate-Release/1.0','Cache-Control':'no-cache'})
                with urllib.request.urlopen(req,timeout=16) as r:
                  body=r.read(); mime=r.headers.get('Content-Type','').split(';')[0]
                  assert r.status==200
                assert mime in allowed[path.suffix],(path,mime)
                assert hashlib.sha256(body).digest()==hashlib.sha256(path.read_bytes()).digest(),str(path)
              except Exception as e:errors.append((path.name,str(e)[:100]))
            if not errors:
              print('PASS INDEPENDENT LIVE 17/17 HTTP 200 MIME SHA-256',flush=True)
              break
            print('OPEN retry',attempt+1,errors[:4],flush=True)
            if attempt<19:time.sleep(15)
          assert not errors,errors
          PY
