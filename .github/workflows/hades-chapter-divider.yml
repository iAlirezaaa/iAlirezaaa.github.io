name: HADES chapter divider browser and hosted proof
on:
  push:
    branches: [main]
    paths:
      - 'hades/library/backgrounds/quiet-courts/chapter-divider/**'
      - '.github/workflows/hades-chapter-divider.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: |
          python -m pip install playwright==1.56.0
          python -m playwright install --with-deps chromium
      - name: Actual SVG and Chromium proof
        run: |
          python -m http.server 8782 >/tmp/chapter-server.log 2>&1 &
          mkdir -p /tmp/chapter-proof
          python - <<'PY'
          import asyncio,base64,hashlib,xml.etree.ElementTree as ET
          from pathlib import Path
          from playwright.async_api import async_playwright
          root='library/backgrounds/quiet-courts/chapter-divider/'
          names=["HADES_Quiet_Courts_Chapter_Divider_EN_16x9_PUBLIC_REVIEW.svg","HADES_Quiet_Courts_Chapter_Divider_FA_16x9_PUBLIC_REVIEW.svg"]
          original=Path('hades/assets/IMG_7187(2).png').read_bytes()
          assert hashlib.sha256(original).hexdigest()=='79867ef2cea0777a277df45a2754ea012ff552d466963f8cb831e5940a5cafb7'
          ns={'s':'http://www.w3.org/2000/svg'}
          for n in names:
            doc=ET.parse(Path('hades')/root/n)
            assert doc.getroot().attrib['viewBox']=='0 0 1920 1080'
            imgs=doc.findall('.//s:image',ns)
            assert len(imgs)==1 and base64.b64decode(imgs[0].attrib['href'].split(',')[1])==original
            assert doc.find(".//s:g[@id='editable-chapter-copy']",ns) is not None
          async def main():
            async with async_playwright() as p:
              b=await p.chromium.launch(headless=True,args=['--no-sandbox'])
              for lang in ('en','fa'):
                for w in (320,390,430):
                  page=await b.new_page(viewport={'width':w,'height':920},accept_downloads=True)
                  await page.goto('http://localhost:8782/hades/'+('fa/' if lang=='fa' else '')+root)
                  assert await page.locator('html').get_attribute('lang')==lang
                  await page.wait_for_function("Array.from(document.images).every(i=>i.complete&&i.naturalWidth===1920)")
                  assert await page.evaluate('document.documentElement.scrollWidth<=innerWidth+1')
                  assert await page.locator('a[download]').count()==2
                  async with page.expect_download() as d:
                    await page.locator('a[download]').first.click()
                  assert (await d.value).suggested_filename in names
                  await page.screenshot(path=f'/tmp/chapter-proof/{lang}-{w}.png',full_page=True)
                  await page.close()
              for n in names:
                page=await b.new_page(viewport={'width':1920,'height':1080},device_scale_factor=1)
                await page.goto('http://localhost:8782/hades/'+root+n)
                await page.screenshot(path='/tmp/chapter-proof/'+n+'.png')
                await page.close()
              await b.close()
          asyncio.run(main())
          print('PASS original bytes and 6 Chromium sessions')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: HADES-chapter-divider-Chromium-REVIEW
          path: /tmp/chapter-proof
      - name: Independent live HTTPS exact body and mirror proof
        run: |
          python - <<'PY'
          import hashlib,urllib.request,time
          from pathlib import Path
          files=["library/backgrounds/quiet-courts/chapter-divider/HADES_Quiet_Courts_Chapter_Divider_EN_16x9_PUBLIC_REVIEW.svg","library/backgrounds/quiet-courts/chapter-divider/HADES_Quiet_Courts_Chapter_Divider_FA_16x9_PUBLIC_REVIEW.svg","library/backgrounds/quiet-courts/chapter-divider/index.html","fa/library/backgrounds/quiet-courts/chapter-divider/index.html","index.html","library/index.html","brand-kit/logo-usage/index.html","library/backgrounds/quiet-courts/index.html","fa/index.html","fa/library/index.html","fa/brand-kit/logo-usage/index.html","fa/library/backgrounds/quiet-courts/index.html","downloads/HADES_Public_Overview_EN.md","downloads/HADES_Public_Overview_FA.md"]
          for f in files:
            assert (Path('hades')/f).read_bytes()==(Path('site/public/hades')/f).read_bytes(),f
          for attempt in range(25):
            errors=[]
            for f in files:
              try:
                with urllib.request.urlopen('https://ialirezaaa.github.io/hades/'+f+'?chapter='+str(attempt),timeout=15) as res:
                  assert res.status==200
                  assert res.headers.get_content_type() in (('image/svg+xml',) if f.endswith('.svg') else ('text/plain','text/markdown') if f.endswith('.md') else ('text/html',))
                  assert hashlib.sha256(res.read()).digest()==hashlib.sha256((Path('hades')/f).read_bytes()).digest(),f
              except Exception as e:errors.append((f,str(e)))
            if not errors:break
            time.sleep(12)
          assert not errors,errors
          print('PASS independent HTTP 200 MIME SHA256',len(files))
          PY
