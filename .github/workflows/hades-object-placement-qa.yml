name: HADES object-stage placement — REVIEW source/browser/hosted QA
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/hades-object-placement-qa.yml'
      - 'hades/library/object-stages/placement/**'
      - 'hades/fa/library/object-stages/placement/**'
      - 'site/public/hades/library/object-stages/placement/**'
      - 'site/public/hades/fa/library/object-stages/placement/**'
jobs:
  qa:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install real browser
        run: |
          python -m pip install --disable-pip-version-check playwright
          python -m playwright install --with-deps chromium
      - name: Verify XML, mirrored source and 50mm physical A4 vector geometry
        run: |
          python - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          a=Path('hades/library/object-stages/placement')
          b=Path('site/public/hades/library/object-stages/placement')
          for name in ['HADES_Object_Stages_Subject_Placement_A4_REVIEW.svg','index.html']:
              assert (a/name).read_bytes()==(b/name).read_bytes(),name
          for prefix in ['hades/fa','site/public/hades/fa']:
              assert (Path(prefix)/'library/object-stages/placement/index.html').read_bytes()==(Path('hades/fa')/'library/object-stages/placement/index.html').read_bytes()
          p=a/'HADES_Object_Stages_Subject_Placement_A4_REVIEW.svg'
          s=p.read_text(encoding='utf-8')
          root=ET.fromstring(s)
          assert root.attrib['width']=='210mm' and root.attrib['height']=='297mm' and root.attrib['viewBox']=='0 0 210 297'
          assert 'M17 271 L67 271' in s, 'Missing 50mm vector line'
          assert s.count('aria-label=')>=3 and '#EF4B32' in s and 'REVIEW' in s
          assert 'IMG_7187' not in s and 'PRIVATE' not in s
          print('PASS: XML parsed, exact A4 and 50-mm path; 3 source/publish pairs matched')
          PY
      - name: Real Chromium FA/EN at 320 390 430
        run: |
          mkdir -p /tmp/hades-placement-proofs
          python -m http.server 8765 >/tmp/hades-placement-server.log 2>&1 &
          python - <<'PY'
          import asyncio
          from playwright.async_api import async_playwright
          async def main():
            async with async_playwright() as p:
              b=await p.chromium.launch(headless=True,args=['--no-sandbox'])
              for lang in ['en','fa']:
                route='library/object-stages/placement/' if lang=='en' else 'fa/library/object-stages/placement/'
                for width in [320,390,430]:
                  page=await b.new_page(viewport={'width':width,'height':850},device_scale_factor=1)
                  response=await page.goto('http://127.0.0.1:8765/hades/'+route,wait_until='networkidle')
                  assert response.status==200,(lang,width,response.status)
                  ready=await page.locator('.preview img').evaluate('(i)=>i.complete && i.naturalWidth>0')
                  overflow=await page.evaluate('document.documentElement.scrollWidth>innerWidth+1')
                  assert ready and not overflow,(lang,width,ready,overflow)
                  assert await page.locator('a[href$=".svg"]').count()>=1
                  assert await page.get_by_text('REVIEW').count()>=1
                  await page.screenshot(path=f'/tmp/hades-placement-proofs/{lang}_{width}.png',full_page=True)
                  print(f'PASS Chromium {lang} {width}px img decode, no overflow, download link')
                  await page.close()
              await b.close()
          asyncio.run(main())
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hades-placement-6-chromium-review
          path: /tmp/hades-placement-proofs/
          if-no-files-found: ignore
      - name: Independent hosted HTTPS 200 MIME and exact SHA-256 verification
        run: |
          python - <<'PY'
          import hashlib, pathlib, urllib.request, urllib.error, time
          files=[
            'library/object-stages/placement/HADES_Object_Stages_Subject_Placement_A4_REVIEW.svg',
            'library/object-stages/placement/index.html',
            'fa/library/object-stages/placement/index.html',
            'index.html','fa/index.html',
            'library/index.html','fa/library/index.html',
            'brand-kit/logo-usage/index.html','fa/brand-kit/logo-usage/index.html',
            'library/object-stages/index.html','fa/library/object-stages/index.html'
          ]
          errors=[]
          for attempt in range(10):
            errors=[]
            for f in files:
              expected=pathlib.Path('hades')/f
              data=expected.read_bytes()
              url='https://ialirezaaa.github.io/hades/'+f
              try:
                req=urllib.request.Request(url,headers={'User-Agent':'HADES-SourceHash-Review-QA/1.0','Cache-Control':'no-cache'})
                with urllib.request.urlopen(req,timeout=25) as r:
                  body=r.read();typ=r.headers.get('Content-Type','')
                  assert r.status==200
                  assert ('image/svg+xml' in typ if f.endswith('.svg') else 'text/html' in typ),(f,typ)
                  assert hashlib.sha256(body).digest()==hashlib.sha256(data).digest(),f
              except Exception as exc:
                errors.append((f,str(exc)))
            if not errors:
              print(f'PASS {len(files)}/{len(files)} real hosted HTTPS 200 MIME SHA256; attempt {attempt+1}')
              break
            print(f'Attempt {attempt+1}: {len(errors)} incomplete live checks',errors[:3],flush=True)
            if attempt!=9:time.sleep(15)
          assert not errors,errors
          PY
