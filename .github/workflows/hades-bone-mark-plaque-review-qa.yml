name: HADES Quiet Courts original mark plate | real Chromium and live delivery | REVIEW
on:
  push:
    branches: [main]
    paths:
      - 'site/public/hades/library/backgrounds/quiet-courts/mark-plate/**'
      - 'site/public/hades/fa/library/backgrounds/quiet-courts/mark-plate/**'
      - '.github/workflows/hades-bone-mark-plaque-review-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 26
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate original image bytes, XML, native dimensions and all mirrors
        run: |
          python - <<'PY'
          import base64,hashlib,xml.etree.ElementTree as ET
          from pathlib import Path
          paths=[
            'library/backgrounds/quiet-courts/mark-plate/HADES_Bone_Original_White_Mark_Detached_Plaque_PUBLIC_REVIEW.svg',
            'library/backgrounds/quiet-courts/mark-plate/index.html',
            'fa/library/backgrounds/quiet-courts/mark-plate/index.html',
            'library/backgrounds/quiet-courts/mark-plate/README_REVIEW.md',
          ]
          for sub in paths:
            a=(Path('site/public/hades')/sub).read_bytes()
            b=(Path('hades')/sub).read_bytes()
            assert a==b,sub
            assert b'REVIEW' in a,sub
            print('PASS MIRROR SHA256',sub,hashlib.sha256(a).hexdigest())
          root=ET.fromstring((Path('hades')/paths[0]).read_bytes())
          assert (root.get('width'),root.get('height'),root.get('viewBox'))==('1080','1920','0 0 1080 1920')
          imgs=root.findall('.//{http://www.w3.org/2000/svg}image')
          assert len(imgs)==1
          data=imgs[0].get('href') or imgs[0].get('{http://www.w3.org/1999/xlink}href')
          assert data.startswith('data:image/png;base64,')
          exact=base64.b64decode(data.split(',',1)[1],validate=True)
          owner=Path('hades/assets/IMG_7187(2).png').read_bytes()
          expected='79867ef2cea0777a277df45a2754ea012ff552d466963f8cb831e5940a5cafb7'
          assert exact==owner and hashlib.sha256(owner).hexdigest()==expected
          # Non-destructive display window only. No raster alterations.
          assert root.find('.//{http://www.w3.org/2000/svg}clipPath') is not None
          print('PASS unchanged original bytes and detached SVG plaque')
          PY
      - name: Install actual Chromium
        run: |
          python -m pip install playwright==1.56.0
          python -m playwright install --with-deps chromium
      - name: Six real browser sizes and local visual screenshots
        run: |
          python -m http.server 8879 >/tmp/hades-bone-mark-local-http.log 2>&1 &
          mkdir -p /tmp/hades-bone-mark-proofs
          python - <<'PY'
          import asyncio
          from playwright.async_api import async_playwright
          async def main():
            async with async_playwright() as p:
              browser=await p.chromium.launch(headless=True,args=['--no-sandbox'])
              for lang in ('en','fa'):
                segment=('fa/' if lang=='fa' else '')+'library/backgrounds/quiet-courts/mark-plate/'
                for width in (320,390,430):
                  page=await browser.new_page(viewport={'width':width,'height':900},device_scale_factor=1)
                  res=await page.goto('http://127.0.0.1:8879/hades/'+segment,wait_until='networkidle')
                  assert res and res.status==200,(lang,width,res)
                  assert await page.locator('html').get_attribute('lang')==lang
                  assert not await page.evaluate('document.documentElement.scrollWidth>window.innerWidth+1'),(lang,width)
                  img=page.locator('img.artboard')
                  assert await img.evaluate('(e)=>e.complete && e.naturalWidth===1080 && e.naturalHeight===1920'),(lang,width)
                  assert await page.locator('.chip').count()==3
                  for i,size in enumerate((48,96,160)):
                    w=await page.locator('.chip').nth(i).evaluate('(e)=>Math.round(e.getBoundingClientRect().width)')
                    assert w==size,(lang,width,i,w)
                  await page.screenshot(path=f'/tmp/hades-bone-mark-proofs/{lang}-{width}.png',full_page=True)
                  await page.close()
              await browser.close()
          asyncio.run(main())
          print('PASS 6/6 genuine browser responsive and micro CSS geometry')
          PY
      - name: Independently verify deployed GitHub Pages HTTP 200, MIME and SHA256
        run: |
          python - <<'PY'
          import urllib.request,time,hashlib
          from pathlib import Path
          prefix='https://ialirezaaa.github.io/hades/'
          subs=[
            'library/backgrounds/quiet-courts/mark-plate/',
            'fa/library/backgrounds/quiet-courts/mark-plate/',
            'library/backgrounds/quiet-courts/mark-plate/HADES_Bone_Original_White_Mark_Detached_Plaque_PUBLIC_REVIEW.svg'
          ]
          def source(s):
            s=s+'index.html' if s.endswith('/') else s
            return (Path('hades')/s).read_bytes()
          for sub in subs:
            correct=source(sub); last=None
            for attempt in range(18):
              try:
                req=urllib.request.Request(prefix+sub,headers={'User-Agent':'HADES-mark-plate-public-QA/1'})
                with urllib.request.urlopen(req,timeout=25) as r:
                  status=r.status; mime=r.headers.get('Content-Type',''); body=r.read()
                assert status==200,(sub,status)
                assert ('image/svg+xml' if sub.endswith('.svg') else 'text/html') in mime,(sub,mime)
                assert hashlib.sha256(body).digest()==hashlib.sha256(correct).digest(),sub
                print('PASS LIVE HTTPS 200 MIME SHA256',sub,len(body))
                break
              except Exception as e:
                last=e
                if attempt==17: raise RuntimeError(f'OPEN deployment verification {sub}: {last}')
                time.sleep(15)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: HADES-Bone-Matrix-Actual-Chromium-REVIEW
          path: /tmp/hades-bone-mark-proofs/
          if-no-files-found: ignore
