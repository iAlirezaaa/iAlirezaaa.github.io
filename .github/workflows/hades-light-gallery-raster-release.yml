name: HADES Light Gallery / render and release actual binaries
on:
  push:
    paths:
      - ".github/scripts/hades_light_gallery_raster.py"
      - ".github/workflows/hades-light-gallery-raster-release.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build-export-publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Install Python raster renderer and real Chromium
        run: |
          python -m pip install --upgrade "playwright==1.56.0" "Pillow==12.0.0"
          python -m playwright install --with-deps chromium
      - name: Render 18 images with unchanged logo and validate native decoding
        run: |
          python .github/scripts/hades_light_gallery_raster.py
      - name: Commit both byte-identical publish mirrors and real ZIP
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add hades/library/light-gallery/raster site/public/hades/library/light-gallery/raster
          if ! git diff --cached --quiet; then
            git commit -m "assets(hades): publish 18 Chromium Light Gallery PNG JPEG WebP + public review ZIP"
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
          else
            echo "PASS no binary changes; mirrors already identical"
          fi
      - name: Independently check live Pages status, MIME and exact bytes
        run: |
          python - <<'PY'
          import hashlib,pathlib,time,urllib.request
          root=pathlib.Path('hades/library/light-gallery/raster')
          names=[
           'HADES_Light_Gallery_Contact_REVIEW.png',
           'HADES_Light_Gallery_Raster_Manifest_REVIEW.json',
           'HADES_Light_Gallery_6_Ratios_Languages_PNG_JPEG_WEBP_REVIEW.zip',
           'HADES_Light_Gallery_16x9_EN_REVIEW.webp',
           'HADES_Light_Gallery_9x16_FA_REVIEW.jpg',
           'HADES_Light_Gallery_1x1_EN_REVIEW.png',
          ]
          files=[root/name for name in names]
          expected={'.png':'image/png','.jpg':'image/jpeg','.webp':'image/webp','.zip':'application/zip','.json':'application/json'}
          allowed_zip={'application/zip','application/x-zip-compressed','application/octet-stream'}
          errors={}
          for attempt in range(18):
           errors={}
           for p in files:
            url='https://ialirezaaa.github.io/'+p.as_posix()+'?hades_verify='+str(attempt)
            try:
             req=urllib.request.Request(url,headers={'User-Agent':'HADES-original-raster-release-QA/1.0'})
             with urllib.request.urlopen(req,timeout=14) as res:
              body=res.read()
              mime=res.headers.get('Content-Type','').split(';')[0].lower()
              assert res.status==200
              assert mime in (allowed_zip if p.suffix=='.zip' else {expected[p.suffix]}),(p,mime)
              assert hashlib.sha256(body).digest()==hashlib.sha256(p.read_bytes()).digest(),(p,'SHA mismatch')
            except Exception as e:errors[str(p)]=str(e)
           if not errors:
            print('PASS real hosted HTTP200 MIME SHA',len(files),flush=True)
            break
           print('OPEN hosted attempt',attempt+1,errors,flush=True)
           if attempt<17:time.sleep(15)
          assert not errors,errors
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: HADES-Light-Gallery-PUBLIC-REVIEW-Release-proof
          path: |
            hades/library/light-gallery/raster/HADES_Light_Gallery_Contact_REVIEW.png
            hades/library/light-gallery/raster/HADES_Light_Gallery_Raster_Manifest_REVIEW.json
          if-no-files-found: ignore
