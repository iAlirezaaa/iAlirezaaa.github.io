name: HADES composite desk independent HTTP QA
on:
  workflow_dispatch:
  push:
    paths:
      - 'hades/**/composite-desk/index.html'
      - '.github/workflows/hades-composite-desk-qa.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Check actual hosted bytes and backlinks
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib, time, urllib.request
          root='https://ialirezaaa.github.io/'
          base='library/backgrounds/quiet-courts/transitions/'
          paths=[]
          for loc in ('','fa/'):
              pre='hades/'+loc
              dest=pre+base+'composite-desk/'
              for suffix in (base+'composite-desk/index.html',base+'social-ratios/index.html',base+'editing-guide/index.html','index.html','library/index.html','brand-kit/logo-usage/index.html'):
                  p=Path(pre+suffix)
                  assert p.read_bytes()==(Path('site/public')/p).read_bytes(),p
                  if suffix!=base+'composite-desk/index.html':
                      assert ('href="/'+dest+'"').encode() in p.read_bytes(),p
                  paths.append(p)
          for attempt in range(30):
              errors=[]
              for p in paths:
                  url=root+str(p).removesuffix('index.html')
                  try:
                      req=urllib.request.Request(url,headers={'Cache-Control':'no-cache','User-Agent':'HADES-hosted-QA'})
                      with urllib.request.urlopen(req,timeout=15) as res:
                          data=res.read()
                          assert res.status==200 and res.headers.get_content_type()=='text/html'
                      assert hashlib.sha256(data).digest()==hashlib.sha256(p.read_bytes()).digest()
                  except Exception as e:
                      errors.append((url,str(e)))
              if not errors:
                  for p in paths: print('HTTP 200 MIME SHA256 PASS',root+str(p).removesuffix('index.html'))
                  break
              print('Waiting for exact deployed bytes:',errors,flush=True)
              time.sleep(10)
          else: raise SystemExit('Hosted proof OPEN: mismatch or inaccessible')
          PY
