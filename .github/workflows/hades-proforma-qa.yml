name: HADES A4 pro forma browser QA (REVIEW)
on:
  push:
    branches: [main]
    paths:
      - "hades/library/tools/a4-proforma-invoice/**"
      - "site/public/hades/library/tools/a4-proforma-invoice/**"
      - "site/scripts/qa-hades-proforma.mjs"
      - ".github/workflows/hades-proforma-qa.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  mobile-browser:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install isolated browser test dependency
        working-directory: site
        run: npm install --no-save --no-audit --no-fund playwright@1.56.1
      - name: Install browser
        working-directory: site
        run: npx playwright install --with-deps chromium
      - name: Actual Chromium QA — both source routes, original SHA, JSON and A4 PDF
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/hades-http.log 2>&1 &
          sleep 2
          node site/scripts/qa-hades-proforma.mjs
      - name: Publish verified sample PDF and mobile preview to both site paths
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          STEM="library/tools/a4-proforma-invoice"
          mkdir -p "hades/$STEM" "site/public/hades/$STEM"
          for ROOT in hades site/public/hades; do
            cp artifacts/hades-proforma/A4_Proforma_Chromium_REVIEW.pdf "$ROOT/$STEM/HADES_A4_Proforma_Sample_PUBLIC_REVIEW.pdf"
            cp artifacts/hades-proforma/mobile-390-pages.png "$ROOT/$STEM/HADES_A4_Proforma_390px_Actual_Chromium_PUBLIC_REVIEW.png"
          done
          cmp "hades/$STEM/HADES_A4_Proforma_Sample_PUBLIC_REVIEW.pdf" "site/public/hades/$STEM/HADES_A4_Proforma_Sample_PUBLIC_REVIEW.pdf"
          cmp "hades/$STEM/HADES_A4_Proforma_390px_Actual_Chromium_PUBLIC_REVIEW.png" "site/public/hades/$STEM/HADES_A4_Proforma_390px_Actual_Chromium_PUBLIC_REVIEW.png"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- "hades/$STEM" "site/public/hades/$STEM"
          if git diff --cached --quiet; then echo "Sample already synced"; exit 0; fi
          git commit -m "Publish source-tested HADES A4 pro forma PDF and Chromium PNG REVIEW"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
      - name: Retain actual screenshots and PDF
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hades-a4-proforma-chromium-REVIEW
          path: artifacts/hades-proforma/
          if-no-files-found: warn
