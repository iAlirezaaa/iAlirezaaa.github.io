name: Prepare original logo alpha review
on:
  push:
    branches: [review/blog-original-logo-transparent-20261126]
    paths: ['.github/workflows/logo-alpha-review.yml']
permissions:
  contents: read
jobs:
  matte:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: python -m pip install pillow numpy scipy
      - name: Preserve original color, derive only alpha at native resolution
        run: |
          python - <<'PY'
          import os, hashlib, base64
          import numpy as np
          from scipy.ndimage import gaussian_filter
          from PIL import Image, ImageDraw
          source='site/public/hades/assets/B3424A5B-3375-4244-806C-EF9EAA60BDD1.jpeg'
          assert hashlib.sha256(open(source,'rb').read()).hexdigest()=='c2189cba968543ed9e86389660d79cd1f031ad87be00eaa65d3b57f8ac0b6d2d'
          img=Image.open(source).convert('RGB')
          arr=np.asarray(img).astype(np.float32)
          lum=arr[:,:,0]*.2126+arr[:,:,1]*.7152+arr[:,:,2]*.0722
          # Native-pixel analysis prevents downscaled SVG filters from erasing
          # the fine, near-black embossed laurel and ring. No RGB processing.
          clean=gaussian_filter(lum,.75)
          d1=np.abs(clean-gaussian_filter(lum,8))
          d2=np.abs(clean-gaussian_filter(lum,26))
          diff=np.maximum(d1,d2*.75)
          bright=np.clip((lum-30)/24,0,1)
          chroma=arr.max(axis=2)-arr.min(axis=2)
          gold=np.clip((chroma-6)/13,0,1)*np.clip((lum-18)/24,0,1)
          os.makedirs('logo-evidence',exist_ok=True)
          proof=Image.new('RGB',(1200,780),'#f4f0e8')
          draw=ImageDraw.Draw(proof)
          for k,(label,cutoff,span) in enumerate([('balanced',2.8,7.0),('detail',1.8,5.5)]):
              detail=np.clip((diff-cutoff)/span,0,1)
              # The outside border is known blank source margin. Fade only
              # outside that margin so a full-size rectangular tile cannot appear.
              yy,xx=np.indices(lum.shape)
              edge=np.minimum.reduce([xx,yy,1253-xx,1253-yy])
              border=np.clip((edge-10)/40,0,1)
              alpha=np.maximum.reduce([bright,gold,detail])*border
              rgba=np.dstack([arr.astype(np.uint8),np.rint(alpha*255).astype(np.uint8)])
              native=Image.fromarray(rgba,'RGBA')
              assert np.array_equal(np.asarray(native)[:,:,:3],np.asarray(img))
              # Separate derived web asset; original image remains immutable.
              web=native.resize((628,628),Image.Resampling.LANCZOS)
              out='logo-evidence/'+label+'.png'
              web.save(out,optimize=True)
              sample=web.resize((340,340),Image.Resampling.LANCZOS)
              x=40+600*k
              proof.paste(sample,(x+80,65),sample)
              draw.text((x+90,40),label,fill='black')
              panel=Image.new('RGB',(530,160),'#1b1d1c')
              for index,size in enumerate([76,104,140]):
                  m=web.resize((size,size),Image.Resampling.LANCZOS)
                  panel.paste(m,(25+index*170,12),m)
                  proof.paste(m,(x+25+index*170,440),m)
              proof.paste(panel,(x,600))
              print('ALPHA_RESULT',label, 'corner-alpha', [int(rgba[y,x,3]) for x,y in [(50,50),(1200,50),(50,1200),(1200,1200),(100,600),(1150,600)]], 'bytes',os.path.getsize(out))
              # Transfer bytes through the connector-readable workflow log.
              # Split lines and reconstruct only after visual review.
              encoded=base64.b64encode(open(out,'rb').read()).decode('ascii')
              for i in range(0,len(encoded),12000):
                  print('LOGO_B64_'+label+' '+str(i//12000)+' '+encoded[i:i+12000])
          proof.save('logo-evidence/visual-review.png')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: original-logo-alpha-review
          path: logo-evidence/
