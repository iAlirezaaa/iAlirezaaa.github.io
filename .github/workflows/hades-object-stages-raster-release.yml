name: HADES Object Stages / nine real rasters and hosted SHA REVIEW
on:
  push:
    branches: [main]
    paths:
      - "site/scripts/render-hades-object-stages-raster-review.py"
      - ".github/workflows/hades-object-stages-raster-release.yml"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: hades-object-stages-raster-release
  cancel-in-progress: false
jobs:
  rasterize-and-verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 32
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install vector and raster encoders
        run: python -m pip install "cairosvg==2.8.2" "pillow==11.3.0"
      - name: Generate and decode 9 native-size JPEG PNG WebP rasters and verify ZIP/mirror
        run: python site/scripts/render-hades-object-stages-raster-review.py
      - name: Upload actual source-locked raster files for inspection
        uses: actions/upload-artifact@v4
        with:
          name: HADES-Object-Stages-9-Rasters-3-Formats-REVIEW
          path: site/public/hades/library/object-stages/raster/
          if-no-files-found: error
          retention-days: 21
      - name: Commit physical binary bytes to both public repository trees
        id: publish
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/public/hades/library/object-stages/raster/ hades/library/object-stages/raster/
          if git diff --cached --quiet; then
            echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "Publish 9 source-faithful HADES Object Stage rasters and SHA ZIP (REVIEW)"
          for attempt in 1 2 3 4 5; do
            if git push origin HEAD:main; then
              echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            git fetch origin main
            git rebase origin/main || { git rebase --abort || :; exit 1; }
            sleep 5
          done
          exit 1
      - name: Independently fetch each hosted asset and compare HTTP 200 MIME SHA-256
        env:
          RELEASE_SHA: ${{ steps.publish.outputs.sha }}
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          from urllib.request import Request, urlopen
          import datetime, hashlib, json, os, time
          folder=Path("hades/library/object-stages/raster")
          assets=sorted(p for p in folder.iterdir() if p.is_file() and p.name!="HADES_Object_Stages_Hosted_HTTP_QA_REVIEW.json")
          assert len(assets)==13, [p.name for p in assets]
          mime={".png":{"image/png"},".jpg":{"image/jpeg"},".webp":{"image/webp"},
            ".json":{"application/json","text/plain"},
            ".zip":{"application/zip","application/x-zip-compressed","application/octet-stream"},
            ".txt":{"text/plain","application/octet-stream"}}
          checks=[]
          for p in assets:
              expected=hashlib.sha256(p.read_bytes()).hexdigest()
              url="https://ialirezaaa.github.io/hades/library/object-stages/raster/"+p.name+"?release="+os.environ["RELEASE_SHA"][:12]
              for attempt in range(20):
                  try:
                      with urlopen(Request(url,headers={"Cache-Control":"no-cache","User-Agent":"Hades-Object-Stages-Public-Proof"}),timeout=25) as response:
                          data=response.read()
                          status=response.status
                          content_type=response.headers.get("Content-Type","").split(";")[0].lower()
                      assert status==200, (p.name,status)
                      assert content_type in mime[p.suffix], (p.name,content_type)
                      assert hashlib.sha256(data).hexdigest()==expected,(p.name,"SHA mismatch")
                      checks.append({"file":p.name,"http":status,"mime":content_type,"bytes":len(data),"sha256":expected})
                      print("PASS live HTTP MIME SHA",p.name,flush=True)
                      break
                  except Exception as error:
                      if attempt==19: raise RuntimeError(f"OPEN: {p.name}, {error}")
                      time.sleep(12)
          report={"status":"PUBLIC REVIEW — NOT FINAL","result":"PASS","verified_at_utc":datetime.datetime.now(datetime.timezone.utc).isoformat(),
            "release_commit":os.environ["RELEASE_SHA"],"checks_count":len(checks),"checks":checks,
            "physical_phone":"OPEN","physical_print":"OPEN","authentic_Mikhak":"OPEN","owner_FINAL":"OPEN"}
          name="HADES_Object_Stages_Hosted_HTTP_QA_REVIEW.json"
          for base in (Path("site/public/hades/library/object-stages/raster"),folder):
              (base/name).write_text(json.dumps(report,indent=2,ensure_ascii=False)+"\n",encoding="utf8")
          print("PASS 13/13 real hosted HTTP 200 MIME SHA-256")
          PY
      - name: Commit evidence only after all 13 live hosted responses pass
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/public/hades/library/object-stages/raster/HADES_Object_Stages_Hosted_HTTP_QA_REVIEW.json hades/library/object-stages/raster/HADES_Object_Stages_Hosted_HTTP_QA_REVIEW.json
          git commit -m "Record independently verified HADES Object Stage 13 live HTTP SHA passes"
          for attempt in 1 2 3 4 5; do
            if git push origin HEAD:main; then exit 0; fi
            git fetch origin main
            git rebase origin/main || { git rebase --abort || :; exit 1; }
            sleep 5
          done
          exit 1
