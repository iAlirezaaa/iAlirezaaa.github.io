name: Blog Garden live verification
on:
  workflow_run:
    workflows: ["Build and deploy original Hades III portfolio"]
    types: [completed]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Independent live HTTP 200, MIME, SHA and article link checks
        run: node site/scripts/verify-garden-live.mjs
