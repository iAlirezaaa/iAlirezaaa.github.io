name: Build original portfolio into branch Pages root

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "garden/**"
      - ".github/workflows/static-publish.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: static-portfolio-root
  cancel-in-progress: true

jobs:
  build-and-sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout public site
        uses: actions/checkout@v4
      - name: Configure Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            site/package-lock.json
            garden/package-lock.json
      - name: Install dependencies
        working-directory: site
        run: npm ci
      - name: Install original Digital Garden template dependencies
        working-directory: garden
        run: npm ci
      - name: Build original React/Vite design
        working-directory: site
        run: npm run build
      - name: Check original application
        working-directory: site
        run: npm run lint
      - name: Create route entry points
        working-directory: site
        run: node scripts/postbuild.mjs
      - name: Verify Persian Digital Garden and article integration
        working-directory: site
        run: |
          node scripts/verify-blog-garden.mjs
          node scripts/verify-blog-discovery.mjs
          node --test scripts/blog-explorer.test.mjs ../garden/scripts/publishing.test.mjs
      - name: Verify bilingual pages and profile metadata
        working-directory: site
        run: node scripts/validate-site.mjs
      - name: Validate HADES public download links and original asset hashes
        working-directory: site
        run: node scripts/validate-hades.mjs
      - name: Install HADES pattern renderer
        run: |
          python3 -m pip install --user pillow cairosvg
          if ! command -v magick >/dev/null && ! command -v convert >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y imagemagick
          fi
      - name: Render pinned HADES pattern source into PNG / PSD / ZIP
        run: python3 site/scripts/render-hades-pattern-review.py
      - name: Render HADES editable business card PNG PSD ZIP from original source
        run: python3 site/scripts/render-hades-business-card.py
      - name: Generate HADES A4 letterhead SVG PNG layered PSD ZIP from approved original source
        run: python3 site/scripts/render-hades-letterhead.py
      - name: Render categorized HADES working library PNG PSD and ZIP from SVG source
        run: python3 site/scripts/render-hades-library.py
      - name: QA HADES categorized gallery and generated PNG PSD ZIP files
        run: node site/scripts/validate-hades-library.mjs
      - name: Copy built app into existing Pages branch root
        shell: bash
        run: |
          set -euo pipefail
          built_source_ref="$(git rev-parse HEAD)"
          rm -rf index.html 404.html assets about work systems contact fa sitemap.xml robots.txt
          cp -a site/dist/. .
          touch .nojekyll
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- index.html 404.html assets about work systems contact fa hades site/public/hades/library/backgrounds sitemap.xml robots.txt .nojekyll googleb94d773f21def0ef.html
          if git diff --cached --quiet; then
            echo "Generated output already matches the repository."
            exit 0
          fi
          git commit -m "Publish compiled original Hades III portfolio"
          for attempt in 1 2 3 4 5; do
            if git push origin HEAD:main; then
              echo "Published generated Pages root without force."
              exit 0
            fi
            echo "Concurrent branch update detected; checking the source used for this build."
            git fetch origin main
            if ! git diff --quiet "$built_source_ref" origin/main -- site/ garden/ .github/workflows/static-publish.yml; then
              echo "::notice::Skipping stale generated output: build sources changed on main. The newer source-triggered workflow owns publication."
              exit 0
            fi
            echo "Build sources are unchanged; safely rebasing the generated commit."
            if ! git rebase origin/main; then
              git rebase --abort || true
              echo "::warning::Rebase conflict: source may have changed; preserving remote rather than overwriting."
              exit 1
            fi
            sleep 4
          done
          echo "::warning::Generated Pages root not pushed after 5 safe retries."
          exit 1
