name: HADES Threshold backgrounds REVIEW mobile Chromium QA
on:
  push:
    branches: [main]
    paths:
      - 'hades/library/backgrounds/**'
      - 'site/public/hades/library/backgrounds/**'
      - 'tests/hades-threshold-backgrounds.cjs'
      - '.github/workflows/hades-threshold-backgrounds-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - id: chrome
        uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: stable
      - run: npm install --prefix /tmp/hades-threshold-test --no-save --no-package-lock playwright-core
      - name: Real Chromium at 320 390 430 FA and EN with source SVG and logo plate
        env:
          NODE_PATH: /tmp/hades-threshold-test/node_modules
          CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}
        run: node tests/hades-threshold-backgrounds.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: HADES-Threshold-6-mobile-screenshots-REVIEW
          path: hades-backgrounds-proof/
          if-no-files-found: warn
