name: HADES bookmarks / publish real A4 PDF and PNG WebP REVIEW
on:
  push:
    branches: [main]
    paths:
      - "site/scripts/render-hades-bookmarks-review.py"
      - ".github/workflows/hades-bookmark-release.yml"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: hades-bookmark-release
  cancel-in-progress: false
jobs:
  render-commit-and-verify-host:
    runs-on: ubuntu-latest
    timeout-minutes: 24
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install real raster/PDF renderers
        run: |
          python -m pip install pillow PyMuPDF playwright
          python -m playwright install --with-deps chromium
      - name: Generate and validate source-locked PDFs, PNG, WebP, ZIP
        run: python site/scripts/render-hades-bookmarks-review.py
      - name: Save actual rendered proofs
        uses: actions/upload-artifact@v4
        with:
          name: HADES-Bookmarks-PDF-PNG-WEBP-PUBLIC-REVIEW
          path: site/public/hades/library/bookmarks/raster/
          if-no-files-found: error
          retention-days: 21
      - name: Commit actual binary files into both Pages trees
        id: publish
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/public/hades/library/bookmarks/raster/ hades/library/bookmarks/raster/
          if git diff --cached --quiet; then
            echo "Already identical, no new commit needed."
            echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "Publish HADES bookmark A4 PDF PNG WebP and SHA ZIP (REVIEW)"
          for attempt in 1 2 3 4 5; do
            if git push origin HEAD:main; then
              echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            git fetch origin main
            git rebase origin/main || { git rebase --abort || :; exit 1; }
            sleep 4
          done
          exit 1
      - name: Independently verify every published download over GitHub Pages HTTP
        env:
          RELEASE_SHA: ${{ steps.publish.outputs.sha }}
        run: |
          python - <<'PY'
          import hashlib, os, time, urllib.request
          from pathlib import Path
          local = Path('hades/library/bookmarks/raster')
          files = sorted(p for p in local.iterdir() if p.is_file())
          assert len(files) >= 14, len(files)
          root='https://ialirezaaa.github.io/hades/library/bookmarks/raster/'
          for p in files:
              expect=hashlib.sha256(p.read_bytes()).hexdigest()
              url=root+p.name+'?release='+os.environ['RELEASE_SHA'][:12]
              errors=[]
              for attempt in range(18):
                  try:
                      req=urllib.request.Request(url,headers={'Cache-Control':'no-cache','User-Agent':'Hades-Public-Release-QA'})
                      with urllib.request.urlopen(req,timeout=20) as response:
                          data=response.read()
                          code=response.status
                          mime=response.headers.get('Content-Type','').split(';')[0].lower()
                      if code != 200 or hashlib.sha256(data).hexdigest()!=expect:
                          raise ValueError(f'HTTP {code} or SHA mismatch')
                      allowed={'.png':['image/png'],'.webp':['image/webp'],'.pdf':['application/pdf'],
                               '.json':['application/json','text/plain'],
                               '.txt':['text/plain','application/octet-stream'],
                               '.zip':['application/zip','application/x-zip-compressed','application/octet-stream']}
                      if mime not in allowed.get(p.suffix,[]):
                          raise ValueError(f'Unexpected MIME {mime}')
                      print('PASS',p.name,'HTTP',code,'MIME',mime,'bytes',len(data),'SHA',expect[:12],flush=True)
                      break
                  except Exception as e:
                      errors.append(str(e))
                      if attempt==17: raise RuntimeError(f'PUBLIC OPEN: {p.name}: {errors[-1]}')
                      time.sleep(12)
          print('PASS',len(files),'independent live GitHub Pages HTTP/MIME/SHA checks')
          PY
