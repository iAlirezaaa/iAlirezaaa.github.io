name: HADES 16x9 Case Study Editor REVIEW Chromium QA
on:
  push:
    paths:
      - 'hades/library/tools/case-study-slide/editor/index.html'
      - 'site/public/hades/library/tools/case-study-slide/editor/index.html'
      - 'tests/hades-case-study-editor.cjs'
      - '.github/workflows/hades-case-study-editor-qa.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  chromium:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - id: chrome
        uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: stable
      - name: Install Playwright browser driver
        run: npm install --prefix /tmp/hades-slide-qa --no-save --no-package-lock playwright-core
      - name: Test both mirrored HTML files at 320 / 390 / 430
        env:
          NODE_PATH: /tmp/hades-slide-qa/node_modules
          CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}
        run: node tests/hades-case-study-editor.cjs
      - name: Archive actual browser captures and SVG/JSON export tests
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hades-case-study-editor-review-chromium
          path: hades-case-study-editor-qa-proof/
          if-no-files-found: ignore
      - name: Save exact-source Chromium REVIEW visual and QA receipt to public mirrors
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          BASE=hades/library/tools/case-study-slide/editor
          SOURCE=site/public/hades/library/tools/case-study-slide/editor
          cmp "$BASE/index.html" "$SOURCE/index.html"
          PNG=HADES_CaseStudy_Editor_390px_Chromium_PUBLIC_REVIEW.png
          cp hades-case-study-editor-qa-proof/source-390-REVIEW.png "$BASE/$PNG"
          cp "$BASE/$PNG" "$SOURCE/$PNG"
          SHA="$(sha256sum "$BASE/index.html" | cut -d' ' -f1)"
          cat > "$BASE/QA_Chromium_PUBLIC_REVIEW.md" <<EOF
          # HADES — online case-study editor · real Chromium REVIEW receipt

          - Status: **REVIEW**, not FINAL.
          - Exact source HTML SHA-256: \`$SHA\`
          - 6/6 real Chromium checks: two site file paths × 320 / 390 / 430 CSS px, EN / FA editing and actual SVG/JSON exports.
          - Fake FINAL JSON rejected, valid REVIEW JSON restored, overflow blocks export, no horizontal overflow.
          - Run evidence: https://github.com/iAlirezaaa/iAlirezaaa.github.io/actions/runs/$GITHUB_RUN_ID
          - Chromium screenshot: $PNG (390px, FA modern, source mirror), not a physical-device photograph.
          - OPEN: independent live github.io HTTP/byte-parity check, actual device touch and small-text legibility, licensed Mikhak, owner approval, rights and physical printing.
          - Independent product identity stays primary. Author credit is disabled. No original HADES logo modified.
          EOF
          cp "$BASE/QA_Chromium_PUBLIC_REVIEW.md" "$SOURCE/QA_Chromium_PUBLIC_REVIEW.md"
          cmp "$BASE/$PNG" "$SOURCE/$PNG"
          cmp "$BASE/QA_Chromium_PUBLIC_REVIEW.md" "$SOURCE/QA_Chromium_PUBLIC_REVIEW.md"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$BASE/$PNG" "$SOURCE/$PNG" "$BASE/QA_Chromium_PUBLIC_REVIEW.md" "$SOURCE/QA_Chromium_PUBLIC_REVIEW.md"
          git commit -m "Publish real case-study editor Chromium REVIEW proof"
          for retry in 1 2 3 4; do
            if git push origin HEAD:main; then exit 0; fi
            sleep 6
            git fetch origin main
            git rebase origin/main
          done
          echo "::error::Unable to push QA proof after retries"; exit 1
