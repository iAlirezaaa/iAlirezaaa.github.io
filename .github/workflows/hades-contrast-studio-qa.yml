name: HADES Contrast Studio REVIEW export and mobile Chromium QA
on:
  push:
    branches: [main]
    paths:
      - 'hades/library/tools/contrast-studio/**'
      - 'site/public/hades/library/tools/contrast-studio/**'
      - 'tests/hades-contrast-studio.cjs'
      - '.github/workflows/hades-contrast-studio-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - id: chrome
        uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: stable
      - run: npm install --prefix /tmp/hades-contrast-test --no-save --no-package-lock playwright-core
      - name: Chromium FA EN six viewports and native PNG WebP downloaded outputs
        env:
          NODE_PATH: /tmp/hades-contrast-test/node_modules
          CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}
        run: node tests/hades-contrast-studio.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: HADES-Contrast-Studio-6-views-REVIEW
          path: hades-contrast-studio-proof/
          if-no-files-found: warn
