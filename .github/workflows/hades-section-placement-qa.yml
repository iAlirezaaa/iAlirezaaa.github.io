name: HADES Section Cuts placement — real browser and hosted QA REVIEW
on:
  push:
    branches: [main]
    paths:
      - 'hades/library/backgrounds/section-cuts/placement/**'
      - 'site/public/hades/library/backgrounds/section-cuts/placement/**'
      - 'hades/fa/library/backgrounds/section-cuts/placement/**'
      - 'site/public/hades/fa/library/backgrounds/section-cuts/placement/**'
      - 'tests/hades-section-placement*.py'
      - '.github/workflows/hades-section-placement-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-and-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 17
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install playwright
      - run: python -m playwright install --with-deps chromium
      - name: Parse editable SVG, preserve architecture and run FA/EN x 320/390/430 Chromium
        run: python tests/hades-section-placement-qa.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: HADES-Section-Placement-Chromium-REVIEW
          path: hades-placement-qa/
          if-no-files-found: ignore
  independent-live:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Independent HTTPS GET, status, MIME and source/deployed hash
        run: python tests/hades-section-placement-hosted.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: HADES-Section-Placement-Hosted-REVIEW
          path: hades-placement-hosted/
          if-no-files-found: ignore
