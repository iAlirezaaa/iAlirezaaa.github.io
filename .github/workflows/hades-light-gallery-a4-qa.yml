name: HADES Light Gallery A4 / browser, originals, public Pages
on:
  push:
    paths:
      - 'hades/library/light-gallery/print-guide/**'
      - 'hades/fa/library/light-gallery/print-guide/**'
      - '.github/workflows/hades-light-gallery-a4-qa.yml'
  workflow_dispatch:
jobs:
  qa:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Verify actual A4 XML, original bytes, mirrors and bilingual navigation
        run: |
          python - <<'PY'
          import xml.etree.ElementTree as ET, pathlib, base64, hashlib
          H=pathlib.Path('hades')
          files=[H/'library/light-gallery/print-guide'/f'HADES_Light_Gallery_A4_{lang}_REVIEW.svg' for lang in ('EN','FA')]
          pages=[H/'library/light-gallery/print-guide/index.html',H/'fa/library/light-gallery/print-guide/index.html']
          nav=[H/part/'index.html' for part in ['','fa/','library/','fa/library/','brand-kit/logo-usage/','fa/brand-kit/logo-usage/','library/light-gallery/','fa/library/light-gallery/']]
          for f in files+pages+nav+[H/'library/light-gallery/print-guide/README.md']:
              assert f.is_file(), f
              assert f.read_bytes()==(pathlib.Path('site/public')/f).read_bytes(),f
          for f in files:
              root=ET.parse(f).getroot()
              assert root.attrib['width']=='210mm' and root.attrib['height']=='297mm'
              imgs=[e for e in root.iter() if e.tag.endswith('image')]
              assert len(imgs)==1
              png=base64.b64decode(imgs[0].attrib['href'].split(',',1)[1],validate=True)
              assert hashlib.sha256(png).hexdigest()=='79867ef2cea0777a277df45a2754ea012ff552d466963f8cb831e5940a5cafb7'
              assert len([e for e in root.iter() if e.tag.endswith('use')])==3
              assert b'50 mm / PRINT 100%' in f.read_bytes()
          for f in nav: assert b'/hades/library/light-gallery/print-guide/' in f.read_bytes(),f
          print('PASS: 13 source and deployed mirrors; valid A4 XML; unchanged owner original; 8 bilingual nav paths')
          PY
      - name: Install Playwright and browser
        run: |
          python -m pip install playwright==1.56.0
          python -m playwright install --with-deps chromium
      - name: Real Chromium EN/FA 320,390,430 screenshot, editable controls and local JSON
        run: |
          python -m http.server 8765 >/tmp/hades-light-a4-http.log 2>&1 &
          python - <<'PY'
          from playwright.sync_api import sync_playwright
          from pathlib import Path
          import json
          d=Path('light-a4-proof');d.mkdir(exist_ok=True)
          with sync_playwright() as p:
              b=p.chromium.launch(headless=True)
              for lang in ('EN','FA'):
                  for width in (320,390,430):
                      page=b.new_page(viewport={'width':width,'height':900},accept_downloads=True)
                      u='http://127.0.0.1:8765/hades/'+('fa/' if lang=='FA' else '')+'library/light-gallery/print-guide/'
                      res=page.goto(u,wait_until='networkidle')
                      assert res and res.status==200
                      page.wait_for_function("document.querySelector('img.preview').complete && document.querySelector('img.preview').naturalWidth>0")
                      assert page.locator('html').get_attribute('dir')==('rtl' if lang=='FA' else 'ltr')
                      assert page.evaluate('document.documentElement.scrollWidth')<=width+1,(lang,width,'overflow')
                      assert page.locator('a[download]').count()==1
                      svg_link=page.locator('a[download]').get_attribute('href')
                      svg=page.request.get('http://127.0.0.1:8765'+svg_link)
                      assert svg.status==200 and b'width="210mm"' in svg.body()
                      page.locator('#o0').fill('QA specimen - no physical device')
                      with page.expect_download() as dl:
                          page.locator('form#obs button[type=submit]').click()
                      item=dl.value
                      item.save_as(d/f'{lang}_{width}_record.json')
                      report=json.loads((d/f'{lang}_{width}_record.json').read_text())
                      assert report['status']=='HUMAN OBSERVATION / NOT VERIFIED'
                      page.screenshot(path=str(d/f'HADES_Light_A4_{lang}_{width}_REVIEW.png'),full_page=True)
                      print('PASS real browser',lang,width,'SVG decode, local JSON, no overflow')
                      page.close()
              b.close()
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: HADES-Light-A4-Actual-Chromium-PUBLIC-REVIEW
          path: light-a4-proof/
          if-no-files-found: ignore
      - name: Independent GitHub Pages GET 200, MIME, SHA256 for 12 live URLs
        run: |
          python - <<'PY'
          import pathlib,urllib.request,hashlib,time
          H=pathlib.Path('hades')
          files=[H/'library/light-gallery/print-guide'/f'HADES_Light_Gallery_A4_{lang}_REVIEW.svg' for lang in ('EN','FA')]
          files += [H/'library/light-gallery/print-guide/index.html',H/'fa/library/light-gallery/print-guide/index.html']
          files += [H/part/'index.html' for part in ['','fa/','library/','fa/library/','brand-kit/logo-usage/','fa/brand-kit/logo-usage/','library/light-gallery/','fa/library/light-gallery/']]
          for attempt in range(20):
              pending={}
              for f in files:
                  try:
                      uri='https://ialirezaaa.github.io/'+str(f).replace('index.html','')+'?hades_a4_qa='+str(attempt)
                      with urllib.request.urlopen(urllib.request.Request(uri,headers={'User-Agent':'HADES-A4-HTTP-audit/1.0'}),timeout=22) as response:
                          data=response.read()
                          mime=response.headers.get('Content-Type','').split(';')[0].lower()
                          expected='image/svg+xml' if f.suffix=='.svg' else 'text/html'
                          assert response.status==200 and mime==expected
                          assert hashlib.sha256(data).digest()==hashlib.sha256(f.read_bytes()).digest()
                  except Exception as e: pending[str(f)]=str(e)
              if not pending:
                  print('PASS independent LIVE Pages 12/12 HTTP200 MIME exact bytes');break
              print('OPEN hosted attempt',attempt+1,'pending',len(pending))
              if attempt<19:time.sleep(12)
          assert not pending,pending
          PY
