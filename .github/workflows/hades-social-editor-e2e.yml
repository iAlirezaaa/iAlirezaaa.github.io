name: HADES social portrait browser export QA
on:
  push:
    branches: [main]
    paths:
      - "hades/library/tools/social-portrait-editor/**"
      - "site/public/hades/library/tools/social-portrait-editor/**"
      - ".github/workflows/hades-social-editor-e2e.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  chromium:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright Chromium
        working-directory: hades/library/tools/social-portrait-editor
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install chromium
      - name: Browser import-export at 320 390 430
        working-directory: hades/library/tools/social-portrait-editor
        run: node e2e.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hades-social-editor-e2e-proofs
          path: hades/library/tools/social-portrait-editor/e2e-proofs/
          if-no-files-found: ignore
  public-http:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Verify public HADES site HTTP responses and JSON byte parity
        shell: bash
        run: |
          set -euo pipefail
          url="https://ialirezaaa.github.io/hades"
          check() {
            path="$1"; expected="$2"; file="$(mktemp)"; headers="$(mktemp)"
            status="$(curl --retry 3 --retry-all-errors --retry-delay 3 --max-time 30 -LsS -D "$headers" -o "$file" -w '%{http_code}' "$url$path")"
            echo "$status $url$path"
            test "$status" = "200"
            grep -Eiq "^content-type:.*$expected" "$headers"
            test -s "$file"
          }
          check "/library/" "text/html"
          check "/fa/library/" "text/html"
          check "/brand-kit/logo-usage/" "text/html"
          check "/fa/brand-kit/logo-usage/" "text/html"
          check "/library/tools/social-portrait-editor/" "text/html"
          check "/library/tools/social-portrait-editor/project.v1.schema.json" "application/json"
          curl -fsSL "$url/library/tools/social-portrait-editor/HADES_Social_Portrait_Project_FA_REVIEW.json" -o /tmp/hades-public-project.json
          cmp /tmp/hades-public-project.json hades/library/tools/social-portrait-editor/HADES_Social_Portrait_Project_FA_REVIEW.json
          echo "PUBLIC_HTTP_AND_BYTE_PARITY_PASS"
