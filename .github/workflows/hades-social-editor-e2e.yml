name: HADES social portrait browser export QA
on:
  push:
    branches: [main]
    paths:
      - "hades/library/tools/social-portrait-editor/**"
      - "site/public/hades/library/tools/social-portrait-editor/**"
      - ".github/workflows/hades-social-editor-e2e.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  chromium:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright Chromium
        working-directory: hades/library/tools/social-portrait-editor
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install chromium
      - name: Browser import-export at 320 390 430
        working-directory: hades/library/tools/social-portrait-editor
        run: node e2e.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hades-social-editor-e2e-proofs
          path: hades/library/tools/social-portrait-editor/e2e-proofs/
          if-no-files-found: ignore
