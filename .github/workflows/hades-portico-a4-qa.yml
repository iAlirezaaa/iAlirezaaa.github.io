name: HADES Portico A4 PUBLIC REVIEW · source, browser and live site
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/hades-portico-a4-qa.yml'
      - 'site/public/hades/library/portico-studies/print-proof/**'
      - 'site/public/hades/fa/library/portico-studies/print-proof/**'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate self-contained A4 owner PNGs and mirrored source and deployed paths
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64, hashlib, xml.etree.ElementTree as ET
          root=Path('.');orig=(root/'hades/assets/IMG_7187(2).png').read_bytes()
          assert hashlib.sha256(orig).hexdigest()=='79867ef2cea0777a277df45a2754ea012ff552d466963f8cb831e5940a5cafb7'
          ns='{http://www.w3.org/2000/svg}'
          for l in ('EN','FA'):
              p=f'library/portico-studies/print-proof/HADES_Portico_A4_Compare_{l}_REVIEW.svg'
              data=(root/'hades'/p).read_bytes()
              assert data==(root/'site/public/hades'/p).read_bytes()
              x=ET.fromstring(data)
              assert x.attrib['width']=='210mm' and x.attrib['height']=='297mm'
              assert x.attrib['viewBox']=='0 0 210 297'
              ims=list(x.iter(ns+'image')); assert len(ims)==2
              for im in ims:
                  uri=im.attrib.get('href','')
                  assert uri.startswith('data:image/png;base64,')
                  assert base64.b64decode(uri.split(',',1)[1],validate=True)==orig
              assert b'M17 222 H67' in data
              print('PASS A4 SVG',l,'two original bytes',len(orig),'50 mm rule')
          for lang in ('','fa/'):
              for rel in ('library/portico-studies/print-proof/index.html','index.html','library/index.html','brand-kit/logo-usage/index.html','library/portico-studies/index.html'):
                  p=lang+rel
                  a=(root/'hades'/p).read_bytes();b=(root/'site/public/hades'/p).read_bytes()
                  assert a==b,p
                  assert b'portico' in a.lower()
          print('PASS 2 protected A4 SVG + 10 nav/editor mirror pairs')
          PY
      - name: Install actual SVG renderer and Chromium
        run: |
          python -m pip install cairosvg Pillow playwright
          python -m playwright install --with-deps chromium
      - name: Render A4 images and run 6 actual interactive browser exports
        run: |
          python - <<'PY'
          from pathlib import Path
          from http.server import ThreadingHTTPServer,SimpleHTTPRequestHandler
          from threading import Thread
          from playwright.sync_api import sync_playwright
          import cairosvg, json
          root=Path.cwd();out=root/'qa-output';out.mkdir(exist_ok=True)
          for l in ('EN','FA'):
              rel=f'hades/library/portico-studies/print-proof/HADES_Portico_A4_Compare_{l}_REVIEW.svg'
              cairosvg.svg2png(bytestring=(root/rel).read_bytes(),write_to=str(out/f'A4_Portico_{l}_REVIEW.png'),output_width=1000)
              print('PASS A4 raster',l)
          class Silent(SimpleHTTPRequestHandler):
              def log_message(self,*args):pass
          server=ThreadingHTTPServer(('127.0.0.1',8999),lambda *a,**k: Silent(*a,directory=str(root),**k))
          Thread(target=server.serve_forever,daemon=True).start()
          with sync_playwright() as p:
              browser=p.chromium.launch(headless=True)
              for l in ('EN','FA'):
                  route=('fa/' if l=='FA' else '')+'library/portico-studies/print-proof/'
                  for w in (320,390,430):
                      page=browser.new_page(viewport={'width':w,'height':800},accept_downloads=True)
                      resp=page.goto('http://127.0.0.1:8999/hades/'+route,wait_until='load')
                      assert resp.status==200
                      page.locator('#sheet').evaluate('(el)=>el.decode()')
                      assert page.locator('#sheet').evaluate('(el)=>el.naturalWidth>0')
                      assert not page.evaluate('document.documentElement.scrollWidth>innerWidth+1'),(l,w,'overflow')
                      assert int(page.locator('#mark').evaluate('(el)=>parseFloat(getComputedStyle(el).width)'))==48
                      page.select_option('#size','96')
                      assert int(page.locator('#mark').evaluate('(el)=>parseFloat(getComputedStyle(el).width)'))==96
                      with page.expect_download() as dd:page.locator('button[type=submit]').click()
                      obj=json.loads(Path(dd.value.path()).read_text())
                      assert obj['recognition']=='not-tested' and obj['mark_css_px']=='96' and 'NOT VERIFIED' in obj['status']
                      page.screenshot(path=str(out/f'Portico_A4_{l}_{w}_Chromium_REVIEW.png'),full_page=True)
                      print('PASS Chromium',l,w,'art decode, 48/96 px, JSON download, no overflow')
                      page.close()
              browser.close()
          server.shutdown()
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: HADES-Portico-A4-real-Chromium-6-and-render-2-REVIEW
          path: qa-output/*.png
          if-no-files-found: ignore
  live-independent:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: GET actual GitHub Pages 4 URLs independently, HTTP 200 MIME SHA and bytes
        run: |
          python - <<'PY'
          from pathlib import Path
          from urllib.request import Request,urlopen
          import hashlib,time
          urls=['library/portico-studies/print-proof/index.html','fa/library/portico-studies/print-proof/index.html']
          urls += [f'library/portico-studies/print-proof/HADES_Portico_A4_Compare_{l}_REVIEW.svg' for l in ('EN','FA')]
          missing=set(urls)
          for n in range(18):
              for rel in list(missing):
                  url='https://ialirezaaa.github.io/hades/'+rel+'?qa=portico-a4-20261122'
                  try:
                      with urlopen(Request(url,headers={'User-Agent':'HADES-Independent-Audit','Cache-Control':'no-cache'}),timeout=25) as r:
                          data=r.read();mime=r.headers.get('Content-Type','').lower()
                          assert r.status==200
                          assert ('svg' in mime if rel.endswith('svg') else 'html' in mime),mime
                      expected=(Path('hades')/rel).read_bytes()
                      assert data==expected, 'CDN stale or altered'
                      print('PASS independent LIVE 200/MIME/SHA',rel,hashlib.sha256(data).hexdigest())
                      missing.remove(rel)
                  except Exception as ex:print('RETRY OPEN live',rel,str(ex)[:130])
              if not missing:break
              if n<17:time.sleep(20)
          assert not missing,f'LIVE UNVERIFIED {sorted(missing)}'
          PY
