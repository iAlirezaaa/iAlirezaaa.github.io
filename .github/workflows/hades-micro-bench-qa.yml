name: HADES source-faithful micro logo six-viewport REVIEW QA
on:
  push:
    branches: [main]
    paths:
      - 'hades/brand-kit/logo-usage/micro-bench/**'
      - 'site/public/hades/brand-kit/logo-usage/micro-bench/**'
      - 'hades/fa/brand-kit/logo-usage/micro-bench/**'
      - 'site/public/hades/fa/brand-kit/logo-usage/micro-bench/**'
      - 'tests/hades-micro-bench.cjs'
      - '.github/workflows/hades-micro-bench-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - id: chrome
        uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: stable
      - run: npm install --prefix /tmp/hades-micro --no-save --no-package-lock playwright-core
      - name: 6 Chromium viewport mobile tests with original images and JSON downloads
        env:
          NODE_PATH: /tmp/hades-micro/node_modules
          CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}
        run: node tests/hades-micro-bench.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: HADES-Micro-Optical-EN-FA-6-Views-REVIEW
          path: hades-micro-bench-QA/
          if-no-files-found: warn
