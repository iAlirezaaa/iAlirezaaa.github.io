name: HADES Folded Spaces exact hosted HTTPS QA
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/hades-folded-spaces-hosted-qa.yml"
      - "hades/library/backgrounds/**"
      - "site/public/hades/library/backgrounds/**"
      - "hades/library/catalog.json"
      - "site/public/hades/library/catalog.json"
  workflow_dispatch:
concurrency:
  group: hades-folded-spaces-hosted-qa
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - name: Independent HTTPS 200 MIME and exact SHA256 for Folded PUBLIC REVIEW
        shell: bash
        run: |
          python3 - <<'PY'
          import pathlib, hashlib, urllib.request, time, json, xml.etree.ElementTree as ET
          entries=[
            "library/backgrounds/assets/HADES_Folded_Arcade_16x9_REVIEW.svg",
            "library/backgrounds/assets/HADES_Bone_Lightwell_9x16_REVIEW.svg",
            "library/backgrounds/assets/HADES_Charcoal_Alcove_1x1_REVIEW.svg",
            "library/backgrounds/Folded_Spaces_manifest_REVIEW.json",
            "library/backgrounds/index.html",
            "fa/library/backgrounds/index.html",
            "library/index.html",
            "fa/library/index.html",
            "brand-kit/logo-usage/index.html",
            "fa/brand-kit/logo-usage/index.html",
            "library/catalog.json",
          ]
          for item in entries:
            src=pathlib.Path("site/public/hades")/item
            pub=pathlib.Path("hades")/item
            assert src.is_file() and pub.is_file(),("source or deploy file missing",item)
            raw=src.read_bytes()
            assert raw==pub.read_bytes(),("GitHub mirror differs",item)
            expected=hashlib.sha256(raw).hexdigest()
            url="https://ialirezaaa.github.io/hades/"+item
            failure=None
            for attempt in range(16):
              try:
                req=urllib.request.Request(url+"?folded_sha="+expected[:12]+"&attempt="+str(attempt),
                  headers={"User-Agent":"HADES-Folded-Spaces-QA/1.0","Cache-Control":"no-cache, no-store"})
                with urllib.request.urlopen(req,timeout=14) as response:
                  status=response.status
                  mime=response.headers.get("Content-Type","")
                  data=response.read()
                assert status==200, (status,item)
                assert hashlib.sha256(data).hexdigest()==expected,("hosted bytes stale",item)
                if item.endswith(".svg"):
                  ET.fromstring(data)
                  assert "image/svg+xml" in mime,(item,mime)
                  assert b"REVIEW" in data and b"#EF4B32" in data
                elif item.endswith(".html"):
                  assert "text/html" in mime and b"REVIEW" in data,(item,mime)
                elif item.endswith(".json"):
                  assert "json" in mime and bool(json.loads(data)),(item,mime)
                print("HTTP200 MIME SHA256 PASS",item,len(data),mime,flush=True)
                failure=None
                break
              except Exception as e:
                failure=str(e)
                print("RETRY",item,attempt+1,failure[:180],flush=True)
                time.sleep(5)
            assert failure is None,("LIVE HOSTED OPEN",item,failure)
          print(f"HADES FOLDED SPACES LIVE PAGES EXACT-BYTE PASS {len(entries)}/{len(entries)}; physical device, print, Mikhak and FINAL remain OPEN")
          PY
