name: HADES raster edge lab browser and hosted proof
on:
  push:
    branches: [main]
    paths:
      - 'hades/library/backgrounds/quiet-courts/mark-plate/ratios/edge-lab/**'
      - '.github/workflows/hades-raster-edge-lab.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: |
          python -m pip install playwright==1.56.0
          python -m playwright install --with-deps chromium
      - name: Actual Chromium with published raster files
        run: |
          python -m http.server 8781 >/tmp/edge-server.log 2>&1 &
          mkdir -p /tmp/hades-edge-proof
          python - <<'PY'
          import asyncio,json
          from pathlib import Path
          from playwright.async_api import async_playwright
          base='library/backgrounds/quiet-courts/mark-plate/ratios/edge-lab/'
          async def main():
            async with async_playwright() as p:
              b=await p.chromium.launch(headless=True,args=['--no-sandbox'])
              for lang in ('en','fa'):
                for width in (320,390,430):
                  page=await b.new_page(viewport={'width':width,'height':920},accept_downloads=True)
                  route=('fa/' if lang=='fa' else '')+base
                  await page.goto('http://localhost:8781/hades/'+route)
                  for scene in ('0','1','2'):
                    for codec in ('jpg','webp'):
                      await page.select_option('#scene',scene)
                      await page.select_option('#codec',codec)
                      await page.wait_for_function("!document.querySelector('#export').disabled")
                      assert await page.evaluate('document.documentElement.scrollWidth<=innerWidth+1')
                      async with page.expect_download() as d:
                        await page.click('#export')
                      dl=await d.value
                      path=Path(f'/tmp/hades-edge-proof/{lang}-{width}-{scene}-{codec}.json')
                      await dl.save_as(path)
                      m=json.loads(path.read_text())
                      assert m['codec']==codec and m['metrics']['pixels']>100000
                      e=m['edgeFocus']; assert e['metrics']['edgePixels']>0 and e['wholePlaqueEdgeMetrics']['edgePixels']>0,e
                      assert e['nativeRect'][2:]==[64,64],e
                      assert await page.locator('#focus-coords').get_attribute('dir')=='ltr'
                      if codec=='webp': assert e['metrics']['max']==0 and e['wholePlaqueEdgeMetrics']['max']==0,e
                      if codec=='webp':assert m['metrics']['max']==0,m
                      else:assert m['metrics']['changed']>0,m
                      print(lang,width,scene,codec,m['metrics'],flush=True)
                  await page.select_option('#focus-size','32')
                  await page.locator('#focus-x').fill('0')
                  await page.locator('#focus-x').dispatch_event('change')
                  await page.locator('#focus-y').fill('0')
                  await page.locator('#focus-y').dispatch_event('change')
                  assert await page.locator('#focus-reference').evaluate('(c)=>c.width')==32
                  assert await page.evaluate('document.documentElement.scrollWidth<=innerWidth+1')
                  await page.screenshot(path=f'/tmp/hades-edge-proof/{lang}-{width}.png',full_page=True)
                  await page.close()
              await b.close()
          asyncio.run(main())
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: HADES-raster-edge-lab-actual-Chromium-REVIEW
          path: /tmp/hades-edge-proof
      - name: Independent public HTTP and mirror parity
        run: |
          python - <<'PY'
          import hashlib,urllib.request,time
          from pathlib import Path
          base='library/backgrounds/quiet-courts/mark-plate/ratios/'
          files=[base+'edge-lab/index.html','fa/'+base+'edge-lab/index.html',base+'edge-lab/edge-lab.js',base+'edge-lab/edge-focus.js',base+'index.html','fa/'+base+'index.html']
          for f in files:
            p=Path('hades')/f
            assert p.read_bytes()==(Path('site/public/hades')/f).read_bytes(),f
          for attempt in range(25):
            errors=[]
            for f in files:
              try:
                p=Path('hades')/f
                with urllib.request.urlopen('https://ialirezaaa.github.io/hades/'+f+'?edge='+str(attempt),timeout=15) as res:
                  assert res.status==200
                  mime=res.headers.get_content_type()
                  assert mime in (('text/javascript','application/javascript') if f.endswith('.js') else ('text/html',)),mime
                  assert hashlib.sha256(res.read()).digest()==hashlib.sha256(p.read_bytes()).digest(),f
              except Exception as e:errors.append((f,str(e)))
            if not errors:break
            time.sleep(12)
          assert not errors,errors
          print('PASS live independent HTTP 200 MIME SHA256 6/6')
          PY
