name: HADES Recessed Planes raster and live QA
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/hades-recessed-planes.yml'
      - 'site/scripts/render-hades-recessed-planes.py'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: |
          python -m pip install cairosvg==2.8.2 pillow==11.3.0 playwright==1.56.0
          python -m playwright install --with-deps chromium
      - name: Build and publish native raster files
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          for attempt in 1 2 3 4; do
            git fetch origin main
            git reset --hard origin/main
            python site/scripts/render-hades-recessed-planes.py
            git add 'hades/library/backgrounds/recessed-planes' 'hades/fa/library/backgrounds/recessed-planes' 'site/public/hades/library/backgrounds/recessed-planes' 'site/public/hades/fa/library/backgrounds/recessed-planes'
            if git diff --cached --quiet; then break; fi
            git commit -m 'assets(hades): publish Recessed Planes raster ZIP [PUBLIC REVIEW]'
            if git push origin HEAD:main; then break; fi
            if [ "$attempt" = 4 ]; then exit 1; fi
            sleep 3
          done
      - name: Actual browser locale responsive and print CSS QA
        run: |
          python -m http.server 8769 >/tmp/recessed-http.log 2>&1 &
          python - <<'PY'
          from playwright.sync_api import sync_playwright
          with sync_playwright() as p:
              browser=p.chromium.launch()
              for locale,path in [('en','hades/library/backgrounds/recessed-planes'),('fa','hades/fa/library/backgrounds/recessed-planes')]:
                  for w in (320,390,430):
                      page=browser.new_page(viewport={'width':w,'height':900})
                      assert page.goto('http://127.0.0.1:8769/'+path+'/').status==200
                      assert page.locator('html').get_attribute('lang')==locale
                      assert page.locator('html').get_attribute('dir')==('rtl' if locale=='fa' else 'ltr')
                      assert page.evaluate('document.documentElement.scrollWidth <= innerWidth + 1')
                      assert page.locator('figure').count()==3
                      assert page.locator('figure a[download]').count()==12
                      for i,size in enumerate([(1920,1080),(1080,1920),(1080,1080)]):
                          assert tuple(page.locator('figure img').nth(i).evaluate('e=>[e.naturalWidth,e.naturalHeight]'))==size
                      page.emulate_media(media='print')
                      assert not page.locator('nav').is_visible()
                      assert not page.locator('.links').first.is_visible()
                      print('BROWSER PRINT CSS PASS',locale,w,flush=True)
                      page.close()
              browser.close()
          PY
      - name: Independent deployed HTTP MIME and byte proof
        run: |
          python - <<'PY'
          import hashlib,time,urllib.request
          from pathlib import Path
          root=Path('hades/library/backgrounds/recessed-planes')
          paths=[root/'index.html',Path('hades/fa/library/backgrounds/recessed-planes/index.html'),root/'manifest.REVIEW.json',root/'HADES_Recessed_Planes_PUBLIC_REVIEW.zip']
          paths += [root/(n+'.'+e) for n in ('counterlight','blind-stair','offset-chamber') for e in ('svg','png','jpg','webp')]
          mime={'.html':{'text/html'},'.svg':{'image/svg+xml'},'.png':{'image/png'},'.jpg':{'image/jpeg'},'.webp':{'image/webp'},'.json':{'application/json'},'.zip':{'application/zip','application/octet-stream','application/x-zip-compressed'}}
          for i in range(24):
              errors=[]
              for path in paths:
                  try:
                      with urllib.request.urlopen('https://ialirezaaa.github.io/'+path.as_posix()+'?recessed='+str(i),timeout=15) as response:
                          data=response.read()
                          assert response.status==200 and response.headers.get_content_type() in mime[path.suffix]
                          assert hashlib.sha256(data).digest()==hashlib.sha256(path.read_bytes()).digest()
                  except Exception as exc: errors.append((str(path),str(exc)))
              if not errors:
                  for path in paths: print('HTTP 200 MIME SHA256 PASS',path,flush=True)
                  break
              print('OPEN',i,errors,flush=True)
              if i==23: raise RuntimeError('Hosted bytes not verified')
              time.sleep(12)
          PY
