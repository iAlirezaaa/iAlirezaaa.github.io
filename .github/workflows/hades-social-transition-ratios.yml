name: HADES social transition raster delivery
on:
  push:
    paths:
      - '.github/workflows/hades-social-transition-ratios.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: hades-social-transition-ratios
  cancel-in-progress: false
jobs:
  delivery:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install playwright pillow
      - run: python -m playwright install --with-deps chromium
      - run: python scripts/hades-social-transition-ratios.py
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add hades/library/backgrounds/quiet-courts/transitions/social-ratios hades/fa/library/backgrounds/quiet-courts/transitions/social-ratios site/public/hades/library/backgrounds/quiet-courts/transitions/social-ratios site/public/hades/fa/library/backgrounds/quiet-courts/transitions/social-ratios
          if ! git diff --cached --quiet; then git commit -m 'Publish six native social transition ZIPs (PUBLIC REVIEW)'; fi
          for i in 1 2 3 4 5; do git pull --rebase origin main && git push origin HEAD:main && break; test "$i" != 5 || exit 1; sleep 5; done
      - run: |
          python - <<'PY'
          from pathlib import Path
          import urllib.request, hashlib, time
          base=Path('hades/library/backgrounds/quiet-courts/transitions/social-ratios')
          files=list(base.glob('*.zip'))+[base/'index.html',Path('hades/fa/library/backgrounds/quiet-courts/transitions/social-ratios/index.html')]
          assert len(files)==8
          for attempt in range(15):
            errors=[]
            for path in files:
              try:
                assert path.read_bytes()==(Path('site/public')/path).read_bytes()
                url='https://ialirezaaa.github.io/'+str(path).removesuffix('index.html')
                req=urllib.request.Request(url,headers={'User-Agent':'HADES QA','Cache-Control':'no-cache'})
                with urllib.request.urlopen(req,timeout=30) as r:
                  mime=r.headers.get_content_type()
                  allowed=['text/html'] if path.suffix=='.html' else ['application/zip','application/x-zip-compressed','application/octet-stream']
                  assert r.status==200 and mime in allowed and hashlib.sha256(r.read()).digest()==hashlib.sha256(path.read_bytes()).digest(),(r.status,mime)
                print('HTTP 200 MIME SHA256 PASS',url)
              except Exception as e:errors.append((str(path),str(e)))
            if not errors:break
            print('OPEN',errors);time.sleep(25)
          else:raise SystemExit('Hosted verification failed')
          PY
