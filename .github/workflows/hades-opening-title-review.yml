name: HADES opening title review QA
on:
  push:
    branches: [main]
    paths:
      - 'hades/library/backgrounds/quiet-courts/opening-titles/**'
      - 'hades/fa/library/backgrounds/quiet-courts/opening-titles/**'
      - '.github/workflows/hades-opening-title-review.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium
      - run: |
          python -m http.server 8765 >/tmp/hades-http.log 2>&1 &
          python - <<'PY'
          import pathlib, hashlib, base64, re
          from playwright.sync_api import sync_playwright
          root='library/backgrounds/quiet-courts/opening-titles/'
          routes=[]
          for loc,lang in [('', 'EN'),('fa/','FA')]:
              svg=root+f'HADES_Architectural_Opening_{lang}_16x9_PUBLIC_REVIEW.svg'
              page=loc+root+'index.html'
              routes += [root+f'HADES_Architectural_Opening_{lang}_{ratio}_PUBLIC_REVIEW.svg' for ratio in ('9x16','1x1')]
              routes += [svg,page,loc+'index.html',loc+'library/index.html',loc+'brand-kit/logo-usage/index.html',f'downloads/HADES_Public_Overview_{lang}.md']
              data=pathlib.Path('hades/'+svg).read_text()
              mark=re.search(r'data:image/png;base64,([A-Za-z0-9+/=]+)',data).group(1)
              assert hashlib.sha256(base64.b64decode(mark)).hexdigest()=='79867ef2cea0777a277df45a2754ea012ff552d466963f8cb831e5940a5cafb7'
          for f in routes:
              assert pathlib.Path('hades/'+f).read_bytes()==pathlib.Path('site/public/hades/'+f).read_bytes(), f
          with sync_playwright() as pw:
              browser=pw.chromium.launch()
              for loc,lang in [('', 'EN'),('fa/','FA')]:
                  for w in [320,390,430]:
                      page=browser.new_page(viewport={'width':w,'height':900},reduced_motion='reduce')
                      page.goto('http://localhost:8765/hades/'+loc+root)
                      page.locator('#art').evaluate('(el)=>el.decode()')
                      assert page.evaluate('document.documentElement.scrollWidth<=innerWidth')
                      for t,alpha in [(0,0),(100,.5),(200,1),(850,1),(925,.5),(1000,0)]:
                          page.locator('#seek').evaluate('(el,v)=>{el.value=v;el.dispatchEvent(new Event("input"))}',t)
                          assert abs(float(page.locator('#art').evaluate('(el)=>el.style.opacity'))-alpha)<1e-6
                      page.locator('#duration').select_option('8')
                      page.locator('#play').click()
                      assert page.locator('#time').evaluate('(el)=>el.value')=='4.00 s'
                      page.locator('#stop').click()
                      for ratio in ('16x9','9x16','1x1'):
                          page.locator('#ratio').select_option(ratio)
                          page.locator('#art').evaluate('(el)=>el.decode()')
                          assert page.locator('#stage').get_attribute('data-ratio')==ratio
                          assert page.evaluate('document.documentElement.scrollWidth<=innerWidth')
                          page.locator('#zoom').click()
                          assert page.locator('#zoom').get_attribute('aria-pressed')=='true'
                          assert page.locator('#stage').evaluate('(el)=>el.scrollWidth>el.clientWidth')
                          assert page.evaluate('document.documentElement.scrollWidth<=innerWidth')
                          page.locator('#zoom').click()
                          assert page.locator('#zoom').get_attribute('aria-pressed')=='false'
                      for link in page.locator('a[download]').evaluate_all('(els)=>els.map(e=>e.getAttribute("href"))'):
                          assert page.request.get('http://localhost:8765'+link).ok
                      print('PASS browser',lang,w)
                      page.close()
              browser.close()
          print('PASS source mirror',len(routes))
          PY
  hosted:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: |
          python - <<'PY'
          import hashlib, pathlib, time, urllib.request
          root='library/backgrounds/quiet-courts/opening-titles/'
          paths=[]
          for loc,lang in [('', 'EN'),('fa/','FA')]:
              paths += [(loc+root+'index.html','text/html')]+[(root+f'HADES_Architectural_Opening_{lang}_{ratio}_PUBLIC_REVIEW.svg','image/svg+xml') for ratio in ('16x9','9x16','1x1')]
          for attempt in range(24):
              try:
                  for f,mime in paths:
                      with urllib.request.urlopen('https://ialirezaaa.github.io/hades/'+f+'?qa='+str(attempt),timeout=15) as r:
                          assert r.status==200 and r.headers.get_content_type()==mime
                          assert hashlib.sha256(r.read()).digest()==hashlib.sha256(pathlib.Path('hades/'+f).read_bytes()).digest()
                  print('PASS independent HTTP 200 MIME SHA256',len(paths))
                  break
              except Exception as e:
                  print('Await exact hosted bytes',attempt,str(e))
                  if attempt==23: raise
                  time.sleep(15)
          PY
