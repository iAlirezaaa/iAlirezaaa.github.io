<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HADES · Composite desk · REVIEW</title>
<style>*{box-sizing:border-box}body{margin:0;background:#161615;color:#e8dcc9;font:16px/1.6 system-ui,sans-serif}main{max-width:960px;margin:auto;padding:20px}h1,h2{font-weight:400;line-height:1.25}h1{font-size:26px}h2{font-size:19px}a{color:inherit}header{border-bottom:1px solid #ef4b32;padding-bottom:12px}small{font-size:13px}section{margin:20px 0}label{display:block;margin:12px 0}input,button{font:inherit;max-width:100%;min-width:0}input[type=file]{width:100%;color:inherit}input[type=range]{width:100%;accent-color:#ef4b32}button{background:#e8dcc9;color:#161615;border:0;padding:8px 14px;margin:4px 0;cursor:pointer}button:disabled{opacity:.45}canvas{display:block;max-width:100%;max-height:56vh;width:auto;height:auto;margin:auto;background:#292825}output{display:block;overflow-wrap:anywhere}fieldset{border:1px solid #746d62;min-width:0;padding:12px}button:focus-visible,a:focus-visible,input:focus-visible{outline:2px solid #ef4b32;outline-offset:3px}@media print{body{background:white;color:#161615}button,input{display:none}canvas{max-height:100mm}main{padding:0}}</style>
<main><header><small>HADES / PUBLIC REVIEW · NOT FINAL</small><h1 data-en="Composite desk" data-fa="میز کامپوزیت">Composite desk</h1><button id="lang">فارسی / EN</button> · <a id="guide" href="../social-ratios/" data-en="Download transition sequences" data-fa="دانلود توالی ترنزیشن‌ها">Download transition sequences</a></header>
<p data-en="Extract a 30-frame PNG pack, select its frames and optionally two stills. All media stays on your device. Native 24 fps; cut between frames 14 and 15. This is a still-plate compositor, not an NLE." data-fa="بستهٔ ۳۰ فریمی PNG را استخراج و فریم‌ها را انتخاب کنید. دو تصویر ثابت نیز می‌توانید وارد کنید. رسانه‌ها روی دستگاه شما می‌مانند. نرخ ۲۴ فریم؛ برش بین فریم ۱۴ و ۱۵. این ابزار کامپوزیت تصاویر ثابت است، نه نرم‌افزار تدوین."></p>
<section><fieldset><legend data-en="Project inputs" data-fa="ورودی پروژه"></legend><label><span data-en="30 numbered PNG frames (0000–0029)" data-fa="۳۰ فریم شماره‌دار PNG از ۰۰۰۰ تا ۰۰۲۹"></span><input id="seq" type="file" accept="image/png" multiple></label><label><span data-en="Outgoing still A (optional)" data-fa="تصویر ثابت شات اول (اختیاری)"></span><input id="a" type="file" accept="image/*"></label><label><span data-en="Incoming still B (optional)" data-fa="تصویر ثابت شات دوم (اختیاری)"></span><input id="b" type="file" accept="image/*"></label><label><span data-en="A / B proof colors" data-fa="رنگ‌های آزمایشی شات اول و دوم"></span> <input id="ca" type="color" value="#e8dcc9"> <input id="cb" type="color" value="#161615"></label></fieldset></section>
<section><canvas id="canvas" width="1920" height="1080" aria-label="Composite preview"></canvas><label><span data-en="Frame" data-fa="فریم"></span> <output id="pos">0 / 29</output><input id="frame" type="range" min="0" max="29" value="0"></label><button id="cut" data-en="Cut frame" data-fa="فریم برش"></button> <button id="png" disabled data-en="Export current PNG" data-fa="خروجی PNG فریم جاری"></button> <button id="save" data-en="Save project JSON" data-fa="ذخیرهٔ پروژه JSON"></button><label><span data-en="Restore project settings (reselect media)" data-fa="بازیابی تنظیمات پروژه (رسانه‌ها را دوباره انتخاب کنید)"></span><input id="restore" type="file" accept="application/json,.json"></label><output id="status" role="status" aria-live="polite"></output></section>
<small data-en="Only #EF4B32 is approved. Other colors and typography are proposals. Mikhak, physical print, native phone and NLE import: OPEN." data-fa="تنها رنگ تأییدشده #EF4B32 است. سایر رنگ‌ها و تایپوگرافی پیشنهادی هستند. میخک، چاپ فیزیکی، گوشی واقعی و ورود به تدوین: OPEN."></small></main>
<script>const $=id=>document.getElementById(id),c=$('canvas'),ctx=c.getContext('2d');let fa=location.pathname.includes('/fa/'),files=[],plates={a:null,b:null},rev=0,load=0,busy=false;const msg=(en,f)=>$('status').textContent=fa?f:en;function lang(){document.documentElement.lang=fa?'fa':'en';document.documentElement.dir=fa?'rtl':'ltr';document.querySelectorAll('[data-en]').forEach(e=>e.textContent=e.dataset[fa?'fa':'en']);$('guide').href=fa?'/hades/fa/library/backgrounds/quiet-courts/transitions/social-ratios/':'/hades/library/backgrounds/quiet-courts/transitions/social-ratios/'}$('lang').onclick=()=>{fa=!fa;lang()};lang();function cover(img){let s=Math.max(c.width/img.width,c.height/img.height);ctx.drawImage(img,(c.width-img.width*s)/2,(c.height-img.height*s)/2,img.width*s,img.height*s)}async function draw(){let v=++rev,i=+$('frame').value,k=i<15?'a':'b',f=files[i];$('png').disabled=true;$('pos').textContent=i+' / 29 · '+(i/24).toFixed(3)+' s';let im=f?await createImageBitmap(f):null;if(v!==rev){im?.close();return}ctx.fillStyle=$(k==='a'?'ca':'cb').value;ctx.fillRect(0,0,c.width,c.height);if(plates[k])cover(plates[k]);if(im){ctx.drawImage(im,0,0);im.close()}$('png').disabled=!f||busy}function fail(){msg('Invalid input or image.','ورودی یا تصویر نامعتبر است.')}async function inspect(f,w,h,i){let im=await createImageBitmap(f);try{if(w&&(im.width!==w||im.height!==h))throw Error('size');if([0,14,15,29].includes(i)){let t=document.createElement('canvas');t.width=im.width;t.height=im.height;let x=t.getContext('2d',{willReadFrequently:true});x.drawImage(im,0,0);let d=x.getImageData(0,0,t.width,t.height).data,expected=i===0||i===29?0:255;for(let j=3;j<d.length;j+=4)if(d[j]!==expected)throw Error('alpha endpoint')}return [im.width,im.height]}finally{im.close()}}$('seq').onchange=async()=>{let token=++load;busy=true;files=[];msg('Validating…','در حال بررسی…');draw();let fs=[...$('seq').files].sort((a,b)=>a.name.localeCompare(b.name));try{if(fs.length!==30||fs.some((f,i)=>!['frame_','HADES_Threshold_','HADES_Lintel_','HADES_Aperture_'].some(prefix=>f.name===prefix+String(i).padStart(4,'0')+'.png'))||new Set(fs.map(f=>f.name.slice(0,-8))).size!==1)throw Error('names');let [w,h]=await inspect(fs[0],0,0,0);if(![[1920,1080],[1080,1920],[1080,1080]].some(([x,y])=>x===w&&y===h))throw Error('ratio');for(let i=1;i<30;i++)await inspect(fs[i],w,h,i);if(token!==load)return;files=fs;c.width=w;c.height=h;busy=false;msg('30 frames validated · '+w+' × '+h,'۳۰ فریم معتبر · '+w+' × '+h);await draw()}catch(e){if(token!==load)return;busy=false;files=[];fail();draw()}};for(let k of ['a','b'])$(k).onchange=async()=>{try{let f=$(k).files[0],im=f?await createImageBitmap(f):null;plates[k]?.close();plates[k]=im;draw()}catch(e){fail()}};for(let k of ['frame','ca','cb'])$(k).oninput=draw;$('cut').onclick=()=>{$('frame').value=14;draw()};function download(blob,name){let u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}$('png').onclick=()=>{let n=$('frame').value;c.toBlob(b=>{if(b)download(b,'HADES_composite_'+String(n).padStart(4,'0')+'_REVIEW.png')},'image/png')};$('save').onclick=()=>download(new Blob([JSON.stringify({schema:1,status:'REVIEW',fps:24,cut:[14,15],frame:+$('frame').value,colors:[$('ca').value,$('cb').value],dimensions:[c.width,c.height],media:{a:$('a').files[0]?.name||null,b:$('b').files[0]?.name||null,sequence:files.map(f=>f.name)}},null,2)],{type:'application/json'}),'HADES_composite_project_REVIEW.json');$('restore').onchange=async()=>{try{let p=JSON.parse(await $('restore').files[0].text());if(p.schema!==1||p.fps!==24||JSON.stringify(p.cut)!=='[14,15]'||!Number.isInteger(p.frame)||p.frame<0||p.frame>29||!Array.isArray(p.colors)||p.colors.length!==2||!p.colors.every(x=>/^#[0-9a-f]{6}$/i.test(x)))throw Error('schema');$('frame').value=p.frame;$('ca').value=p.colors[0];$('cb').value=p.colors[1];msg('Settings restored. Reselect the corresponding media.','تنظیمات بازیابی شد. رسانه‌های متناظر را دوباره انتخاب کنید.');draw()}catch(e){fail()}};draw();</script></html>
