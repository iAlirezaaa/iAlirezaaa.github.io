</style><main><header><span>HADES</span><button type="button" id="lang" aria-label="Change language">FA</button></header><p class="tag">PUBLIC REVIEW · NOT FINAL</p><h1 data-t="title">Production slate editor</h1><p data-t="intro">Edit five fields, select a ratio, then export the editable SVG. No upload, storage or network required.</p><div class="grid"><form id="editor"><label><span data-t="ratio">Aspect ratio</span><select id="ratio"><option value="16x9">16:9 · 1920 × 1080</option><option value="9x16">9:16 · 1080 × 1920</option><option value="1x1">1:1 · 1080 × 1080</option></select></label><label><span data-t="project">Project</span><input id="field-project" dir="auto" value="PROJECT TITLE" maxlength="60" required></label><div class="pair"><label><span data-t="scene">Scene</span><input id="field-scene" dir="auto" value="010" maxlength="18" required></label><label><span data-t="shot">Shot</span><input id="field-shot" dir="auto" value="020" maxlength="18" required></label><label><span data-t="version">Version</span><input id="field-version" dir="auto" value="v001" maxlength="18" required></label><label><span data-t="fps">Frame rate</span><input id="field-fps" dir="auto" value="24" maxlength="18" required></label></div><div class="actions"><button class="primary" type="submit" data-t="export">Download SVG</button><button type="reset" data-t="reset">Reset</button></div><small data-t="note">Long values shrink to fit; use short labels for readable exports. Neutral colors and typography are REVIEW. No logo is included.</small></form><section class="preview" aria-label="Preview"><div id="art" style="width:100%"></div><small id="size" dir="ltr"></small></section></div></main>

<script>
const $=id=>document.getElementById(id), fields=['project','scene','shot','version','fps'], widths={'16x9':[1160,570,510,570,510],'9x16':[620,300,260,300,260],'1x1':[660,320,280,320,280]}, fa={title:'ویرایشگر کارت تولید',intro:'پنج فیلد را ویرایش کنید، نسبت تصویر را انتخاب کنید و SVG قابل‌ویرایش بگیرید. بدون ارسال، ذخیره یا نیاز به اینترنت.',ratio:'نسبت تصویر',project:'نام پروژه',scene:'صحنه',shot:'شات',version:'نسخه',fps:'نرخ فریم',export:'دریافت SVG',reset:'بازنشانی',note:'برای خوانایی از متن کوتاه استفاده کنید؛ متن بلند کوچک می‌شود. رنگ‌های خنثی و تایپ پیشنهادی‌اند. لوگویی در فایل نیست.'};const en=Object.fromEntries([...document.querySelectorAll('[data-t]')].map(e=>[e.dataset.t,e.textContent]));
function draw(){const r=$('ratio').value, svg=$('tpl-'+r).content.firstElementChild.cloneNode(true);$('art').replaceChildren(svg);fields.forEach((id,i)=>{const t=svg.querySelector('#'+id);t.textContent=$('field-'+id).value.trim();const size=Number(t.getAttribute('font-size'));let w=t.getComputedTextLength();if(w>widths[r][i])t.setAttribute('font-size',String(Math.floor(size*widths[r][i]/w)));});$('size').textContent=svg.getAttribute('width')+' × '+svg.getAttribute('height');return svg;}
$('editor').addEventListener('input',draw);$('editor').addEventListener('reset',()=>requestAnimationFrame(draw));$('editor').addEventListener('submit',e=>{e.preventDefault();const svg=draw(), blob=new Blob([new XMLSerializer().serializeToString(svg)],{type:'image/svg+xml;charset=utf-8'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='HADES_Production_Slate_'+$('ratio').value+'_PUBLIC_REVIEW.svg';document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000)});function language(f){document.documentElement.lang=f?'fa':'en';document.documentElement.dir=f?'rtl':'ltr';$('lang').textContent=f?'EN':'FA';$('lang').setAttribute('aria-label',f?'English':'فارسی');document.querySelectorAll('[data-t]').forEach(e=>e.textContent=(f?fa:en)[e.dataset.t]);} $('lang').addEventListener('click',()=>language(document.documentElement.lang==='en'));language(new URLSearchParams(location.search).get('lang')==='fa');draw();
