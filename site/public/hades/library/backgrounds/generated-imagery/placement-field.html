<!doctype html>
<html lang="en" dir="ltr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>HADES | Placement field | REVIEW</title><style>
*{box-sizing:border-box}body{margin:0;background:#242321;color:#f4f0e8;font:16px/1.65 system-ui,Tahoma,sans-serif}main{max-width:900px;margin:auto;padding:16px}header{text-align:center;border-bottom:1px solid #827a70;padding:10px;font-size:13px;letter-spacing:.08em}h1{font-size:clamp(23px,4vw,30px);font-weight:500;line-height:1.35}nav,.actions{display:flex;flex-wrap:wrap;gap:12px;margin:12px 0;align-items:center}a,button,input,select{font:inherit;color:inherit}a{overflow-wrap:anywhere;text-underline-offset:4px}button,select{background:#242321;border:1px solid #a69b8c;min-height:44px;padding:8px;cursor:pointer}option{background:#242321}input{max-width:100%;width:100%;min-height:44px}input::file-selector-button{font:inherit;padding:8px;margin-inline-end:8px}input[type=range]{accent-color:#ef4b32}button:disabled{opacity:.55;cursor:not-allowed}:focus-visible{outline:2px solid #ef4b32;outline-offset:3px}label{display:block}fieldset{border:1px solid #827a70;min-width:0;margin:12px 0;padding:12px}.controls{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}canvas{display:block;width:100%;height:auto;background:#242321;border:1px solid #827a70}pre{white-space:pre-wrap;overflow-wrap:anywhere;direction:ltr;text-align:start;border-block:1px solid #827a70;padding:12px;font:14px/1.5 monospace}small{display:block;font-size:13px}#status{overflow-wrap:anywhere}@media(max-width:480px){.controls{grid-template-columns:1fr}}@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto}}@media print{body{background:white;color:#242321}nav,fieldset,.actions,input,label[for=file],#status{display:none}main{padding:0}canvas{max-height:120mm;object-fit:contain}header{font-size:10pt}pre{font-size:10pt}}@page{size:A4;margin:14mm}
</style></head><body><main><header>HADES · PUBLIC REVIEW</header><nav><button id="language" type="button">فارسی</button><a id="library" href="/hades/library/">Library</a><a id="guide" href="/hades/brand-kit/logo-usage/">Logo usage</a></nav><h1 id="title"></h1><p id="intro"></p><label for="file" id="filelabel"></label><input id="file" type="file" accept="image/png,image/jpeg,image/webp"><fieldset><legend id="legend"></legend><div class="controls"><div><label for="position" id="positionlabel"></label><select id="position"><option value="top"></option><option value="middle"></option><option value="bottom"></option></select></div><div><label for="width" id="widthlabel"></label><input id="width" type="range" min="5" max="30" value="12" step="1"></div><div><label for="height" id="heightlabel"></label><input id="height" type="range" min="5" max="25" value="10" step="1"></div><div><label for="target" id="targetlabel"></label><select id="target"><option value="4.5">4.5:1</option><option value="3">3:1</option></select></div></div></fieldset><p id="status" role="status" aria-live="polite"></p><canvas id="proof" width="640" height="360" role="img"></canvas><pre id="result" aria-live="polite"></pre><div class="actions"><button id="save" type="button" disabled></button><button id="print" type="button" disabled></button></div><small id="note"></small></main><script>
const $=id=>document.getElementById(id);let source=null,receipt=null,epoch=0;
const words={en:['Placement field','Find a quiet centered area for a small existing white mark on a real image. This screens background pixels only; it does not draw, modify or certify any logo.','Choose a local background','Candidate area','Vertical position','Area width','Area height','Screening threshold','Top','Middle','Bottom','Choose an opaque image.','Image could not be decoded or is not opaque (maximum 12 million pixels).','Download JSON','Print / PDF','White #FFFFFF is a technical reference, not a new brand color. The rectangle is a guide only; it is not a plaque. Any candidate with low contrast should be rejected. Exact original-logo contrast, edges and micro-legibility remain OPEN. Neutral colors and type are proposed. Files stay on this device.','Library','Logo usage','Background and candidate outline'],fa:['محدودهٔ جای‌گذاری','روی تصویر واقعی، محدوده‌ای آرام و وسط‌چین برای نشان سفید کوچک موجود پیدا کنید. این ابزار فقط پیکسل‌های پس‌زمینه را می‌سنجد؛ هیچ لوگویی ترسیم، تغییر یا تأیید نمی‌شود.','انتخاب پس‌زمینهٔ محلی','محدودهٔ پیشنهادی','موقعیت عمودی','عرض محدوده','ارتفاع محدوده','آستانهٔ غربالگری','بالا','وسط','پایین','یک تصویر مات انتخاب کنید.','تصویر باز نشد یا مات نیست (حداکثر ۱۲ میلیون پیکسل).','دانلود JSON','چاپ / PDF','سفید #FFFFFF فقط مرجع فنی است، نه رنگ جدید برند. مستطیل صرفاً راهنمای محدوده است و پلاک نیست. محدودهٔ کم‌کنتراست را رد کنید. کنتراست دقیق لوگوی اصلی، لبه‌ها و خوانایی ریز OPEN هستند. رنگ‌های خنثی و فونت پیشنهادی‌اند. فایل‌ها روی دستگاه باقی می‌مانند.','کتابخانه','راهنمای لوگو','پس‌زمینه و خط محدودهٔ پیشنهادی']};
function fa(){return location.hash==='#fa'}function w(){return words[fa()?'fa':'en']}function lang(){document.documentElement.lang=fa()?'fa':'en';document.documentElement.dir=fa()?'rtl':'ltr';['title','intro','filelabel','legend','positionlabel','widthlabel','heightlabel','targetlabel'].forEach((id,i)=>$(id).textContent=w()[i]);[...$('position').options].forEach((o,i)=>o.textContent=w()[8+i]);$('language').textContent=fa()?'English':'فارسی';$('save').textContent=w()[13];$('print').textContent=w()[14];$('note').textContent=w()[15];$('library').textContent=w()[16];$('guide').textContent=w()[17];$('library').href='/hades/'+(fa()?'fa/':'')+'library/';$('guide').href='/hades/'+(fa()?'fa/':'')+'brand-kit/logo-usage/';$('proof').setAttribute('aria-label',w()[18]);$('status').textContent=source?'':w()[11];render()}
function linear(x){x/=255;return x<=.04045?x/12.92:((x+.055)/1.055)**2.4}function luminance(r,g,b){return .2126*linear(r)+.7152*linear(g)+.0722*linear(b)}
function render(){const ww=+$('width').value,hh=+$('height').value;$('widthlabel').textContent=w()[5]+' · '+ww+'%';$('heightlabel').textContent=w()[6]+' · '+hh+'%';if(!source)return;const W=source.width,H=source.height,rw=Math.max(1,Math.round(W*ww/100)),rh=Math.max(1,Math.round(H*hh/100)),x=Math.floor((W-rw)/2),p=$('position').value,y=p==='middle'?Math.floor((H-rh)/2):p==='top'?Math.min(H-rh,Math.round(H*.08)):Math.max(0,H-rh-Math.round(H*.08)),target=+$('target').value;let data=source.getContext('2d').getImageData(x,y,rw,rh).data,min=Infinity,below=0;for(let i=0;i<data.length;i+=4){let ratio=1.05/(luminance(data[i],data[i+1],data[i+2])+.05);min=Math.min(min,ratio);if(ratio<target)below++}receipt={status:'REVIEW',image:[W,H],area_px:{x,y,width:rw,height:rh},reference:'#FFFFFF',threshold:target,min_ratio:Number(min.toFixed(4)),pixels_below:below,total_pixels:rw*rh,decision:below?'REJECT_CANDIDATE':'BACKGROUND_SCREEN_PASS_ONLY',logo_validation:'OPEN'};let c=$('proof'),scale=Math.min(1,1200/W,1200/H);c.width=Math.max(1,Math.round(W*scale));c.height=Math.max(1,Math.round(H*scale));let ctx=c.getContext('2d');ctx.drawImage(source,0,0,c.width,c.height);ctx.strokeStyle='#ef4b32';ctx.lineWidth=2;ctx.setLineDash([6,4]);ctx.strokeRect(x*c.width/W,y*c.height/H,rw*c.width/W,rh*c.height/H);$('result').textContent=JSON.stringify(receipt,null,2);$('save').disabled=false;$('print').disabled=false}
function reset(){source=null;receipt=null;$('save').disabled=true;$('print').disabled=true;$('result').textContent='';let c=$('proof');c.getContext('2d').clearRect(0,0,c.width,c.height)}
$('file').onchange=async()=>{let id=++epoch,b;reset();$('status').textContent=w()[11];try{b=await createImageBitmap($('file').files[0]);if(id!==epoch)return;if(!b.width||!b.height||b.width*b.height>12000000)throw Error('size');let c=document.createElement('canvas');c.width=b.width;c.height=b.height;let ctx=c.getContext('2d',{willReadFrequently:true});ctx.drawImage(b,0,0);let d=ctx.getImageData(0,0,c.width,c.height).data;for(let i=3;i<d.length;i+=4)if(d[i]!==255)throw Error('alpha');source=c;$('status').textContent='';render()}catch(e){if(id===epoch){reset();$('status').textContent=w()[12]}}finally{b?.close()}};
for(const id of ['position','width','height','target'])$(id).oninput=render;$('language').onclick=()=>location.hash=fa()?'en':'fa';$('save').onclick=()=>{if(!receipt)return;const u=URL.createObjectURL(new Blob([JSON.stringify(receipt,null,2)],{type:'application/json'})),a=document.createElement('a');a.href=u;a.download='HADES_Placement_Field_REVIEW.json';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)};$('print').onclick=()=>window.print();addEventListener('hashchange',lang);lang();
</script></body></html>
