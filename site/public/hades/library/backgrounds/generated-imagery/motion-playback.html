<!doctype html>
<html lang="en" dir="ltr"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HADES | Motion playback | REVIEW</title><style>
*{box-sizing:border-box}body{margin:0;background:#191918;color:#f0e8dc;font:16px/1.65 system-ui,Tahoma,sans-serif}main{max-width:740px;margin:auto;padding:20px 16px 40px}header{text-align:center;border-bottom:1px solid #625b50;padding-bottom:16px}small{font-size:13px;letter-spacing:.1em}h1{font-size:clamp(23px,5vw,29px);font-weight:450;line-height:1.35}p{margin:8px 0 16px}button,input{font:inherit;color:inherit;max-width:100%}button{background:#242321;border:1px solid #8a8073;border-radius:4px;padding:8px 12px;min-height:44px;cursor:pointer}button:disabled{opacity:.55;cursor:default}a{color:inherit;text-underline-offset:4px}a:focus-visible,button:focus-visible,input:focus-visible{outline:2px solid #EF4B32;outline-offset:3px}video{display:block;width:100%;max-height:60vh;background:#242321;margin:12px 0}output{display:block;border-inline-start:2px solid #EF4B32;padding:10px 12px;min-height:56px;overflow-wrap:anywhere}label{display:block;margin:10px 0 5px}input[type=range]{width:100%;accent-color:#EF4B32}input[type=file]{width:100%;font-size:14px}.muted{color:#c4b9ac;font-size:14px}.row{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}footer{border-top:1px solid #625b50;margin-top:24px;padding-top:12px}[hidden]{display:none!important}@media print{body{background:white;color:#111}.muted{color:#333}video,button,input,label{display:none}}
</style><main><header><small>HADES / PUBLIC REVIEW</small><p><button id="language" type="button">فارسی</button></p></header><h1 data-t="title">Motion playback review</h1><p data-t="intro"></p><label for="file" data-t="file"></label><input id="file" type="file" accept="video/*"><video id="video" controls playsinline preload="metadata" hidden></video><p class="muted" id="meta" role="status"></p><div class="row"><button id="start" disabled data-t="start"></button><button id="prev" disabled data-t="prev"></button><button id="next" disabled data-t="next"></button></div><label for="frame" data-t="scrub"></label><input id="frame" type="range" min="0" max="143" value="0" step="1" dir="ltr" disabled><output id="phase" for="frame" aria-live="off"></output><p class="muted" data-t="note"></p><p><a download href="HADES_Motion_Markers_FA_REVIEW.srt" data-t="faSrt"></a> · <a download href="HADES_Motion_Markers_EN_REVIEW.srt" data-t="enSrt"></a></p><footer><a id="markers" href="motion-markers.html" data-t="markers"></a> · <a id="desk" href="download-desk.html" data-t="desk"></a></footer></main><script>
const $=id=>document.getElementById(id),v=$('video'),f=$('frame');let fa=false,url='',ready=false,problem=false;
const words={en:{title:'Motion playback review',intro:'Open a local video to compare it against the proposed six-second title timing. Nothing is uploaded.',file:'Local video file',start:'Start of cue',prev:'−1 reference frame',next:'+1 reference frame',scrub:'Reference frame at 24 fps',note:'Reference frames are time-based, not decoded source frame indices. The reference ends at 6 seconds. No actual source fps or contrast certification is implied. SRT tracks are review annotations; NLE import remains OPEN.',faSrt:'Persian SRT',enSrt:'English SRT',markers:'Timing markers',desk:'Download desk',empty:'Choose a video to begin.',loading:'Loading local video…',error:'Video could not be decoded.',outside:'Outside reference cue',phases:['Pre-roll','Title reveal','Title hold','Title exit','Post-roll']},fa:{title:'بازبینی پخش موشن',intro:'ویدیوی محلی را باز کنید و آن را با زمان‌بندی پیشنهادی شش‌ثانیه‌ای عنوان مقایسه کنید. هیچ فایلی آپلود نمی‌شود.',file:'فایل ویدیوی محلی',start:'ابتدای زمان‌بندی',prev:'یک فریم مرجع عقب',next:'یک فریم مرجع جلو',scrub:'فریم مرجع با نرخ ۲۴',note:'شمارهٔ فریم مرجع بر اساس زمان است، نه شمارهٔ فریم واقعی فایل. مرجع در ثانیهٔ ۶ پایان می‌یابد. نرخ فریم منبع و کنتراست تأیید نشده‌اند. فایل SRT فقط برای بازبینی است؛ آزمون ورود به نرم‌افزار تدوین OPEN است.',faSrt:'دانلود SRT فارسی',enSrt:'دانلود SRT انگلیسی',markers:'نشانگرهای زمان‌بندی',desk:'میز دانلود',empty:'ابتدا یک ویدیو انتخاب کنید.',loading:'در حال خواندن ویدیوی محلی…',error:'خواندن ویدیو ممکن نشد.',outside:'خارج از بازهٔ مرجع',phases:['پیش از ورود','ورود عنوان','مکث عنوان','خروج عنوان','پس از خروج']}};
const t=k=>words[fa?'fa':'en'][k];function phase(){const seconds=v.currentTime||0,n=Math.floor(seconds*24+1e-6),i=n<12?0:n<24?1:n<108?2:n<120?3:4;f.value=Math.min(Number(f.max),n);const b=document.createElement('bdi');b.textContent=seconds.toFixed(3)+' s · '+n;$('phase').replaceChildren((seconds>=6?t('outside'):t('phases')[i])+' · ',b);$('meta').textContent=ready?v.videoWidth+' × '+v.videoHeight+' · '+v.duration.toFixed(3)+' s':problem?t('error'):url?t('loading'):t('empty');}
function controls(){for(const id of ['start','prev','next','frame'])$(id).disabled=!ready;phase()}
function language(){fa=location.hash==='#fa';document.documentElement.lang=fa?'fa':'en';document.documentElement.dir=fa?'rtl':'ltr';document.querySelectorAll('[data-t]').forEach(e=>e.textContent=t(e.dataset.t));$('language').textContent=fa?'English':'فارسی';for(const id of ['markers','desk'])$(id).href=(id==='markers'?'motion-markers.html':'download-desk.html')+(fa?'#fa':'');phase()}
function seek(n){if(!ready)return;v.pause();v.currentTime=Math.max(0,Math.min(v.duration,n/24));phase()}
$('file').addEventListener('change',()=>{v.pause();v.removeAttribute('src');v.load();if(url)URL.revokeObjectURL(url);url='';ready=false;problem=false;v.hidden=true;const file=$('file').files[0];if(file){url=URL.createObjectURL(file);v.src=url;v.hidden=false}controls()});v.addEventListener('loadedmetadata',()=>{ready=Number.isFinite(v.duration)&&v.duration>0;f.max=Math.min(143,Math.max(0,Math.ceil(v.duration*24)-1));controls()});v.addEventListener('error',()=>{ready=false;problem=!!url;controls()});v.addEventListener('timeupdate',phase);v.addEventListener('seeked',phase);$('start').onclick=()=>seek(0);$('prev').onclick=()=>seek(Math.floor(v.currentTime*24+1e-6)-1);$('next').onclick=()=>seek(Math.floor(v.currentTime*24+1e-6)+1);f.oninput=()=>seek(Number(f.value));$('language').onclick=()=>location.hash=fa?'en':'fa';addEventListener('hashchange',language);language();controls();
</script></html>
