<!doctype html>
<html lang="en" dir="ltr"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HADES | Motion cue sheet | REVIEW</title><style>
*{box-sizing:border-box}body{margin:0;background:#191918;color:#f0e8dc;font:16px/1.6 system-ui,Tahoma,sans-serif}main{max-width:760px;margin:auto;padding:20px 16px 48px}header{text-align:center;border-bottom:1px solid #625b50;padding-bottom:16px}h1{font-size:clamp(22px,5vw,29px);font-weight:450}h2{font-size:18px;font-weight:500}small,p.note{color:#c4b9ac}a{color:inherit}button,input,select{font:inherit;color:inherit;background:#242321;border:1px solid #92877b;padding:8px;min-height:44px;border-radius:4px;width:100%}button{cursor:pointer}button:disabled{opacity:.6;cursor:not-allowed}button:focus-visible,input:focus-visible,select:focus-visible,a:focus-visible{outline:2px solid #EF4B32;outline-offset:3px}label{display:block}fieldset{border:0;border-top:1px solid #625b50;padding:12px 0;margin:16px 0;min-width:0}legend{padding-inline-end:12px}.pair{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.track{display:flex;direction:ltr;height:14px;background:#4a4540;position:relative;margin:16px 0}.track span{position:absolute;height:100%;background:#EF4B32}.actions{display:grid;gap:8px}#status{border-inline-start:2px solid #EF4B32;padding-inline-start:10px;overflow-wrap:anywhere}input[type=number]{direction:ltr}footer{margin-top:24px}@media print{body{background:white;color:black}small,p.note{color:#333}button,footer{display:none}input,select{background:white;color:black;border:0;padding:0;min-height:0}fieldset{break-inside:avoid}main{padding:0}.track{display:none}}
</style><body><main><header><small>HADES / PUBLIC REVIEW</small><h1 data-t="title"></h1><button id="lang" type="button">فارسی</button></header><p data-t="intro"></p><div class="pair"><label><span data-t="fps"></span><select id="fps"><option>24</option><option>25</option><option>30</option></select></label><label><span data-t="total"></span><input id="total" type="number" min="1" max="86400" step="1" value="144"></label></div><div id="rows"></div><div class="track" id="track" aria-hidden="true"></div><p id="status" role="status" aria-live="polite"></p><div class="actions"><button id="export" data-t="export" type="button"></button><button id="print" data-t="print" type="button"></button></div><p class="note" data-t="note"></p><footer><a id="back" data-t="back"></a></footer></main><script>
const words={en:{title:'Motion cue sheet',intro:'Editable frame ranges for a title reveal, hold and exit. End frames are exclusive; no logo is included.',fps:'Frames per second',total:'Sequence frames',reveal:'01 / Reveal',hold:'02 / Hold',exit:'03 / Exit',start:'Start frame',end:'End frame',export:'Download cue CSV',print:'Print cue sheet',note:'REVIEW timing proposal only. Typeface, physical print and optical motion checks remain open. No audio or logo supplied.',back:'Return to downloads',valid:'Valid non-overlapping ranges. Sequence duration:',invalid:'OPEN: use whole frame numbers, in order, within the sequence. Each end must be after its start.'},fa:{title:'برگهٔ زمان‌بندی موشن',intro:'بازه‌های قابل‌ویرایش برای ورود، مکث و خروج عنوان. فریم پایان در بازه حساب نمی‌شود؛ لوگویی در فایل وجود ندارد.',fps:'فریم بر ثانیه',total:'تعداد فریم سکانس',reveal:'۰۱ / ورود',hold:'۰۲ / مکث',exit:'۰۳ / خروج',start:'فریم آغاز',end:'فریم پایان',export:'دانلود جدول CSV',print:'چاپ برگهٔ زمان‌بندی',note:'زمان‌بندی پیشنهادی REVIEW است. آزمون تایپ‌فیس، چاپ واقعی و خوانایی در حرکت باز است. صدا یا لوگو ارائه نشده است.',back:'بازگشت به دانلودها',valid:'بازه‌ها معتبر و بدون هم‌پوشانی هستند. مدت سکانس:',invalid:'OPEN: فریم‌ها باید عدد صحیح، مرتب و داخل سکانس باشند. پایان هر بازه باید بعد از آغاز آن باشد.'}};
const $=id=>document.getElementById(id),keys=['reveal','hold','exit'],defaults=[[12,24],[24,108],[108,120]];let fa=false,valid=false;for(let i=0;i<3;i++){const f=document.createElement('fieldset');f.innerHTML='<legend data-t="'+keys[i]+'"></legend><div class="pair"><label><span data-t="start"></span><input type="number" min="0" step="1" id="s'+i+'" value="'+defaults[i][0]+'"></label><label><span data-t="end"></span><input type="number" min="1" step="1" id="e'+i+'" value="'+defaults[i][1]+'"></label></div>';$('rows').append(f)}function values(){return keys.map((k,i)=>[k,$('s'+i).valueAsNumber,$('e'+i).valueAsNumber])}function check(){const n=$('total').valueAsNumber,r=values(),fps=Number($('fps').value),w=words[fa?'fa':'en'];valid=Number.isInteger(n)&&n>=1&&n<=86400&&r.every((x,i)=>Number.isInteger(x[1])&&Number.isInteger(x[2])&&x[1]>=0&&x[2]>x[1]&&x[2]<=n&&(!i||x[1]>=r[i-1][2]));$('export').disabled=!valid;$('track').replaceChildren();if(valid){for(const x of r){const s=document.createElement('span');s.style.left=x[1]/n*100+'%';s.style.width=(x[2]-x[1])/n*100+'%';$('track').append(s)}}$('status').textContent=valid?w.valid+' '+(n/fps).toFixed(2)+' s':w.invalid}function language(){fa=location.hash==='#fa';document.documentElement.lang=fa?'fa':'en';document.documentElement.dir=fa?'rtl':'ltr';const w=words[fa?'fa':'en'];document.querySelectorAll('[data-t]').forEach(x=>x.textContent=w[x.dataset.t]);$('lang').textContent=fa?'English':'فارسی';$('back').href='download-desk.html'+(fa?'#fa':'');check()}$('lang').onclick=()=>location.hash=fa?'en':'fa';addEventListener('hashchange',language);document.addEventListener('input',check);$('fps').onchange=check;$('print').onclick=()=>window.print();$('export').onclick=()=>{check();if(!valid)return;const fps=Number($('fps').value),n=$('total').valueAsNumber;const csv=['status,cue,fps,sequence_frames,start_inclusive,end_exclusive,duration_frames,duration_seconds',...values().map(([k,s,e])=>['REVIEW',k,fps,n,s,e,e-s,((e-s)/fps).toFixed(6)].join(','))].join('\n')+'\n';const url=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));const a=document.createElement('a');a.href=url;a.download='HADES_Motion_Cue_Sheet_REVIEW.csv';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};language();
</script></body></html>
