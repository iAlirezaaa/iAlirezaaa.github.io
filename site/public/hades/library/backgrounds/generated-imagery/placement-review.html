<!doctype html>
<html lang="en" dir="ltr"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HADES · Title placement · REVIEW</title>
<style>*{box-sizing:border-box}body{margin:0;background:#191918;color:#f0e8dc;font:16px/1.65 system-ui,Tahoma,sans-serif}main{max-width:780px;margin:auto;padding:20px 16px 40px}header{text-align:center;border-bottom:1px solid #625c53;padding:10px 0 16px}h1{font-size:clamp(23px,5vw,30px);font-weight:450;margin:12px 0}label{display:block;margin:12px 0 4px}input,button{font:inherit;color:inherit;background:#292724;border:1px solid #938779;border-radius:4px;padding:8px;min-height:44px;max-width:100%}input{width:100%}button{cursor:pointer}a{color:inherit;text-underline-offset:4px}:focus-visible{outline:2px solid #EF4B32;outline-offset:3px}canvas{display:block;width:100%;height:auto;background:#302e2a;border:1px solid #938779;margin:12px 0}p{margin:10px 0}.muted{color:#c8bfb2;font-size:14px}bdi{font-variant-numeric:tabular-nums}a,button{overflow-wrap:anywhere}@media print{body{background:white;color:black}button,input,label{display:none}.muted{color:black}canvas{max-width:420px}}</style>
<main><header><small>HADES · PUBLIC REVIEW</small><h1 data-en="Title placement study" data-fa="بررسی جای‌گذاری عنوان">Title placement study</h1><button id="language" type="button">فارسی</button></header>
<p data-en="Compare the native landscape title with a proposed translation of 26 pixels left. No scaling, recoloring or editing of the source. The 10% margin is a working proposal, not a platform standard." data-fa="عنوان افقی اصلی را با پیشنهاد انتقال ۲۶ پیکسل به چپ مقایسه کنید. بدون تغییر اندازه، رنگ یا فایل اصلی. حاشیهٔ ۱۰٪ یک پیشنهاد کاری است، نه استاندارد پلتفرم."></p>
<label for="overlay" data-en="Native 1280 × 720 PNG (local)" data-fa="فایل PNG اصلی ۱۲۸۰ × ۷۲۰ (محلی)"></label><input id="overlay" type="file" accept="image/png">
<label for="bg" data-en="Optional 1280 × 720 background still (local)" data-fa="فریم پس‌زمینهٔ اختیاری ۱۲۸۰ × ۷۲۰ (محلی)"></label><input id="bg" type="file" accept="image/png,image/jpeg,image/webp">
<p class="muted" id="status" role="status"></p><label for="dx" data-en="Horizontal translation (pixels; negative = left)" data-fa="جابه‌جایی افقی (پیکسل؛ منفی یعنی چپ)"></label><input id="dx" type="range" min="-100" max="0" step="1" value="-26" dir="ltr"><bdi id="offset" dir="ltr"></bdi>
<p data-en="Original" data-fa="جای اصلی"></p><canvas id="before" width="1280" height="720" aria-label="Original placement"></canvas><p data-en="Proposed" data-fa="جای پیشنهادی"></p><canvas id="after" width="1280" height="720" aria-label="Proposed placement"></canvas>
<p id="measure" role="status"></p><p><a href="HADES_Landscape_Placement_REVIEW.json" download data-en="Download editable placement recipe (JSON)" data-fa="دریافت دستور جای‌گذاری قابل‌ویرایش (JSON)"></a></p><p class="muted" data-en="Vermilion outline: proposed safe area. Preview only; no source files are overwritten. Actual footage contrast and owner approval remain OPEN. Neutral background is proposed; font is system fallback." data-fa="خط ورمیلیون: محدودهٔ امن پیشنهادی. فقط پیش‌نمایش؛ هیچ فایل اصلی بازنویسی نمی‌شود. کنتراست روی ویدیوی واقعی و تأیید مالک OPEN است. رنگ زمینه پیشنهادی و فونت جایگزین سیستمی است."></p><a id="back" href="download-desk.html" data-en="Back to download desk" data-fa="بازگشت به میز دانلود"></a></main>
<script>
const $=id=>document.getElementById(id);let fa=false,overlay=null,bg=null,bounds=[961,199,1178,288],message='';const tr=(en,ar)=>fa?ar:en;function draw(){const dx=Number($('dx').value);$('offset').textContent=dx+' px';for(const [id,x] of [['before',0],['after',dx]]){const c=$(id).getContext('2d');c.fillStyle='#302e2a';c.fillRect(0,0,1280,720);if(bg)c.drawImage(bg,0,0);if(overlay)c.drawImage(overlay,x,0);else{c.strokeStyle='#e8dfd1';c.lineWidth=4;c.setLineDash([12,8]);c.strokeRect(bounds[0]+x,bounds[1],bounds[2]-bounds[0],bounds[3]-bounds[1]);c.setLineDash([])}c.strokeStyle='#EF4B32';c.lineWidth=4;c.strokeRect(128,72,1024,576)}const excess=Math.max(0,bounds[2]+dx-1152,128-(bounds[0]+dx),72-bounds[1],bounds[3]-648);$('measure').textContent=tr('Proposed overflow: ','بیرون‌زدگی پیشنهادی: ')+excess+' px · '+(excess?tr('outside','خارج از محدوده'):tr('within margin','در محدوده'));$('status').textContent=message||tr(overlay?'PNG loaded locally':'Dashed box is measured geometry only; select the source PNG.',overlay?'PNG به‌صورت محلی باز شد':'کادر خط‌چین فقط هندسهٔ اندازه‌گیری‌شده است؛ فایل اصلی را انتخاب کنید.');}
async function load(id){const f=$(id).files[0];if(id==='overlay'){overlay=null;bounds=[961,199,1178,288]}else bg=null;message='';if(!f){draw();return}try{const i=await createImageBitmap(f);if(i.width!==1280||i.height!==720)throw Error('size');if(id==='overlay'){const c=document.createElement('canvas');c.width=1280;c.height=720;const g=c.getContext('2d');g.drawImage(i,0,0);const a=g.getImageData(0,0,1280,720).data;let l=1280,t=720,r=0,b=0;for(let y=0;y<720;y++)for(let x=0;x<1280;x++)if(a[(y*1280+x)*4+3]){l=Math.min(l,x);t=Math.min(t,y);r=Math.max(r,x+1);b=Math.max(b,y+1)}if(r===0||l===0&&t===0&&r===1280&&b===720)throw Error('alpha');bounds=[l,t,r,b];overlay=i}else bg=i}catch(e){message=tr('Rejected: require 1280 × 720 image; overlay must have nonempty transparent bounds.','رد شد: تصویر باید ۱۲۸۰ × ۷۲۰ باشد؛ لایهٔ عنوان باید محدودهٔ شفاف و غیرخالی داشته باشد.')}draw()}
function lang(){fa=location.hash==='#fa';document.documentElement.lang=fa?'fa':'en';document.documentElement.dir=fa?'rtl':'ltr';document.querySelectorAll('[data-en]').forEach(e=>e.textContent=fa?e.dataset.fa:e.dataset.en);$('language').textContent=fa?'English':'فارسی';$('back').href='download-desk.html'+(fa?'#fa':'#en');message='';draw()}$('overlay').onchange=()=>load('overlay');$('bg').onchange=()=>load('bg');$('dx').oninput=draw;$('language').onclick=()=>location.hash=fa?'en':'fa';addEventListener('hashchange',lang);lang();
</script></html>
