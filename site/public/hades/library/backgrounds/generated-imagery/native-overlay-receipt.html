<!doctype html>
<html lang="en" dir="ltr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HADES · Native overlay receipt · REVIEW</title><style>
:root{color-scheme:dark;--bg:#191918;--fg:#f0e8dc;--muted:#c4b9ac;--accent:#EF4B32}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.65 system-ui,Tahoma,sans-serif}main{max-width:760px;margin:auto;padding:20px 16px 40px}header{text-align:center;border-bottom:1px solid #514b43;padding:8px 0 18px}header small{letter-spacing:.12em}h1{font-size:clamp(23px,5vw,30px);font-weight:450;line-height:1.3}p{margin:8px 0 16px}.muted{color:var(--muted);font-size:14px}a{color:inherit;text-underline-offset:4px}button,select,input{font:inherit;color:inherit;max-width:100%;min-width:0}button,select{background:#242321;border:1px solid #7d7469;border-radius:4px;padding:8px 12px;min-height:44px}button:disabled{opacity:.5}label{display:block;margin:12px 0 4px}select,input[type=file]{width:100%}button:focus-visible,select:focus-visible,input:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:3px}#result{border-inline-start:2px solid var(--accent);padding-inline-start:12px;overflow-wrap:anywhere}dl{display:grid;grid-template-columns:minmax(0,1fr);gap:4px;margin:12px 0}dt{color:var(--muted);font-size:14px}dd{margin:0;overflow-wrap:anywhere}code{font-size:13px}footer{border-top:1px solid #514b43;margin-top:24px;padding-top:14px}@media print{body{background:white;color:#111}.muted,dt{color:#444}button,input,select{display:none}main{padding:0}}
</style></head><body><main><header><small>HADES / PUBLIC REVIEW</small><p class="muted" data-t="sub"></p><button id="lang" type="button">فارسی</button></header><h1 data-t="title"></h1><p data-t="intro"></p><label for="asset" data-t="asset"></label><select id="asset"><option value="landscape">16:9 · 1280 × 720</option><option value="portrait">9:16 · 720 × 1280</option></select><dl><dt data-t="size"></dt><dd><bdi id="size"></bdi></dd><dt data-t="sha"></dt><dd><code dir="ltr" id="sha"></code></dd></dl><label for="file" data-t="file"></label><input id="file" type="file" accept="image/png,.png"><p id="result" role="status" aria-live="polite"></p><button id="save" type="button" disabled data-t="save"></button><p class="muted" data-t="note"></p><footer><a id="desk" data-t="desk"></a> · <a id="library" data-t="library"></a></footer></main><script>
async function digest(buf){if(globalThis.crypto?.subtle)return Array.from(new Uint8Array(await crypto.subtle.digest('SHA-256',buf)),v=>v.toString(16).padStart(2,'0')).join('');let K=[],H=[];for(let n=2;K.length<64;n++){let prime=true;for(let j=2;j*j<=n;j++)if(n%j===0){prime=false;break}if(prime){if(H.length<8)H.push((Math.sqrt(n)%1*4294967296)|0);K.push((Math.cbrt(n)%1*4294967296)|0)}}let N=buf.byteLength,L=Math.ceil((N+9)/64)*64,B=new Uint8Array(L);B.set(new Uint8Array(buf));B[N]=128;let D=new DataView(B.buffer);D.setUint32(L-4,N*8);let W=new Int32Array(64),r=(x,n)=>(x>>>n)|(x<<(32-n));for(let i=0;i<L;i+=64){for(let j=0;j<16;j++)W[j]=D.getInt32(i+4*j);for(let j=16;j<64;j++){let x=W[j-15],y=W[j-2];W[j]=(W[j-16]+(r(x,7)^r(x,18)^(x>>>3))+W[j-7]+(r(y,17)^r(y,19)^(y>>>10)))|0}let [a,b,c,d,e,f,g,h]=H;for(let j=0;j<64;j++){let t=(h+(r(e,6)^r(e,11)^r(e,25))+((e&f)^(~e&g))+K[j]+W[j])|0,u=((r(a,2)^r(a,13)^r(a,22))+((a&b)^(a&c)^(b&c)))|0;h=g;g=f;f=e;e=(d+t)|0;d=c;c=b;b=a;a=(t+u)|0}H=H.map((v,j)=>(v+[a,b,c,d,e,f,g,h][j])|0)}return H.map(v=>(v>>>0).toString(16).padStart(8,'0')).join('')}
const records={landscape:{width:1280,height:720,bytes:16473,sha256:'bed6c87fa443d754e28a067786fb1e606812b0132c2c6bad75c07be71d82eb83'},portrait:{width:720,height:1280,bytes:16139,sha256:'1dd271dbe36d968671dc541561c2941639ff1fa1493e7ebe5baae8bedf330af5'}};
const words={en:{sub:'Native motion layers · repository transfer OPEN',title:'Native overlay receipt',intro:'Check the exact original RGBA title PNG saved from the review conversation. A receipt proves byte identity, not public availability or contrast approval.',asset:'Expected original',size:'Expected size in bytes',sha:'Expected SHA-256',file:'Choose a local PNG',save:'Save verified receipt (JSON)',note:'Files stay on your device. The two originals are not hosted here. Source video, full portrait contrast, Mikhak and physical print remain OPEN. No logo or plaque is added.',desk:'Download desk',library:'Brand library',choose:'Choose the original PNG to verify.',working:'Checking original bytes…',match:'MATCH — exact original RGBA PNG',wrong:'MISMATCH — not the recorded original',unsupported:'SHA-256 unavailable; open in a secure browser context.',error:'Could not read this file.'},fa:{sub:'لایه‌های اصلی موشن · انتقال به ریپو OPEN',title:'رسید فایل اصلی موشن',intro:'PNG اصلی RGBA عنوان را که از گفتگوی بازبینی ذخیره کرده‌اید بررسی کنید. رسید فقط یکسان بودن بایت‌ها را ثابت می‌کند، نه دسترسی عمومی یا تأیید کنتراست.',asset:'فایل اصلی مورد انتظار',size:'اندازهٔ مورد انتظار به بایت',sha:'هش مورد انتظار SHA-256',file:'انتخاب PNG محلی',save:'دریافت رسید تأییدشده (JSON)',note:'فایل‌ها روی دستگاه شما می‌مانند. دو فایل اصلی در این صفحه میزبانی نشده‌اند. ویدیوی منبع، کنتراست کامل عمودی، فونت میخک و چاپ فیزیکی OPEN هستند. هیچ لوگو یا پلاکی اضافه نمی‌شود.',desk:'میز دانلود',library:'کتابخانهٔ برند',choose:'فایل اصلی PNG را برای بررسی انتخاب کنید.',working:'در حال بررسی بایت‌های فایل اصلی…',match:'MATCH — فایل اصلی RGBA دقیقاً یکسان است',wrong:'MISMATCH — فایل با نسخهٔ اصلی یکسان نیست',unsupported:'SHA-256 در دسترس نیست؛ صفحه را در محیط امن مرورگر باز کنید.',error:'خواندن فایل ممکن نشد.'}};
const $=id=>document.getElementById(id);let fa=false,epoch=0,receipt=null,state='choose';const t=k=>words[fa?'fa':'en'][k];function show(){ $('result').textContent=t(state);$('save').disabled=!receipt;}function language(){fa=location.hash==='#fa';document.documentElement.lang=fa?'fa':'en';document.documentElement.dir=fa?'rtl':'ltr';document.querySelectorAll('[data-t]').forEach(e=>e.textContent=t(e.dataset.t));$('lang').textContent=fa?'English':'فارسی';$('lang').setAttribute('aria-label',fa?'تغییر زبان به انگلیسی':'Switch to Persian');$('desk').href='download-desk.html'+(fa?'#fa':'');$('library').href='/hades/'+(fa?'fa/':'')+'library/';show()}
async function verify(){const token=++epoch,key=$('asset').value,r=records[key],f=$('file').files[0];receipt=null;$('size').textContent=r.bytes;$('sha').textContent=r.sha256;state='choose';show();if(!f)return;if(f.size!==r.bytes){state='wrong';show();return}state='working';show();try{const b=await f.arrayBuffer();const v=new DataView(b);const png=v.getUint32(0)===0x89504e47&&v.getUint32(4)===0x0d0a1a0a&&v.getUint32(12)===0x49484452&&v.getUint32(16)===r.width&&v.getUint32(20)===r.height&&v.getUint8(25)===6;const sha=await digest(b);if(token!==epoch)return;if(png&&sha===r.sha256){receipt={schema:'hades-native-overlay-receipt-v1',asset:key,width:r.width,height:r.height,bytes:r.bytes,sha256:sha,identity:'MATCH',status:'PUBLIC REVIEW',repository_transfer:'OPEN',live_http:'OPEN',contrast_approval:'NOT ESTABLISHED'};state='match'}else state='wrong';show()}catch(e){if(token===epoch){state='error';show()}}}
$('save').addEventListener('click',()=>{if(!receipt)return;const u=URL.createObjectURL(new Blob([JSON.stringify(receipt,null,2)+'\n'],{type:'application/json'}));const a=document.createElement('a');a.href=u;a.download='HADES_'+receipt.asset+'_receipt_REVIEW.json';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)});$('asset').addEventListener('change',verify);$('file').addEventListener('change',verify);$('lang').addEventListener('click',()=>location.hash=fa?'en':'fa');addEventListener('hashchange',language);language();verify();
</script></body></html>
