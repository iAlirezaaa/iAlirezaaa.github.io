<!doctype html>
<html lang="en" dir="ltr"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>HADES · Creator credit review</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#191918;color:#f4f0e8;font:16px/1.65 system-ui,Tahoma,sans-serif}main{max-width:760px;margin:auto;padding:20px 16px 48px}header{text-align:center;border-bottom:1px solid #625b50;padding-bottom:14px}small{letter-spacing:.08em}h1{font-size:clamp(23px,5vw,30px);font-weight:450;line-height:1.35}h2{font-size:18px;font-weight:500}p{margin:8px 0 16px}a{color:inherit;text-underline-offset:4px}button,input,textarea{font:inherit;color:inherit;background:#262522;border:1px solid #827a70;border-radius:4px;padding:8px;min-height:44px;width:100%}button{cursor:pointer}button:focus-visible,input:focus-visible,textarea:focus-visible,a:focus-visible{outline:2px solid #EF4B32;outline-offset:3px}label{display:block;margin:10px 0 4px}fieldset{border:0;padding:0;margin:20px 0;min-width:0}legend{font-size:18px}label.check{display:flex;align-items:flex-start;gap:10px;min-height:44px}input[type=checkbox]{width:20px;min-height:20px;margin-top:8px;flex-shrink:0;accent-color:#EF4B32}textarea{resize:vertical;min-height:72px}#status{border-inline-start:3px solid #EF4B32;padding:10px 12px;overflow-wrap:anywhere}.muted{color:#c6baac;font-size:14px}.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px}footer{margin-top:24px;border-top:1px solid #625b50;padding-top:16px}#lang{width:auto}.primary{background:#EF4B32;color:#111}@media(max-width:370px){.actions{grid-template-columns:1fr}}@media print{body{background:white;color:black}.muted{color:#333}button,footer{display:none}main{max-width:none}input,textarea{background:white;color:black}fieldset{break-inside:avoid}}
</style><main><header><small>HADES / PUBLIC REVIEW</small><p class="muted" data-t="header"></p><button id="lang" type="button">فارسی</button></header><h1 data-t="title"></h1><p data-t="intro"></p><p class="muted" data-t="privacy"></p><label for="ref" data-t="ref"></label><input id="ref" maxlength="120" autocomplete="off"><label for="en" data-t="en"></label><textarea id="en" dir="ltr" maxlength="240"></textarea><label for="fa" data-t="fa"></label><textarea id="fa" dir="rtl" maxlength="240"></textarea><fieldset><legend data-t="checks"></legend><div id="checks"></div></fieldset><p id="status" role="status" aria-live="polite"></p><p class="muted" data-t="warning"></p><div class="actions"><button class="primary" id="export" type="button" data-t="export"></button><button id="print" type="button" data-t="print"></button></div><footer><a id="library" data-t="library"></a> · <a id="logo" data-t="logo"></a> · <a id="desk" data-t="desk"></a></footer></main>
<script>
const keys=['rights','copy','design','placement','release'];const w={en:{header:'Independent work · proposed attribution',title:'Creator credit review sheet',intro:'Keep the product identity primary. Creator attribution is optional, text-only by default, and approximately 10% in visual prominence—not a pixel ratio.',privacy:'Use a non-sensitive reference only. Entries stay in memory on this device; no upload or persistence. Export only for private review.',ref:'Work version / neutral reference',en:'Exact English credit proposal',fa:'Exact Persian credit proposal',checks:'Evidence checklist (self-reported)',rights:'Project-specific creator and rights-holder permission checked',copy:'Both exact language versions reviewed',design:'Actual product identity and native-size legibility reviewed',placement:'Credit is visually secondary; no logo substitution',release:'Specific surface and publication permission checked',hold:'HOLD — incomplete review record',ready:'HOLD — checklist filled; independent sign-off still required',warning:'This tool never grants approval. Do not publish from this receipt; obtain separate human authorization.',export:'Export review JSON',print:'Print review sheet',library:'Library',logo:'Logo usage',desk:'Download desk'},fa:{header:'اثر مستقل · اعتبار پیشنهادی خالق',title:'برگهٔ بازبینی امضای خالق',intro:'هویت محصول باید غالب بماند. امضای خالق اختیاری و در حالت پیش‌فرض متنی است؛ حدود ۱۰٪ اهمیت بصری، نه نسبت پیکسلی.',privacy:'فقط شناسهٔ غیرحساس وارد کنید. داده‌ها در حافظهٔ دستگاه می‌مانند؛ آپلود یا ذخیرهٔ دائمی نمی‌شوند. خروجی فقط برای بازبینی خصوصی است.',ref:'نسخهٔ اثر / شناسهٔ غیرحساس',en:'متن دقیق پیشنهادی انگلیسی',fa:'متن دقیق پیشنهادی فارسی',checks:'فهرست بررسی شواهد (خوداظهاری)',rights:'مجوز خالق و صاحب حقوق برای همین پروژه بررسی شده است',copy:'هر دو نسخهٔ دقیق زبانی بازبینی شده‌اند',design:'هویت واقعی محصول و خوانایی در اندازهٔ اصلی بررسی شده است',placement:'امضا نامسلط است و جایگزین لوگو نشده است',release:'مجوز سطح انتشار و انتشار مشخص بررسی شده است',hold:'HOLD — پروندهٔ بازبینی ناقص است',ready:'HOLD — فهرست تکمیل شده؛ تأیید مستقل انسانی هنوز لازم است',warning:'این ابزار هیچ مجوزی صادر نمی‌کند. از روی این رسید منتشر نکنید؛ تأیید جداگانهٔ انسانی لازم است.',export:'دریافت JSON بازبینی',print:'چاپ برگهٔ بازبینی',library:'کتابخانه',logo:'کاربرد لوگو',desk:'میز دانلود'}};
const $=id=>document.getElementById(id);let fa=false;for(const k of keys){const l=document.createElement('label');l.className='check';const c=document.createElement('input');c.type='checkbox';c.id=k;const s=document.createElement('span');s.dataset.t=k;l.append(c,s);$('checks').append(l)}function record(){return {schema:'hades.creator-credit-review.v1',status:'HOLD',reference:$('ref').value.trim(),copy:{en:$('en').value.trim(),fa:$('fa').value.trim()},self_reported:Object.fromEntries(keys.map(k=>[k,$(k).checked])),authorization:null}}function update(){const r=record();$('status').textContent=w[fa?'fa':'en'][r.reference&&r.copy.en&&r.copy.fa&&keys.every(k=>r.self_reported[k])?'ready':'hold']}function language(){fa=location.hash==='#fa';document.documentElement.lang=fa?'fa':'en';document.documentElement.dir=fa?'rtl':'ltr';for(const el of document.querySelectorAll('[data-t]'))el.textContent=w[fa?'fa':'en'][el.dataset.t];$('lang').textContent=fa?'English':'فارسی';$('library').href='/hades/'+(fa?'fa/':'')+'library/';$('logo').href='/hades/'+(fa?'fa/':'')+'brand-kit/logo-usage/';$('desk').href='/hades/library/backgrounds/generated-imagery/download-desk.html'+(fa?'#fa':'#en');update()}$('lang').onclick=()=>location.hash=fa?'en':'fa';addEventListener('hashchange',language);document.addEventListener('input',update);$('print').onclick=()=>window.print();$('export').onclick=()=>{const u=URL.createObjectURL(new Blob([JSON.stringify(record(),null,2)+'\n'],{type:'application/json'}));const a=document.createElement('a');a.href=u;a.download='HADES_Creator_Credit_HOLD.json';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)};language();
</script></html>
