<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" role="img" aria-labelledby="title desc">
<title id="title">تصمیم و گام بعدی / مدرن / بازبینی</title>
<desc id="desc">ترکیب‌بندی قابل‌ویرایش؛ بدون نشان یا امضای خالق. رنگ‌های خنثی و فونت پیشنهادی‌اند. ورمیلیون #EF4B32 تأیید شده است.</desc>
<rect id="background" width="1920" height="1080" fill="#F4F0E8"/>
<g font-family="Tahoma,Arial,sans-serif" font-weight="400" direction="rtl" text-anchor="start">
<rect x="1744" y="110" width="56" height="5" fill="#EF4B32"/>
<text id="project" x="1800" y="175" font-size="30" fill="#514B43">پروژه / نسخهٔ بازبینی</text>
<text id="heading" x="1800" y="280" font-size="64" fill="#191918">تصمیم و گام بعدی</text>
<path d="M120 328H1800 M120 544H1800 M120 760H1800 M120 940H1800 M1340 354V914" fill="none" stroke="#91877A" stroke-width="2"/>
<g fill="#514B43" font-size="30">
<text x="1800" y="418">۱ / تصمیم</text><text x="1800" y="634">۲ / شواهد</text><text x="1800" y="850">۳ / اقدام بعدی</text>
</g>
<g fill="#191918" font-size="42">
<text id="decision" x="1280" y="416">تصمیم را در یک جمله بیان کنید.</text>
<text id="evidence" x="1280" y="632">دلیل یا محدودیت مستند را بنویسید.</text>
<text id="action" x="1280" y="848">اقدام بعدی را مشخص کنید.</text>
</g>
<g fill="#514B43" font-size="28">
<text id="decision-status" x="1280" y="474">وضعیت: در انتظار بازبینی</text>
<text id="evidence-source" x="1280" y="690">منبع: شواهد واقعی را وارد کنید.</text>
<text id="action-owner" x="1280" y="906">مسئول و موعد: در انتظار تأیید</text>
<text x="1800" y="1002">فایل قابل‌ویرایش</text><text x="120" y="1002" text-anchor="end">بازبینی — تأیید نهایی نشده</text>
</g></g></svg>
