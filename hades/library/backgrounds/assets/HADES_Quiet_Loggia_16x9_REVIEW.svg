<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" role="img" aria-labelledby="t d"><title id="t">HADES Quiet Loggia · Dark architectural background · REVIEW</title><desc id="d">An original still architectural scene: limestone columns cast controlled shadow onto charcoal, with an extremely limited vermilion inlay. No logo, no readable type, no repeatable pattern. Neutral colors are proposals.</desc>
