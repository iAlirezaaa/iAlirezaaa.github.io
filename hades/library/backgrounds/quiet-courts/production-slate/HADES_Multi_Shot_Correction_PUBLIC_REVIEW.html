<!doctype html><html lang="en" dir="ltr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; connect-src 'none'; base-uri 'none'; form-action 'none'"><title>HADES / Multi-shot corrections / REVIEW</title><style>
*{box-sizing:border-box}body{margin:0;background:#161615;color:#E8DCC9;font:15px/1.65 Tahoma,Arial,sans-serif}main{max-width:1120px;margin:auto;padding:clamp(12px,3vw,36px)}header{border-block-end:2px solid #EF4B32;padding-block:12px;margin-bottom:24px}header small{display:block;text-align:center;letter-spacing:2px}h1{font-size:clamp(22px,4vw,32px);font-weight:400;margin:16px 0 4px}p{margin:4px 0 16px;color:#D0C3B0}button,input,textarea,select{font:inherit;color:inherit;background:#242321;border:1px solid #93897a;border-radius:0;min-height:44px;max-width:100%}button{padding:6px 14px;cursor:pointer}button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:2px solid #EF4B32;outline-offset:3px}button.primary{background:#EF4B32;color:#111111;border-color:#EF4B32}input,textarea,select{width:100%;padding:7px 9px}textarea{resize:vertical;min-height:76px}label{display:block;min-width:0}label span{display:block;font-size:13px;color:#D0C3B0}.tools{display:flex;flex-wrap:wrap;gap:8px;margin-block:16px}.meta{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr));gap:12px}.item{border-block-start:1px solid #93897a;padding-block:14px;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;align-items:start}.item .note{grid-column:span 2}.item .remove{justify-self:start}.printval{display:none}footer{border-block-start:1px solid #93897a;padding-top:12px;font-size:12px;color:#D0C3B0} @media(max-width:620px){.item{grid-template-columns:repeat(2,minmax(0,1fr))}.item .note{grid-column:1/-1}} @media print{@page{size:A4;margin:12mm}body{background:white;color:#222;font-size:11pt}main{max-width:none;padding:0}header{margin-bottom:12px}h1{font-size:20pt}p,label span,footer{color:#333}.tools,.remove,input,textarea,select{display:none!important}.printval{display:block;white-space:pre-wrap;overflow-wrap:anywhere;color:#111;border-bottom:1px solid #bbb;min-height:20px}.item{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));break-inside:avoid;gap:8px}.item .note{grid-column:span 2}label span{font-size:9pt}header small{font-size:9pt}}
</style></head><body><main><header><small>HADES / PUBLIC REVIEW</small><h1 data-t="title">Multi-shot correction sheet</h1><p data-t="intro">Local working form. No upload or storage. Download CSV before leaving.</p></header><div class="meta" id="meta"></div><div class="tools"><button id="lang" type="button">فارسی</button><button id="add" class="primary" type="button" data-t="add">Add shot</button><button id="csv" type="button" data-t="csv">Download CSV</button><button id="print" type="button" data-t="print">Print / PDF</button></div><p id="count" role="status"></p><section id="rows"></section><footer data-t="foot">REVIEW — only #EF4B32 is approved. Neutral colors and type are proposed. No logo included.</footer></main><script>
const D={en:{title:'Multi-shot correction sheet',intro:'Local working form. No upload or storage. Download CSV before leaving.',add:'Add shot',csv:'Download CSV',print:'Print / PDF',foot:'REVIEW — only #EF4B32 is approved. Neutral colors and type are proposed. No logo included.',project:'Project',batch:'Batch / date',shot:'Shot ID',version:'Target version',owner:'Assignee / department',priority:'Priority',status:'Status',note:'Correction / acceptance criteria',remove:'Remove shot',normal:'Normal',high:'High',urgent:'Urgent',open:'Open',doing:'In progress',done:'Accepted',count:'Shots',confirm:'Remove this shot and its notes?'},fa:{title:'برگهٔ اصلاحات گروهی شات‌ها',intro:'فرم محلی؛ بدون بارگذاری یا ذخیرهٔ خودکار. پیش از خروج CSV بگیرید.',add:'افزودن شات',csv:'دریافت CSV',print:'چاپ / PDF',foot:'REVIEW — فقط ‎#EF4B32‎ تأیید شده است. رنگ‌های خنثی و تایپ پیشنهادی‌اند. بدون لوگو.',project:'پروژه',batch:'دسته / تاریخ',shot:'شمارهٔ شات',version:'نسخهٔ هدف',owner:'مسئول / بخش',priority:'اولویت',status:'وضعیت',note:'اصلاحات / معیار پذیرش',remove:'حذف شات',normal:'عادی',high:'بالا',urgent:'فوری',open:'باز',doing:'در حال انجام',done:'پذیرفته‌شده',count:'تعداد شات‌ها',confirm:'این شات و یادداشت‌هایش حذف شوند؟'}};
let lang=new URLSearchParams(location.search).get('lang')==='fa'?'fa':'en';const $=id=>document.getElementById(id),keys=['shot','version','owner','priority','status','note'];const options={priority:['normal','high','urgent'],status:['open','doing','done']};function field(key){const l=document.createElement('label');l.className=key==='note'?'note':'';const s=document.createElement('span');s.dataset.t=key;l.append(s);const i=document.createElement(options[key]?'select':key==='note'?'textarea':'input');i.dataset.key=key;i.dir='auto';if(options[key])for(const v of options[key]){const o=new Option(v,v);o.dataset.t=v;i.add(o)}else{i.maxLength=key==='note'?1200:120;i.autocomplete='off'}const p=document.createElement('div');p.className='printval';p.dir='auto';l.append(i,p);return l}function translate(){document.documentElement.lang=lang;document.documentElement.dir=lang==='fa'?'rtl':'ltr';document.querySelectorAll('[data-t]').forEach(e=>e.textContent=D[lang][e.dataset.t]);$('lang').textContent=lang==='fa'?'English':'فارسی';$('count').textContent=D[lang].count+': '+$('rows').children.length}function add(){if($('rows').children.length>=100)return;const a=document.createElement('article');a.className='item';keys.forEach(k=>a.append(field(k)));const b=document.createElement('button');b.type='button';b.className='remove';b.dataset.t='remove';b.onclick=()=>{if(confirm(D[lang].confirm)){a.remove();translate();$('add').focus()}};a.append(b);$('rows').append(a);translate();return a}function val(root,k){return root.querySelector('[data-key="'+k+'"]').value}function cell(v){v=String(v);if(/^[\s\uFEFF]*[=+@-]/.test(v)||/^[\t\r\n]/.test(v))v="'"+v;return '"'+v.replaceAll('"','""')+'"'}function exportCSV(){const rows=[['project','batch',...keys],...Array.from($('rows').children,a=>[val($('meta'),'project'),val($('meta'),'batch'),...keys.map(k=>val(a,k))])];const blob=new Blob(['\uFEFF'+rows.map(r=>r.map(cell).join(',')).join('\r\n')],{type:'text/csv;charset=utf-8'});const u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download='HADES_shot_corrections_REVIEW.csv';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}function syncPrint(){document.querySelectorAll('label').forEach(l=>{const i=l.querySelector('[data-key]');l.querySelector('.printval').textContent=i.tagName==='SELECT'?i.selectedOptions[0].textContent:i.value||'—'})}['project','batch'].forEach(k=>$('meta').append(field(k)));add();add();$('lang').onclick=()=>{lang=lang==='fa'?'en':'fa';translate()};$('add').onclick=()=>{const a=add();if(a)a.querySelector('input').focus()};$('csv').onclick=exportCSV;$('print').onclick=()=>{syncPrint();window.print()};window.addEventListener('beforeprint',syncPrint);translate();
</script></body></html>
