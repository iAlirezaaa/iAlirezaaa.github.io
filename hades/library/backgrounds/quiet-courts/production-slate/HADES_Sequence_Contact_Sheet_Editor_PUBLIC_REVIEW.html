*{box-sizing:border-box}body{margin:0;background:#252321;color:#f4f0e8;font:16px/1.5 Arial,Tahoma,sans-serif}main{max-width:1120px;margin:auto;padding:24px}header{text-align:center;font-size:14px;letter-spacing:.12em;margin-bottom:24px}h1{font-size:24px;font-weight:400;margin:0}p{margin:8px 0}button,input,textarea{font:inherit}button{background:#f4f0e8;color:#252321;border:1px solid #777;padding:8px 14px;cursor:pointer}button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid #ef4b32;outline-offset:2px}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}.sheet{background:#f4f0e8;color:#252321;padding:20px;border-top:3px solid #ef4b32}.heading{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;align-items:baseline}.status{font-size:12px;letter-spacing:.04em}.meta,.frames{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.meta{margin:12px 0}.frame{min-width:0}.slot{aspect-ratio:16/9;background:#e5dfd4;border:1px solid #9b9387;display:grid;place-items:center;overflow:hidden;color:#514b43}.slot img{width:100%;height:100%;object-fit:contain;min-height:0}.slot img[hidden]{display:none}.slot span{font-size:14px}.controls{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:6px 0}.controls input{max-width:100%;min-width:0;width:230px;font-size:13px}.controls button{font-size:13px;padding:4px 8px}.error{font-size:13px;color:#76251c}.field{display:block;font-size:13px}.field input,.field textarea{display:block;width:100%;min-width:0;background:#fff;color:#252321;border:1px solid #857d72;padding:5px 7px}.field textarea{resize:vertical;min-height:48px}.printvalue{display:none;white-space:pre-wrap;overflow-wrap:anywhere}.note{font-size:14px;color:#e5dfd4}.frame .field{margin-top:5px}@media(max-width:660px){main{padding:12px}.sheet{padding:12px}.meta,.frames{grid-template-columns:1fr}.heading{display:block}h1{font-size:21px}}@page{size:A4 landscape;margin:9mm}@media print{body{background:white;color:#25 <script>
let fa=new URLSearchParams(location.search).get('lang')==='fa';const t=(en,f)=>fa?f:en;const el=(tag,cls)=>{const x=document.createElement(tag);if(cls)x.className=cls;return x};function bilingual(x,en,f){x.dataset.en=en;x.dataset.fa=f;x.textContent=t(en,f);return x}function field(parent,en,f,value,max,multi=false){const label=el('label','field'),name=bilingual(el('span'),en,f),input=el(multi?'textarea':'input'),out=el('span','printvalue');input.maxLength=max;input.value=value;input.dir='auto';out.dir='auto';out.textContent=value||'—';input.addEventListener('input',()=>out.textContent=input.value||'—');label.append(name,input,out);parent.append(label)}
field(document.getElementById('meta'),'Project / sequence','پروژه / سکانس','SEQ 010',48);field(document.getElementById('meta'),'Revision','نسخه','v001',24);
for(let i=1;i<=4;i++){const card=el('article','frame'),slot=el('div','slot'),placeholder=bilingual(el('span'),'Frame '+i,'فریم '+i),img=el('img'),controls=el('div','controls'),pick=el('input'),clear=bilingual(el('button'),'Remove image','حذف تصویر'),err=el('p','error');img.hidden=true;img.alt='';pick.type='file';pick.accept='image/png,image/jpeg,image/webp';pick.setAttribute('aria-label','Frame '+i+' image');pick.dataset.file=String(i);clear.type='button';err.setAttribute('role','status');let url='',generation=0;function reset(keep=false){generation++;if(url)URL.revokeObjectURL(url);url='';img.removeAttribute('src');img.hidden=true;placeholder.hidden=false;if(!keep)pick.value='';err.textContent=''}clear.onclick=()=>reset();pick.onchange=()=>{const file=pick.files[0];if(!file)return;reset(true);const current=generation;if(!['image/png','image/jpeg','image/webp'].includes(file.type)||file.size>12*1024*1024){err.textContent=t('Unsupported image or file too large.','فرمت نامعتبر یا حجم بیش از حد مجاز.');return}const candidate=URL.createObjectURL(file),probe=new Image();probe.onload=()=>{if(current!==generation){URL.revokeObjectURL(candidate);return}url=candidate;img.src=url;img.hidden=false;placeholder.hidden=true};probe.onerror=()=>{URL.revokeObjectURL(candidate);if(current===generation)err.textContent=t('Image could not be decoded.','تصویر قابل خواندن نیست.')};probe.src=candidate};slot.append(placeholder,img);controls.append(pick,clear);card.append(slot,controls,err);field(card,'Shot / frame','شات / فریم','SH 0'+i+'0 / F 0001',32);field(card,'Continuity note','یادداشت راکورد','',80,true);document.getElementById('frames').append(card)}
function language(){document.documentElement.lang=fa?'fa':'en';document.documentElement.dir=fa?'rtl':'ltr';document.querySelectorAll('[data-en]').forEach(x=>x.textContent=fa?x.dataset.fa:x.dataset.en);document.querySelectorAll('[data-file]').forEach(x=>x.setAttribute('aria-label',t('Frame '+x.dataset.file+' image','تصویر فریم '+x.dataset.file)));document.getElementById('language').textContent=fa?'English':'فارسی'}document.getElementById('language').onclick=()=>{fa=!fa;language()};document.getElementById('print').onclick=()=>window.print();language();
