<main><header><small>HADES / PUBLIC REVIEW · NOT FINAL</small><h1 data-en="Composite desk" data-fa="میز کامپوزیت">Composite desk</h1><button id="lang">فارسی / EN</button> · <a id="guide" href="../social-ratios/" data-en="Download transition sequences" data-fa="دانلود توالی ترنزیشن‌ها">Download transition sequences</a></header>
<p data-en="Extract a 30-frame PNG pack, select its frames and optionally two stills. All media stays on your device. Native 24 fps; cut between frames 14 and 15. This is a still-plate compositor, not an NLE." data-fa="بستهٔ ۳۰ فریمی PNG را استخراج و فریم‌ها را انتخاب کنید. دو تصویر ثابت نیز می‌توانید وارد کنید. رسانه‌ها روی دستگاه شما می‌مانند. نرخ ۲۴ فریم؛ برش بین فریم ۱۴ و ۱۵. این ابزار کامپوزیت تصاویر ثابت است، نه نرم‌افزار تدوین."></p>

<script>const $=id=>document.getElementById(id),c=$('canvas'),ctx=c.getContext('2d');let fa=location.pathname.includes('/fa/'),files=[],plates={a:null,b:null},rev=0,load=0,busy=false;const msg=(en,f)=>$('status').textContent=fa?f:en;function lang(){document.documentElement.lang=fa?'fa':'en';document.documentElement.dir=fa?'rtl':'ltr';document.querySelectorAll('[data-en]').forEach(e=>e.textContent=e.dataset[fa?'fa':'en']);$('guide').href=fa?'/hades/fa/library/backgrounds/quiet-courts/transitions/social-ratios/':'/hades/library/backgrounds/quiet-courts/transitions/social-ratios/'}$('lang').onclick=()=>{fa=!fa;lang()};lang();function cover(img){let s=Math.max(c.width/img.width,c.height/img.height);ctx.drawImage(img,(c.width-img.width*s)/2,(c.height-img.height*s)/2,img.width*s,img.height*s)}async function draw(){let v=++rev,i=+$('frame').value,k=i<15?'a':'b',f=files[i];$('png').disabled=true;$('pos').textContent=i+' / 29 · '+(i/24).toFixed(3)+' s';let im=f?await createImageBitmap(f):null;if(v!==rev){im?.close();return}ctx.fillStyle=$(k==='a'?'ca':'cb').value;ctx.fillRect(0,0,c.width,c.height);if(plates[k])cover(plates[k]);if(im){ctx.drawImage(im,0,0);im.close()}$('png').disabled=!f||busy}function fail(){msg('Invalid input or image.','ورودی یا تصویر نامعتبر است.')}async function inspect(f,w,h,i){let im=await createImageBitmap(f);try{if(w&&(im.width!==w||im.height!==h))throw Error('size');if([0,14,15,29].includes(i)){let t=document.createElement('canvas');t.width=im.width;t.height=im.height;let x=t.getContext('2d',{willReadFrequently:true});x.drawImage(im,0,0);let d=x.getImageData(0,0,t.width,t.height).data,expected=i===0||i===29?0:255;for(let j=3;j<d.length;j+=4)if(d[j]!==expected)throw Error('alpha endpoint')}return [im.width,im.height]}finally{im.close()}}$('seq').onchange=async()=>{let token=++load;busy=true;files=[];msg('Validating…','در حال بررسی…');draw();let fs=[...$('seq').files].sort((a,b)=>a.name.localeCompare(b.name));try{if(fs.length!==30||fs.some((f,i)=>!['frame_','HADES_Threshold_','HADES_Lintel_','HADES_Aperture_'].some(prefix=>f.name===prefix+String(i).padStart(4,'0')+'.png'))||new Set(fs.map(f=>f.name.slice(0,-8))).size!==1)throw Error('names');let [w,h]=await inspect(fs[0],0,0,0);if(![[1920,1080],[1080,1920],[1080,1080]].some(([x,y])=>x===w&&y===h))throw Error('ratio');for(let i=1;i<30;i++)await inspect(fs[i],w,h,i);if(token!==load)return;files=fs;c.width=w;c.height=h;busy=false;msg('30 frames validated · '+w+' × '+h,'۳۰ فریم معتبر · '+w+' × '+h);await draw()}catch(e){if(token!==load)return;busy=false;files=[];fail();draw()}};for(let k of ['a','b'])$(k).onchange=async()=>{try{let f=$(k).files[0],im=f?await createImageBitmap(f):null;plates[k]?.close();plates[k]=im;draw()}catch(e){fail()}};for(let k of ['frame','ca','cb'])$(k).oninput=draw;$('cut').onclick=()=>{$('frame').value=14;draw()};function download(blob,name){let u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}$('png').onclick=()=>{let n=$('frame').value;c.toBlob(b=>{if(b)download(b,'HADES_composite_'+String(n).padStart(4,'0')+'_REVIEW.png')},'image/png')};$('save').onclick=()=>download(new Blob([JSON.stringify({schema:1,status:'REVIEW',fps:24,cut:[14,15],frame:+$('frame').value,colors:[$('ca').value,$('cb').value],dimensions:[c.width,c.height],media:{a:$('a').files[0]?.name||null,b:$('b').files[0]?.name||null,sequence:files.map(f=>f.name)}},null,2)],{type:'application/json'}),'HADES_composite_project_REVIEW.json');$('restore').onchange=async()=>{try{let p=JSON.parse(await $('restore').files[0].text());if(p.schema!==1||p.fps!==24||JSON.stringify(p.cut)!=='[14,15]'||!Number.isInteger(p.frame)||p.frame<0||p.frame>29||!Array.isArray(p.colors)||p.colors.length!==2||!p.colors.every(x=>/^#[0-9a-f]{6}$/i.test(x)))throw Error('schema');$('frame').value=p.frame;$('ca').value=p.colors[0];$('cb').value=p.colors[1];msg('Settings restored. Reselect the corresponding media.','تنظیمات بازیابی شد. رسانه‌های متناظر را دوباره انتخاب کنید.');draw()}catch(e){fail()}};/* HADES batch export / PUBLIC REVIEW. ZIP STORE, local media only. */
const batch=document.createElement('button'),mode=document.createElement('select'),progress=document.createElement('output'),verify=document.createElement('input'),wrap=document.createElement('label');
batch.id='batch';batch.dataset.en='Export 30-frame ZIP';batch.dataset.fa='خروجی ZIP سی فریم';batch.disabled=true;
mode.id='batchMode';mode.setAttribute('aria-label','Export mode / نوع خروجی');for(const [v,en,f] of [['composite','Composite (opaque)','کامپوزیت (مات)'],['alpha','Transition only (straight alpha)','فقط ترنزیشن (آلفای مستقیم)']]){let o=new Option(en,v);o.dataset.en=en;o.dataset.fa=f;mode.add(o)}
progress.id='batchProgress';progress.setAttribute('role','status');progress.setAttribute('aria-live','polite');verify.type='file';verify.accept='.json,application/json';verify.id='relink';let caption=document.createElement('span');caption.dataset.en='Verify relink against exported project JSON';caption.dataset.fa='تطبیق رسانه‌ها با JSON پروژهٔ خروجی';wrap.append(caption,verify);$('png').after(mode,batch,progress,wrap);lang();
const say=(en,f)=>progress.textContent=fa?f:en;
const crcTable=Uint32Array.from({length:256},(_,i)=>{for(let j=0;j<8;j++)i=(i>>>1)^((i&1)?0xedb88320:0);return i>>>0});
function crc32(a){let n=0xffffffff;for(const b of a)n=(n>>>8)^crcTable[(n^b)&255];return (n^0xffffffff)>>>0}
function zipStore(entries){const enc=new TextEncoder(),parts=[],central=[];let offset=0,size=0;for(const [name,data] of entries){const n=enc.encode(name),crc=crc32(data),h=new Uint8Array(30+n.length),d=new DataView(h.buffer);d.setUint32(0,0x04034b50,true);d.setUint16(4,20,true);d.setUint16(6,0x800,true);d.setUint16(12,0x21,true);d.setUint32(14,crc,true);d.setUint32(18,data.length,true);d.setUint32(22,data.length,true);d.setUint16(26,n.length,true);h.set(n,30);const q=new Uint8Array(46+n.length),v=new DataView(q.buffer);v.setUint32(0,0x02014b50,true);v.setUint16(4,20,true);v.setUint16(6,20,true);v.setUint16(8,0x800,true);v.setUint16(14,0x21,true);v.setUint32(16,crc,true);v.setUint32(20,data.length,true);v.setUint32(24,data.length,true);v.setUint16(28,n.length,true);v.setUint32(42,offset,true);q.set(n,46);parts.push(h,data);central.push(q);offset+=h.length+data.length;size+=q.length}const end=new Uint8Array(22),e=new DataView(end.buffer);e.setUint32(0,0x06054b50,true);e.setUint16(8,entries.length,true);e.setUint16(10,entries.length,true);e.setUint32(12,size,true);e.setUint32(16,offset,true);return new Blob([...parts,...central,end],{type:'application/zip'})}
const K=Uint32Array.from([0x428a2f98,0x71374491,0xb5c0fbcf,0xe9b5dba5,0x3956c25b,0x59f111f1,0x923f82a4,0xab1c5ed5,0xd807aa98,0x12835b01,0x243185be,0x550c7dc3,0x72be5d74,0x80deb1fe,0x9bdc06a7,0xc19bf174,0xe49b69c1,0xefbe4786,0x0fc19dc6,0x240ca1cc,0x2de92c6f,0x4a7484aa,0x5cb0a9dc,0x76f988da,0x983e5152,0xa831c66d,0xb00327c8,0xbf597fc7,0xc6e00bf3,0xd5a79147,0x06ca6351,0x14292967,0x27b70a85,0x2e1b2138,0x4d2c6dfc,0x53380d13,0x650a7354,0x766a0abb,0x81c2c92e,0x92722c85,0xa2bfe8a1,0xa81a664b,0xc24b8b70,0xc76c51a3,0xd192e819,0xd6990624,0xf40e3585,0x106aa070,0x19a4c116,0x1e376c08,0x2748774c,0x34b0bcb5,0x391c0cb3,0x4ed8aa4a,0x5b9cca4f,0x682e6ff3,0x748f82ee,0x78a5636f,0x84c87814,0x8cc70208,0x90befffa,0xa4506ceb,0xbef9a3f7,0xc67178f2]);
function localSHA(input){let a=new Uint8Array(input),n=Math.ceil((a.length+9)/64)*64,p=new Uint8Array(n);p.set(a);p[a.length]=128;let d=new DataView(p.buffer);d.setUint32(n-8,Math.floor(a.length/536870912));d.setUint32(n-4,a.length*8);let h=Uint32Array.from([0x6a09e667,0xbb67ae85,0x3c6ef372,0xa54ff53a,0x510e527f,0x9b05688c,0x1f83d9ab,0x5be0cd19]),w=new Uint32Array(64),r=(x,k)=>(x>>>k)|(x<<(32-k));for(let i=0;i<n;i+=64){for(let j=0;j<16;j++)w[j]=d.getUint32(i+j*4);for(let j=16;j<64;j++){let x=w[j-15],y=w[j-2];w[j]=w[j-16]+(r(x,7)^r(x,18)^(x>>>3))+w[j-7]+(r(y,17)^r(y,19)^(y>>>10))}let [A,B,C,D,E,F,G,H]=h;for(let j=0;j<64;j++){let t1=(H+(r(E,6)^r(E,11)^r(E,25))+((E&F)^(~E&G))+K[j]+w[j])>>>0,t2=((r(A,2)^r(A,13)^r(A,22))+((A&B)^(A&C)^(B&C)))>>>0;H=G;G=F;F=E;E=(D+t1)>>>0;D=C;C=B;B=A;A=(t1+t2)>>>0}for(let j=0;j<8;j++)h[j]+=[A,B,C,D,E,F,G,H][j]}return Array.from(h,x=>x.toString(16).padStart(8,'0')).join('')}
const digest=async a=>globalThis.crypto?.subtle?Array.from(new Uint8Array(await crypto.subtle.digest('SHA-256',a)),x=>x.toString(16).padStart(2,'0')).join(''):localSHA(a);
const record=async f=>f?{name:f.name,sha256:await digest(await f.arrayBuffer())}:null;
const mediaRecord=async (fs,a,b)=>({sequence:await Promise.all(fs.map(record)),a:await record(a),b:await record(b)});
const snapshot=()=>({fs:[...files],a:$('a').files[0]||null,b:$('b').files[0]||null,w:c.width,h:c.height,colors:[$('ca').value,$('cb').value],mode:mode.value});
let exporting=false;function ready(){batch.disabled=exporting||busy||files.length!==30;verify.disabled=exporting||busy||files.length!==30}new MutationObserver(ready).observe($('png'),{attributes:true,attributeFilter:['disabled']});ready();
function fit(x,img,w,h){let s=Math.max(w/img.width,h/img.height);x.drawImage(img,(w-img.width*s)/2,(h-img.height*s)/2,img.width*s,img.height*s)}
batch.onclick=async()=>{if(exporting||busy||files.length!==30)return;exporting=true;ready();let s=snapshot(),a=null,b=null;try{let source=await mediaRecord(s.fs,s.a,s.b);if(s.mode==='composite'){a=s.a?await createImageBitmap(s.a):null;b=s.b?await createImageBitmap(s.b):null}const t=document.createElement('canvas');t.width=s.w;t.height=s.h;const x=t.getContext('2d'),entries=[],outputs=[];for(let i=0;i<30;i++){say('Exporting '+(i+1)+'/30','خروجی '+(i+1)+'/۳۰');let bytes;if(s.mode==='alpha'){bytes=new Uint8Array(await s.fs[i].arrayBuffer())}else{x.fillStyle=s.colors[i<15?0:1];x.fillRect(0,0,s.w,s.h);let plate=i<15?a:b;if(plate)fit(x,plate,s.w,s.h);let im=await createImageBitmap(s.fs[i]);try{x.drawImage(im,0,0)}finally{im.close()}let blob=await new Promise(resolve=>t.toBlob(resolve,'image/png'));if(!blob)throw Error('PNG');bytes=new Uint8Array(await blob.arrayBuffer())}const name='frame_'+String(i).padStart(4,'0')+'.png';entries.push([name,bytes]);outputs.push({name,sha256:await digest(bytes)})}let project={schema:'hades-batch-1',status:'PUBLIC REVIEW',fps:24,cut:[14,15],dimensions:[s.w,s.h],mode:s.mode,colors:s.colors,source,outputs};entries.push(['project.json',new TextEncoder().encode(JSON.stringify(project,null,2))]);download(zipStore(entries),'HADES_'+s.mode+'_30frames_REVIEW.zip');say('30 frames + project JSON exported.','۳۰ فریم و JSON پروژه آماده شد.')}catch(e){say('Export failed; check available memory and media.','خروجی ناموفق؛ حافظه و رسانه‌ها را بررسی کنید.')}finally{a?.close();b?.close();exporting=false;ready()}};
verify.onchange=async()=>{try{let p=JSON.parse(await verify.files[0].text()),s=snapshot();if(p.schema!=='hades-batch-1'||p.fps!==24||JSON.stringify(p.cut)!=='[14,15]'||JSON.stringify(p.dimensions)!==JSON.stringify([s.w,s.h])||!['alpha','composite'].includes(p.mode)||!Array.isArray(p.colors)||p.colors.length!==2||!p.colors.every(v=>/^#[0-9a-f]{6}$/i.test(v))||JSON.stringify(p.source)!==JSON.stringify(await mediaRecord(s.fs,s.a,s.b)))throw Error('mismatch');$('ca').value=p.colors[0];$('cb').value=p.colors[1];mode.value=p.mode;draw();say('Media SHA-256 matched; settings restored.','هش رسانه‌ها مطابق است؛ تنظیمات بازیابی شد.')}catch(e){say('Relink mismatch or invalid project.','رسانه‌ها مطابق نیستند یا پروژه نامعتبر است.')}finally{verify.value=''}};
