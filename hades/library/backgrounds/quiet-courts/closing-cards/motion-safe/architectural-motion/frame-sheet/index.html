<!doctype html>
<html lang="en" dir="ltr"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HADES · Frame Sheet · PUBLIC REVIEW</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#161615;color:#E8DCC9;font:400 16px/1.65 Tahoma,Arial,sans-serif}main{max-width:820px;margin:auto;padding:16px}a{color:inherit}nav,.actions{display:flex;flex-wrap:wrap;gap:12px}h1{font-size:26px;font-weight:400;margin:12px 0}.tag{border-inline-start:3px solid #EF4B32;padding-inline-start:10px;color:#C1B6A4}.controls{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,140px),1fr));gap:12px}label{display:grid;gap:4px}button,select,input{font:inherit;color:inherit;background:#292825;border:1px solid #82776a;border-radius:3px;padding:7px;min-width:0}button{cursor:pointer}button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid #EF4B32;outline-offset:2px}.stage{margin:16px auto;background:#E8DCC9;width:100%;max-width:640px;aspect-ratio:16/9;border:1px solid #82776a;position:relative}.stage img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}input[type=range]{width:100%;accent-color:#EF4B32}output{font-variant-numeric:tabular-nums}table{width:100%;border-collapse:collapse;font-size:14px}th,td{padding:6px;border-bottom:1px solid #625B51;text-align:start;font-weight:400}small{display:block;color:#C1B6A4;margin-top:12px}@media print{body{background:white;color:black}nav,.controls,.actions,input{display:none}small,.tag{color:#333}.stage{break-inside:avoid}}
</style><main><nav><a id="back"></a><a id="lib"></a><a id="usage"></a><a id="other"></a></nav><p class="tag">PUBLIC REVIEW · NOT FINAL</p><h1 id="heading"></h1><p id="intro"></p><div class="controls"><label><span id="rateLabel"></span><select id="rate"><option>24</option><option>25</option><option>30</option></select></label><label><span id="durationLabel"></span><select id="duration"><option>3</option><option selected>5</option><option>8</option></select></label><label><span id="ratioLabel"></span><select id="ratio"><option>16x9</option><option>9x16</option><option>1x1</option></select></label></div><div class="stage" id="stage"><img id="art" alt=""></div><label><span id="frameLabel"></span><input type="range" id="frame" min="0" step="1" value="0"></label><p dir="ltr"><output id="counter"></output> · <output id="alpha"></output></p><table><thead><tr><th id="phaseLabel"></th><th id="indexLabel"></th><th id="opacityLabel"></th></tr></thead><tbody id="keys"></tbody></table><p id="rule"></p><div class="actions"><button id="json"></button><button id="csv"></button></div><small id="notes"></small></main>
<script>
'use strict';const $=id=>document.getElementById(id),fa=location.pathname.includes('/fa/')||new URLSearchParams(location.search).get('lang')==='fa',lang=fa?'FA':'EN',root='/hades/library/backgrounds/quiet-courts/closing-cards/motion-safe/',local='/hades/'+(fa?'fa/':'');document.documentElement.lang=fa?'fa':'en';document.documentElement.dir=fa?'rtl':'ltr';const words={back:['Motion editor','ویرایشگر حرکت'],lib:['Library','کتابخانه'],usage:['Logo usage','راهنمای لوگو'],other:['فارسی','English'],heading:['Architectural Motion / Frame sheet','حرکت معماری / برگهٔ فریم'],intro:['A frame-accurate timing recipe for the unchanged closing overlay. Preview the whole layer’s opacity; no independent logo animation.','دستور زمان‌بندی فریم‌محور برای لایهٔ پایان دست‌نخورده. شفافیت کل لایه تغییر می‌کند؛ نشان اصلی حرکت مستقل ندارد.'],rateLabel:['Frames per second','فریم بر ثانیه'],durationLabel:['Duration (seconds)','مدت (ثانیه)'],ratioLabel:['Frame ratio','نسبت قاب'],frameLabel:['Visible frame (zero-based)','فریم قابل‌نمایش (از صفر)'],phaseLabel:['Phase','مرحله'],indexLabel:['Frame','فریم'],opacityLabel:['Opacity','شفافیت'],rule:['Visible frames are 0…N−1; N is the exclusive end boundary. Fade keys are rounded from 20% and 80% of N; the last visible frame is fully transparent. Linear interpolation between keys.','فریم‌های قابل‌نمایش از صفر تا N−1 هستند؛ N مرز پایان و خارج از بازه است. کلیدهای ورود و خروج از ۲۰٪ و ۸۰٪ تعداد فریم گرد می‌شوند و فریم آخر کاملاً شفاف است. بین کلیدها از درون‌یابی خطی استفاده می‌شود.'],json:['Download JSON keys','دریافت کلیدهای JSON'],csv:['Download every frame CSV','دریافت CSV همهٔ فریم‌ها'],notes:['PUBLIC REVIEW: neutral colors and type proposed; only #EF4B32 approved. Independent product credit requires permission. Editor import, physical phone, print, micro-recognition and real Mikhak OPEN. This is a timing recipe, not a video.','بازبینی عمومی: رنگ‌های خنثی و فونت پیشنهادی‌اند؛ فقط #EF4B32 تأیید شده است. اعتبار محصولات مستقل به مجوز نیاز دارد. ورود به تدوین، گوشی واقعی، چاپ، خوانایی میکرو و میخک واقعی باز هستند. این فایل دستور زمان‌بندی است، نه ویدئو.']};for(const [k,v] of Object.entries(words))$(k).textContent=v[+fa];$('back').href=local+'library/backgrounds/quiet-courts/closing-cards/motion-safe/architectural-motion/';$('lib').href=local+'library/';$('usage').href=local+'brand-kit/logo-usage/';$('other').href=(fa?root:root.replace('/hades/','/hades/fa/'))+'architectural-motion/frame-sheet/';$('art').alt=fa?'لایهٔ پایان اصلی':'Original closing overlay';
function recipe(){const fps=+$('rate').value,seconds=+$('duration').value,n=fps*seconds,ratio=$('ratio').value;return {status:'PUBLIC REVIEW / NOT FINAL',locale:lang,source:root+'HADES_Motion_Safe_Closing_'+lang+'_'+ratio+'_PUBLIC_REVIEW.svg',ratio,fps,duration_seconds:seconds,frame_count:n,first_frame:0,last_visible_frame:n-1,end_exclusive:n,interpolation:'linear',keys:[{frame:0,opacity:0},{frame:Math.round(n*.2),opacity:1},{frame:Math.round(n*.8),opacity:1},{frame:n-1,opacity:0}]}}
function opacity(f,r){const k=r.keys;if(f<=k[0].frame||f>=k[3].frame)return 0;if(f<=k[1].frame)return f/k[1].frame;if(f<=k[2].frame)return 1;return (k[3].frame-f)/(k[3].frame-k[2].frame)}
function draw(){const r=recipe(),f=+$('frame').value,a=opacity(f,r);$('art').style.opacity=a;$('counter').value=f+' / '+(r.frame_count-1)+' · '+r.fps+' fps';$('alpha').value=(a*100).toFixed(1)+'%'}
function refresh(){const r=recipe();$('frame').max=r.last_visible_frame;$('frame').value=r.keys[1].frame;$('art').src=r.source;$('stage').style.aspectRatio=r.ratio.replace('x',' / ');$('stage').style.maxWidth=r.ratio==='9x16'?'280px':'640px';$('keys').replaceChildren();const labels=fa?['آغاز','پایان ورود','آغاز خروج','آخرین فریم']:['Start','Fade in ends','Fade out starts','Last frame'];r.keys.forEach((k,i)=>{const tr=document.createElement('tr');for(const v of [labels[i],k.frame,k.opacity*100+'%']){const td=document.createElement('td');td.textContent=v;tr.append(td)}$('keys').append(tr)});draw()}
function save(data,mime,ext){const r=recipe(),u=URL.createObjectURL(new Blob([data],{type:mime})),a=document.createElement('a');a.href=u;a.download='HADES_Frame_Sheet_'+lang+'_'+r.ratio+'_'+r.fps+'fps_'+r.duration_seconds+'s_REVIEW.'+ext;a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}
$('json').onclick=()=>save(JSON.stringify(recipe(),null,2)+'\n','application/json','json');$('csv').onclick=()=>{const r=recipe(),rows=['frame,seconds,opacity'];for(let f=0;f<r.frame_count;f++)rows.push([f,(f/r.fps).toFixed(9),opacity(f,r).toFixed(9)].join(','));save(rows.join('\n')+'\n','text/csv','csv')};for(const id of ['rate','duration','ratio'])$(id).onchange=refresh;$('frame').oninput=draw;refresh();
</script></html>
