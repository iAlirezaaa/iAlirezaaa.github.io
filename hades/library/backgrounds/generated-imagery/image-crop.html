<!doctype html>
<html lang="en" dir="ltr"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HADES / Image crop · REVIEW</title><style>
[hidden]{display:none!important}*{box-sizing:border-box}body{margin:0;background:#191918;color:#f4f0e8;font:16px/1.65 system-ui,Tahoma,sans-serif}main{max-width:680px;margin:auto;padding:20px 16px 40px}header{text-align:center;font-size:12px;letter-spacing:.14em;padding:12px;border-bottom:1px solid #625b50}h1{font-size:25px;font-weight:450}p{overflow-wrap:anywhere}button,input,select{font:inherit;color:inherit;max-width:100%;min-height:44px}button,select{background:#242321;border:1px solid #93887b;padding:8px 12px;border-radius:4px}button:disabled{opacity:.55}button:not(:disabled){cursor:pointer}label{display:block;margin:12px 0 4px}input[type=range],select{width:100%;accent-color:#EF4B32}a{color:inherit;text-underline-offset:4px}a:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid #EF4B32;outline-offset:3px}canvas{display:block;max-width:100%;max-height:420px;width:auto;height:auto;margin:16px auto;object-fit:contain}output{display:block;overflow-wrap:anywhere}footer{margin-top:24px;border-top:1px solid #625b50;padding-top:12px}small{color:#d2c5b5}@media print{body{background:white;color:black}small{color:#333}button,input,select,label,nav{display:none}canvas{max-height:250px}}
</style><main><header>HADES / PUBLIC REVIEW</header><nav><button id="language" type="button">فارسی</button></nav><h1 data-i="title">Image crop</h1><p data-i="intro"></p><label for="file" data-i="file"></label><input id="file" type="file" accept="image/png,image/jpeg,image/webp"><label for="ratio" data-i="ratio"></label><select id="ratio" dir="ltr"><option>16:9</option><option>9:16</option><option>1:1</option></select><label for="x" data-i="x"></label><input id="x" type="range" min="0" max="100" value="50" dir="ltr"><label for="y" data-i="y"></label><input id="y" type="range" min="0" max="100" value="50" dir="ltr"><canvas id="preview" hidden aria-label="Crop preview"></canvas><output id="status" aria-live="polite"></output><button id="png" disabled data-i="png"></button> <button id="recipe" disabled data-i="recipe"></button><footer><small data-i="note"></small><p><a id="back" href="/hades/library/" data-i="back"></a></p></footer></main><script>
const $=id=>document.getElementById(id),words={en:{title:'Image crop',intro:'Prepare an existing background for three formats. Your file stays local; cropping does not redraw or upscale the artwork.',file:'Choose a background (PNG, JPEG or WebP)',ratio:'Output ratio',x:'Horizontal focal position (left to right)',y:'Vertical focal position (top to bottom)',png:'Download cropped PNG',recipe:'Download crop recipe',note:'REVIEW only. Use background artwork without a baked-in logo; do not crop original marks. Neutral UI colors are proposals. Screen output, not a print proof.',back:'Brand library',empty:'Choose an image to begin.',bad:'Unable to read image or image too small for this ratio.',ready:'Native pixels · no upscaling'},fa:{title:'برش تصویر',intro:'پس‌زمینهٔ موجود را برای سه قالب آماده کنید. فایل روی دستگاه شما می‌ماند؛ تصویر بازطراحی یا بزرگ‌نمایی نمی‌شود.',file:'انتخاب پس‌زمینه (PNG، JPEG یا WebP)',ratio:'نسبت خروجی',x:'موقعیت افقی نقطهٔ تمرکز (چپ به راست)',y:'موقعیت عمودی نقطهٔ تمرکز (بالا به پایین)',png:'دریافت PNG برش‌خورده',recipe:'دریافت دستور برش',note:'فقط REVIEW. از پس‌زمینهٔ بدون لوگوی پخته‌شده استفاده کنید؛ لوگوی اصلی را برش ندهید. رنگ‌های خنثی رابط پیشنهادی‌اند. خروجی نمایشگر است، نه نمونهٔ چاپ.',back:'کتابخانهٔ برند',empty:'برای شروع تصویر انتخاب کنید.',bad:'خواندن تصویر ممکن نیست یا برای این نسبت کوچک است.',ready:'پیکسل اصلی · بدون بزرگ‌نمایی'}};
let img=null,serial=0,record=null,fa=false,error=false;const t=k=>words[fa?'fa':'en'][k];function language(){fa=location.hash==='#fa';document.documentElement.lang=fa?'fa':'en';document.documentElement.dir=fa?'rtl':'ltr';document.querySelectorAll('[data-i]').forEach(e=>e.textContent=t(e.dataset.i));$('language').textContent=fa?'English':'فارسی';$('back').href=fa?'/hades/fa/library/':'/hades/library/';render()}
function render(){record=null;const c=$('preview');c.hidden=true;$('png').disabled=$('recipe').disabled=true;$('status').textContent=t(error?'bad':'empty');if(!img)return;const [a,b]=$('ratio').value.split(':').map(Number),w=img.naturalWidth,h=img.naturalHeight,k=Math.floor(Math.min(w/a,h/b));if(k<1){$('status').textContent=t('bad');return}const cw=a*k,ch=b*k,sx=Math.round((w-cw)*Number($('x').value)/100),sy=Math.round((h-ch)*Number($('y').value)/100);record={status:'REVIEW',source:{width:w,height:h},crop:{x:sx,y:sy,width:cw,height:ch},ratio:$('ratio').value,upscaled:false};const scale=Math.min(1,640/Math.max(cw,ch));c.width=Math.max(1,Math.round(cw*scale));c.height=Math.max(1,Math.round(ch*scale));c.getContext('2d').drawImage(img,sx,sy,cw,ch,0,0,c.width,c.height);c.hidden=false;$('png').disabled=$('recipe').disabled=false;const dims=document.createElement('bdi');dims.textContent=cw+' × '+ch;$('status').replaceChildren(dims,' · '+t('ready'))}
$('file').onchange=()=>{const n=++serial,f=$('file').files[0];img=null;error=false;render();if(!f)return;const u=URL.createObjectURL(f),i=new Image();i.onload=()=>{URL.revokeObjectURL(u);if(n!==serial)return;img=i;render()};i.onerror=()=>{URL.revokeObjectURL(u);if(n!==serial)return;error=true;render()};i.src=u};function save(blob,name){const u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}$('png').onclick=()=>{if(!record)return;const r=record.crop,c=document.createElement('canvas');c.width=r.width;c.height=r.height;c.getContext('2d').drawImage(img,r.x,r.y,r.width,r.height,0,0,r.width,r.height);c.toBlob(b=>{if(b)save(b,'HADES_Background_Crop_REVIEW.png')},'image/png')};$('recipe').onclick=()=>{if(record)save(new Blob([JSON.stringify(record,null,2)+'\n'],{type:'application/json'}),'HADES_Background_Crop_REVIEW.json')};for(const id of ['ratio','x','y'])$(id).addEventListener('input',render);$('language').onclick=()=>location.hash=fa?'en':'fa';addEventListener('hashchange',language);language();
</script></html>
