</style><main><header><small>HADES / PUBLIC REVIEW</small><p><button id="language">فارسی</button></p></header><h1 data-en="Native composite handoff" data-fa="تحویل کامپوزیت موشن"></h1><p data-en="Render the exact recorded title PNG over your own 24 fps footage. No logo redraw, scaling or black plaque. Output is a silent six-second review MP4, not a master." data-fa="PNG ثبت‌شدهٔ عنوان را روی ویدیوی ۲۴ فریم خود قرار دهید؛ بدون بازطراحی، تغییر اندازه یا قاب سیاه. خروجی MP4 شش‌ثانیه‌ای بی‌صدا برای بازبینی است، نه مستر."></p><a class="download" href="hades_composite.py" download data-en="Download Python renderer" data-fa="دریافت رندرر پایتون"></a><section><h2 data-en="01 / Landscape" data-fa="۰۱ / افقی"></h2><p data-en="1280 × 720; proposed 26 px translation left." data-fa="۱۲۸۰ × ۷۲۰؛ جابه‌جایی پیشنهادی ۲۶ پیکسل به چپ."></p><pre>python hades_composite.py landscape footage.mp4 HADES_Landscape_Native_REVIEW.png review.mp4</pre><h2 data-en="02 / Portrait" data-fa="۰۲ / عمودی"></h2><p data-en="720 × 1280; original position." data-fa="۷۲۰ × ۱۲۸۰؛ موقعیت اصلی."></p><pre>python hades_composite.py portrait footage.mp4 HADES_Portrait_Native_REVIEW.png review.mp4</pre></section><p data-en="Requires Python 3 and FFmpeg/FFprobe. The script checks the exact title hash and footage dimensions/rate, preserves inputs, and writes a JSON receipt. Original title PNGs and footage are not hosted here. Real footage contrast, Mikhak and physical print remain OPEN. Neutral colors and system font are proposals." data-fa="نیازمند پایتون ۳ و FFmpeg/FFprobe است. هش دقیق عنوان و ابعاد و نرخ ویدیو بررسی می‌شوند؛ ورودی‌ها محفوظ می‌مانند و رسید JSON ساخته می‌شود. PNGهای اصلی عنوان و ویدیو در این صفحه میزبانی نشده‌اند. کنتراست ویدیوی واقعی، میخک و چاپ فیزیکی OPEN هستند. رنگ‌های خنثی و فونت سیستمی پیشنهادی‌اند."></p><footer><a id="back" href="download-desk.html" data-en="Download desk" data-fa="میز دانلود"></a></footer></main><script>
