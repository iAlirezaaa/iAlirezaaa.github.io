*{box-sizing:border-box}body{margin:0;background:#191918;color:#f4f0e8;font:16px/1.7 system-ui,Tahoma,sans-serif}main{max-width:760px;margin:auto;padding:20px 16px 40px}header{text-align:center;border-bottom:1px solid #625b50;padding-bottom:15px;letter-spacing:.12em;font-size:12px}h1{font-size:clamp(22px,5vw,30px);font-weight:450;line-height:1.35}p{margin:8px 0 16px}a{color:inherit;text-underline-offset:4px}button,input{font:inherit;color:inherit;max-width:100%;min-height:44px}button{background:#242321;border:1px solid #83796d;padding:8px 14px;cursor:pointer}label{display:block;margin-top:12px}input{width:100%;padding:6px 0}button:focus-visible,input:focus-visible,a:focus-visible{outline:2px solid #ef4b32;outline-offset:3px}canvas{display:block;width:100%;height:auto;border:1px solid #625b50;margin:16px 0}pre{white-space:pre-wrap;overflow-wrap:anywhere;direction:ltr;text-align:start;font:14px/1.6 monospace;border-block:1px solid #625b50;padding:12px 0}.muted{color:#c6baac;font-size:14px}nav{display:flex;flex-wrap:wrap;gap:14px;margin:12px 0}button[disabled]{opacity:.55;cursor:default}@media print{body{background:white;color:black}.muted{color:#333}button,input,nav{display:none}main{max-width:none;padding:0}canvas{max-height:100mm;object-fit:contain}}
</style><main><header>HADES · PUBLIC REVIEW</header><nav><button id="language" type="button">فارسی</button><a id="desk" href="download-desk.html#en">Download desk</a></nav><h1 id="title"></h1><p id="intro"></p><label for="bg" id="bgl"></label><input id="bg" type="file" accept="image/png,image/jpeg,image/webp"><label for="fg" id="fgl"></label><input id="fg" type="file" accept="image/png"><button id="run" type="button"></button> <button id="sample" type="button"></button><canvas id="proof" width="640" height="360" role="img" aria-label="Composite preview"></canvas><pre id="result" role="status" aria-live="polite"></pre><button id="save" type="button" disabled></button><p class="muted" id="note"></p><footer><a id="lib" href="/hades/library/">Library</a> · <a id="logo" href="/hades/brand-kit/logo-usage/">Logo usage</a></footer></main><script>
const $=id=>document.getElementById(id);let receipt=null,epoch=0;
const words={en:['Frame contrast check','Compare a full-frame opaque background and an equally sized transparent title PNG, locally. No upload or source modification.','Background image','Title overlay PNG','Measure contrast','Load technical example','Download JSON receipt','Review only. Measures pixels with alpha ≥ 230 against the original background after compositing; ratios 3 and 4.5 are screening references, not logo or accessibility certification. Edges below the alpha cutoff and temporal readability remain OPEN. Neutral colors and type are proposed.','Choose both images or load the technical example.','Images must have identical dimensions, at most 12 million pixels, an opaque background and a partially transparent overlay with eligible pixels.','Download desk','Library','Logo usage'],fa:['بررسی کنتراست فریم','یک فریم پس‌زمینهٔ مات و PNG شفاف عنوان با ابعاد برابر را به‌صورت محلی مقایسه کنید. هیچ فایلی آپلود یا تغییر داده نمی‌شود.','تصویر پس‌زمینه','PNG شفاف عنوان','محاسبهٔ کنتراست','نمونهٔ فنی آزمایشی','دریافت رسید JSON','فقط برای بازبینی. پیکسل‌های با آلفای ۲۳۰ یا بیشتر پس از ترکیب با پس‌زمینه سنجیده می‌شوند. نسبت‌های ۳ و ۴٫۵ صرفاً معیار غربالگری‌اند، نه تأیید لوگو یا دسترس‌پذیری. لبه‌ها و خوانایی زمانی OPEN هستند. رنگ‌های خنثی و فونت پیشنهادی‌اند.','هر دو تصویر را انتخاب کنید یا نمونهٔ فنی را باز کنید.','ابعاد باید یکسان و حداکثر ۱۲ میلیون پیکسل باشند؛ پس‌زمینه باید مات و لایهٔ عنوان تا حدی شفاف و دارای پیکسل قابل‌سنجش باشد.','میز دانلود','کتابخانه','راهنمای لوگو']};
function fa(){return location.hash==='#fa'}function w(){return words[fa()?'fa':'en']}function lang(){document.documentElement.lang=fa()?'fa':'en';document.documentElement.dir=fa()?'rtl':'ltr';['title','intro','bgl','fgl','run','sample','save','note'].forEach((id,i)=>$(id).textContent=w()[i]);$('language').textContent=fa()?'English':'فارسی';$('desk').textContent=w()[10];$('desk').href='download-desk.html'+(fa()?'#fa':'#en');$('lib').textContent=w()[11];$('logo').textContent=w()[12];$('lib').href='/hades/'+(fa()?'fa/':'')+'library/';$('logo').href='/hades/'+(fa()?'fa/':'')+'brand-kit/logo-usage/';if(!receipt)$('result').textContent=w()[8]}
function linear(x){x/=255;return x<=.04045?x/12.92:((x+.055)/1.055)**2.4}function lum(r,g,b){return .2126*linear(r)+.7152*linear(g)+.0722*linear(b)}
function measure(b,f){if(b.length!==f.length)throw Error('dimensions');let n=0,lo=Infinity,low3=0,low45=0,transparent=0;for(let i=0;i<b.length;i+=4){if(b[i+3]!==255)throw Error('background alpha');if(f[i+3]<255)transparent++;if(f[i+3]<230)continue;let a=f[i+3]/255,x=lum(b[i],b[i+1],b[i+2]),y=lum(...[0,1,2].map(j=>f[i+j]*a+b[i+j]*(1-a))),r=(Math.max(x,y)+.05)/(Math.min(x,y)+.05);n++;lo=Math.min(lo,r);if(r<3)low3++;if(r<4.5)low45++}if(!n||!transparent)throw Error('overlay');return{eligible_pixels:n,min_ratio:Number(lo.toFixed(4)),below_3:low3,below_4_5:low45}}
function surface(w,h){let c=document.createElement('canvas');c.width=w;c.height=h;return c}function pixels(c){return c.getContext('2d').getImageData(0,0,c.width,c.height).data}
function show(b,f,kind){let stats=measure(pixels(b),pixels(f));let c=$('proof');c.width=b.width;c.height=b.height;let x=c.getContext('2d');x.drawImage(b,0,0);x.drawImage(f,0,0);receipt={status:'REVIEW',source:kind,width:b.width,height:b.height,alpha_min:230,...stats};$('result').textContent=JSON.stringify(receipt,null,2);$('save').disabled=false}
function clear(){epoch++;receipt=null;$('save').disabled=true;$('result').textContent=w()[8]}
function sample(){clear();let b=surface(640,360),f=surface(640,360),x=b.getContext('2d'),y=f.getContext('2d');x.fillStyle='#242321';x.fillRect(0,0,320,360);x.fillStyle='#f4f0e8';x.fillRect(320,0,320,360);y.fillStyle='#f4f0e8';y.fillRect(80,158,480,4);y.fillStyle='#ef4b32';y.fillRect(80,178,480,4);show(b,f,'synthetic technical swatches — not a logo')}
async function run(){clear();let id=epoch,bb,ff;try{bb=await createImageBitmap($('bg').files[0]);ff=await createImageBitmap($('fg').files[0]);if(id!==epoch)return;if(bb.width!==ff.width||bb.height!==ff.height||bb.width*bb.height>12000000)throw Error('size');let b=surface(bb.width,bb.height),f=surface(ff.width,ff.height);b.getContext('2d').drawImage(bb,0,0);f.getContext('2d').drawImage(ff,0,0);show(b,f,'local files')}catch(e){if(id===epoch)$('result').textContent=w()[9]}finally{bb?.close();ff?.close()}}
$('run').onclick=run;$('sample').onclick=sample;$('bg').onchange=clear;$('fg').onchange=clear;$('language').onclick=()=>location.hash=fa()?'en':'fa';$('save').onclick=()=>{if(!receipt)return;let u=URL.createObjectURL(new Blob([JSON.stringify(receipt,null,2)],{type:'application/json'})),a=document.createElement('a');a.href=u;a.download='HADES_Frame_Contrast_REVIEW.json';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)};addEventListener('hashchange',lang);lang();sample();
</script></html>
