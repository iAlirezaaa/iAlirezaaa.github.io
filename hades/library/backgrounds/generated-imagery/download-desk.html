const words={en:{native:'Verify a local original RGBA title PNG (SHA-256)',inventory:'Download complete inventory (CSV)',sub:'Repository-verified assets · live HTTP OPEN',title:'Download desk',intro:'Find public REVIEW files by name or format. Verify a saved copy locally before using it.',search:'Search assets',filter:'Format',all:'All formats',verify:'Verify a downloaded file',explain:'Checks size and Git blob SHA-1 against the recorded repository version. This is an identity check, not a safety or design approval. Files stay on your device.',expected:'Expected asset',file:'Select downloaded file',open:'Still OPEN',missing:'Native RGBA portrait and landscape overlays, original generated artwork, source MP4s, live HTTP verification, Mikhak and physical print.',back:'Imagery library',library:'All brand assets',download:'Download',bytes:'bytes',match:'MATCH — exact recorded Git blob',mismatch:'MISMATCH — not the recorded file',unavailable:'Verification unavailable in this browser/context',choose:'Select a file to check'},fa:{native:'بررسی PNG اصلی عنوان در دستگاه (SHA-256)',inventory:'دریافت فهرست کامل دارایی‌ها (CSV)',sub:'دارایی‌های تأییدشده در ریپو · HTTP زنده OPEN',title:'میز دانلود',intro:'فایل‌های عمومی REVIEW را با نام یا فرمت پیدا کنید و نسخهٔ دریافت‌شده را پیش از استفاده به‌صورت محلی بررسی کنید.',search:'جست‌وجوی دارایی',filter:'فرمت',all:'همهٔ فرمت‌ها',verify:'بررسی فایل دریافت‌شده',explain:'اندازه و هش Git blob SHA-1 با نسخهٔ ثبت‌شده در ریپو مقایسه می‌شود. این آزمون هویت فایل است، نه تأیید امنیت یا طراحی. فایل روی دستگاه شما می‌ماند.',expected:'دارایی مورد انتظار',file:'انتخاب فایل دریافت‌شده',open:'موارد باز · OPEN',missing:'لایه‌های اصلی RGBA عمودی و افقی، تصاویر تولیدشدهٔ اصلی، MP4های منبع، تأیید HTTP زنده، فونت میخک و چاپ فیزیکی.',back:'کتابخانهٔ تصاویر',library:'همهٔ دارایی‌های برند',download:'دریافت',bytes:'بایت',match:'MATCH — مطابق فایل ثبت‌شده در Git',mismatch:'MISMATCH — فایل با نسخهٔ ثبت‌شده یکسان نیست',unavailable:'بررسی در این مرورگر یا محیط در const $=id=>document.getElementById(id);let fa=false,epoch=0;const t=k=>words[fa?'fa':'en'][k];function dimensions(el,value){let start=0;for(const m of value.matchAll(/[0-9۰-۹]+ × [0-9۰-۹]+/g)){el.append(value.slice(start,m.index));const b=document.createElement('bdi');b.dir='ltr';b.textContent=m[0];el.append(b);start=m.index+m[0].length}el.append(value.slice(start))}function render(){const q=$('search').value.trim().toLocaleLowerCase(),f=$('filter').value;const visible=assets.filter(a=>(f==='all'||a[1]===f)&&a.join(' ').toLocaleLowerCase().includes(q));$('entries').replaceChildren();for(const a of visible){const el=document.createElement('article');el.className='entry';const h=document.createElement('h2');dimensions(h,a[fa?5:4]);const p=document.createElement('p');dimensions(p,a[fa?7:6]);const info=document.createElement('p');info.className='muted';const b=document.createElement('bdi');b.textContent=a[1]+' · '+a[2].toLocaleString('en-US');info.append(b,' '+t('bytes')+' · REVIEW');const link=document.createElement('a');link.href=a[0];link.download=a[0];link.textContent=t('download')+' '+a[1];el.append(h,p,info,link);$('entries').append(el)}$('count').textContent=visible.length+' / '+assets.length;}
function language(){fa=location.hash==='#fa';document.documentElement.lang=fa?'fa':'en';document.documentElement.dir=fa?'rtl':'ltr';document.querySelectorAll('[data-i]').forEach(el=>el.textContent=t(el.dataset.i));$('switch').textContent=fa?'English':'فارسی';$('switch').setAttribute('aria-label',fa?'تغییر زبان به انگلیسی':'Switch to Persian');$('native').href='native-overlay-receipt.html'+(fa?'#fa':'');$('back').href='/hades/'+(fa?'fa/':'')+'library/backgrounds/generated-imagery/';$('library').href='/hades/'+(fa?'fa/':'')+'library/';const old=$('asset').value;$('asset').replaceChildren(...assets.map((a,i)=>new Option(a[fa?5:4],i)));$('asset').value=old||'0';render();verify()}
function sha1(data){const n=((data.length+9+63)>>6)<<6,b=new Uint8Array(n);b.set(data);b[data.length]=128;const d=new DataView(b.buffer);d.setUint32(n-4,data.length*8);let h=[0x67452301,0xefcdab89,0x98badcfe,0x10325476,0xc3d2e1f0];const w=new Uint32Array(80),rot=(v,k)=>(v<<k)|(v>>>(32-k));for(let i=0;i<n;i+=64){for(let j=0;j<16;j++)w[j]=d.getUint32(i+4*j);for(let j=16;j<80;j++)w[j]=rot(w[j-3]^w[j-8]^w[j-14]^w[j-16],1);let [a,c,e,f,g]=h;for(let j=0;j<80;j++){const k=j<20?0x5a827999:j<40?0x6ed9eba1:j<60?0x8f1bbcdc:0xca62c1d6;const v=j<20?(c&e)|(~c&f):j<40?c^e^f:j<60?(c&e)|(c&f)|(e&f):c^e^f;const z=(rot(a,5)+v+g+k+w[j])|0;g=f;f=e;e=rot(c,30);c=a;a=z}h=h.map((v,j)=>(v+[a,c,e,f,g][j])>>>0)}return h.map(v=>v.toString(16).padStart(8,'0')).join('')}
async function verify(){const id=++epoch,f=$('file').files[0],a=assets[Number($('asset').value)];if(!f){$('result').textContent=t('choose');return}if(f.size!==a[2]){$('result').textContent=t('mismatch');return}try{const body=new Uint8Array(await f.arrayBuffer());const prefix=new TextEncoder().encode('blob '+body.length+'\0');const data=new Uint8Array(prefix.length+body.length);data.set(prefix);data.set(body,prefix.length);const sha=sha1(data);if(id===epoch)$('result').textContent=t(sha===a[3]?'match':'mismatch')+' · '+sha}catch(e){if(id===epoch)$('result').textContent=t('unavailable')}}
